<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get 2FA Code</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-highlight: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            --primary-glow: #007aff;
            --secondary-glow: #5856d6;
            --accent-glow: #5ac8fa;
            --danger-glow: #ff2d55;
            --success-glow: #34c759;
            --text-color: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border-radius: 20px;
            --btn-radius: 12px;
            --primary-blue: #0d6efd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(125deg, #1e3c72, #2a5298, #2b32b2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background elements */
        .bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 10%, transparent 70%);
            filter: blur(30px);
        }

        .circle-1 {
            top: 15%;
            left: 10%;
            width: 300px;
            height: 300px;
            opacity: 0.4;
            animation: float 25s infinite alternate ease-in-out;
        }

        .circle-2 {
            bottom: 10%;
            right: 15%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--secondary-glow) 10%, transparent 70%);
            opacity: 0.3;
            animation: float 30s infinite alternate-reverse ease-in-out;
        }

        .circle-3 {
            top: 40%;
            right: 25%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, var(--accent-glow) 10%, transparent 70%);
            opacity: 0.2;
            animation: float 20s infinite alternate ease-in-out;
        }

        .glass-sphere {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.1) 60%, rgba(255, 255, 255, 0) 70%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .sphere-1 {
            top: 20%;
            left: 5%;
            animation: bounce 15s infinite alternate ease-in-out;
        }

        .sphere-2 {
            bottom: 15%;
            right: 10%;
            width: 80px;
            height: 80px;
            animation: bounce 12s infinite alternate-reverse ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(30px, -30px);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-40px);
            }
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 1;
        }

        /* Glass card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            box-shadow: var(--glass-shadow);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        /* Glass shine effect */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                var(--glass-highlight),
                transparent
            );
            transition: 0.5s;
        }

        .glass-card:hover::before {
            left: 100%;
        }

        /* App header */
        .app-header {
            text-align: center;
            margin-bottom: 10px;
            padding-bottom: 20px;
        }

        .app-title {
            font-size: 42px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .app-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
        }

        /* Split layout for generator and saved codes */
        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        /* Generator section */
        .generator-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent-glow);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .glass-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: var(--btn-radius);
            padding: 15px;
            color: var(--text-color);
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .glass-input:focus {
            outline: none;
            border-color: var(--primary-glow);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.3);
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Token display */
        .token-display {
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--btn-radius);
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .token-display:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .token-value {
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 42px;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .timer-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .timer-bar {
            height: 100%;
            background: linear-gradient(to right, var(--primary-glow), var(--accent-glow));
            border-radius: 3px;
            transition: width 1s linear;
            box-shadow: 0 0 8px rgba(90, 200, 250, 0.5);
        }

        .timer-text {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        /* Button styles */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .glass-btn {
            flex: 1;
            padding: 12px 15px;
            border-radius: var(--btn-radius);
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .glass-btn i {
            font-size: 14px;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border: none;
            box-shadow: 0 5px 15px rgba(0, 122, 255, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.5);
        }

        .btn-danger {
            background: rgba(255, 45, 85, 0.2);
            color: #ffb3c0;
        }

        .btn-danger:hover {
            background: rgba(255, 45, 85, 0.3);
        }

        /* Tab navigation for saved codes section */
        .tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            position: relative;
        }

        .tab {
            padding: 15px 20px;
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: none;
            border: none;
            text-align: center;
        }

        .tab.active {
            color: var(--text-color);
        }

        .tab-indicator {
            position: absolute;
            bottom: -1px;
            left: 0;
            height: 3px;
            width: 50%;
            background: linear-gradient(to right, var(--primary-glow), var(--secondary-glow));
            transition: transform 0.3s ease;
            border-radius: 3px 3px 0 0;
        }

        /* Saved codes section */
        .saved-codes-list {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 20px;
        }

        .saved-codes-list::-webkit-scrollbar {
            width: 6px;
        }

        .saved-codes-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .saved-codes-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .saved-code-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--btn-radius);
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .saved-code-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .saved-code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .saved-code-label {
            font-size: 15px;
            color: var(--text-color);
            font-weight: 500;
        }

        .saved-code-time {
            font-size: 14px;
            color: var(--text-color);
            background: rgba(0, 122, 255, 0.3);
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: 500;
        }

        .saved-code-value {
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 30px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 15px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .saved-code-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: var(--btn-radius);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-load {
            background: rgba(0, 122, 255, 0.2);
        }

        .btn-load:hover {
            background: rgba(0, 122, 255, 0.3);
        }

        .btn-copy {
            background: rgba(90, 200, 250, 0.2);
        }

        .btn-copy:hover {
            background: rgba(90, 200, 250, 0.3);
        }

        .btn-delete {
            background: rgba(255, 45, 85, 0.2);
        }

        .btn-delete:hover {
            background: rgba(255, 45, 85, 0.3);
        }

        .add-code-btn {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            color: white;
            border: none;
            border-radius: var(--btn-radius);
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 122, 255, 0.3);
        }

        .add-code-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state p {
            margin-bottom: 5px;
        }

        /* Settings section */
        .settings-content {
            display: none;
        }

        .settings-content.active {
            display: block;
        }

        /* Period select styling - SỬA PHẦN NÀY */
        select#period {
            background-color: #0d6efd !important;
            color: white !important;
            font-weight: bold !important;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 450px;
            box-shadow: var(--glass-shadow);
            transform: scale(0.95);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: var(--text-color);
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Confirmation Modal - ĐÃ SỬA ĐẸP HƠN */
        #confirmDeleteModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        #confirmDeleteModal.active {
            opacity: 1;
            visibility: visible;
        }

        .confirm-modal-content {
            background-color: white;
            border-radius: 8px;
            max-width: 350px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transform: scale(0.95);
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        #confirmDeleteModal.active .confirm-modal-content {
            transform: scale(1);
        }

        .confirm-modal-header {
            padding: 15px 20px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .confirm-modal-title {
            font-size: 16px;
            color: #212529;
            font-weight: 500;
        }

        .confirm-modal-body {
            padding: 20px;
            color: #212529;
        }

        .confirm-modal-footer {
            display: flex;
            justify-content: center;
            padding: 15px 20px;
            gap: 20px;
        }

        .confirm-btn {
            width: 80px;
            padding: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-ok {
            background-color: #6c757d;
            color: white;
        }

        .btn-ok:hover {
            background-color: #5a6268;
        }

        .btn-cancel {
            background-color: #adb5bd;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #98a2ac;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px 20px;
            box-shadow: var(--glass-shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-color);
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 1000;
            max-width: 350px;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .notification-success {
            border-left: 4px solid var(--success-glow);
        }

        .notification-success i {
            color: var(--success-glow);
            font-size: 20px;
        }

        .notification-error {
            border-left: 4px solid var(--danger-glow);
        }

        .notification-error i {
            color: var(--danger-glow);
            font-size: 20px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .split-layout {
                grid-template-columns: 1fr;
            }
            
            .glass-card {
                padding: 20px;
            }
            
            .app-title {
                font-size: 36px;
            }
            
            .token-value {
                font-size: 34px;
            }
            
            .saved-code-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Background elements -->
    <div class="bg-elements">
        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>
        <div class="bg-circle circle-3"></div>
        <div class="glass-sphere sphere-1"></div>
        <div class="glass-sphere sphere-2"></div>
    </div>

    <div class="container">
        <!-- App header -->
        <div class="app-header">
            <h1 class="app-title">Get 2FA Code</h1>
            <p class="app-subtitle">Generate and manage two-factor authentication codes.</p>
        </div>

        <!-- Main content - split layout -->
        <div class="split-layout">
            <!-- Generator section -->
            <div class="glass-card generator-section">
                <div class="section-title">
                    <i class="fas fa-key"></i> Generate Code
                </div>
                
                <div class="input-group">
                    <label class="input-label" for="secretInput">Secret Key</label>
                    <input type="text" id="secretInput" class="glass-input" placeholder="Enter your 2FA secret key" autocomplete="off">
                </div>

                <div class="token-display" id="tokenDisplay">
                    <div class="token-value" id="token">------</div>
                    <div class="timer-container">
                        <div class="timer-bar" id="timerBar"></div>
                    </div>
                    <div class="timer-text">
                        Refreshes in <span id="secondsCounter">30</span> seconds
                    </div>
                </div>

                <div class="button-group">
                    <button class="glass-btn btn-primary" id="generateBtn">
                        <i class="fas fa-sync-alt"></i> Generate
                    </button>
                    <button class="glass-btn" id="copyBtn">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                    <button class="glass-btn" id="saveBtn">
                        <i class="fas fa-save"></i> Save
                    </button>
                    <button class="glass-btn btn-danger" id="clearBtn">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
            </div>

            <!-- Saved codes section -->
            <div class="glass-card">
                <div class="tabs">
                    <button class="tab active" data-tab="saved">Saved Codes</button>
                    <button class="tab" data-tab="settings">Settings</button>
                    <div class="tab-indicator"></div>
                </div>

                <!-- Saved codes content -->
                <div class="saved-codes-content">
                    <div class="saved-codes-list" id="savedCodesList">
                        <!-- Empty state will show by default -->
                        <div class="empty-state" id="emptyState">
                            <i class="fas fa-folder-open"></i>
                            <p>No saved codes yet</p>
                            <p style="font-size: 14px; opacity: 0.7;">Save codes using the Save button</p>
                        </div>
                        
                        <!-- Saved codes will be added here dynamically -->
                    </div>

                    <button class="add-code-btn" id="addNewBtn">
                        <i class="fas fa-plus"></i> Add New Code
                    </button>
                </div>

                <!-- Settings content -->
                <div class="settings-content">
                    <div class="input-group">
                        <label class="input-label" for="algorithm">Algorithm</label>
                        <select class="glass-input" id="algorithm">
                            <option value="SHA-1">SHA-1 (Default)</option>
                            <option value="SHA-256">SHA-256</option>
                            <option value="SHA-512">SHA-512</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="digits">Digits</label>
                        <select class="glass-input" id="digits">
                            <option value="6">6 digits (Default)</option>
                            <option value="7">7 digits</option>

    <!-- Include crypto-js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script>
        // Ngăn chặn view source
        document.addEventListener('keydown', function(event) {
            // Chặn F12
            if (event.keyCode === 123) {
                event.preventDefault();
                return false;
            }
            
            // Chặn Ctrl+U
            if (event.ctrlKey && event.keyCode === 85) {
                event.preventDefault();
                return false;
            }
            
            // Chặn Ctrl+Shift+I
            if (event.ctrlKey && event.shiftKey && event.keyCode === 73) {
                event.preventDefault();
                return false;
            }
            
            // Chặn Ctrl+Shift+J
            if (event.ctrlKey && event.shiftKey && event.keyCode === 74) {
                event.preventDefault();
                return false;
            }
            
            // Chặn Ctrl+Shift+C
            if (event.ctrlKey && event.shiftKey && event.keyCode === 67) {
                event.preventDefault();
                return false;
            }
        });
        
        // Vô hiệu hóa chuột phải
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
            return false;
        });

        // DOM Elements
        const secretInput = document.getElementById('secretInput');
        const token = document.getElementById('token');
        const timerBar = document.getElementById('timerBar');
        const secondsCounter = document.getElementById('secondsCounter');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const saveBtn = document.getElementById('saveBtn');
        const clearBtn = document.getElementById('clearBtn');
        const tokenDisplay = document.getElementById('tokenDisplay');
        const savedCodesList = document.getElementById('savedCodesList');
        const emptyState = document.getElementById('emptyState');
        const addNewBtn = document.getElementById('addNewBtn');
        const tabs = document.querySelectorAll('.tab');
        const tabIndicator = document.querySelector('.tab-indicator');
        const savedCodesContent = document.querySelector('.saved-codes-content');
        const settingsContent = document.querySelector('.settings-content');
        const algorithmSelect = document.getElementById('algorithm');
        const digitsSelect = document.getElementById('digits');
        const periodSelect = document.getElementById('period');
        const addModal = document.getElementById('addModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const newLabel = document.getElementById('newLabel');
        const newSecret = document.getElementById('newSecret');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveNewBtn = document.getElementById('saveNewBtn');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        
        // Các phần tử mới thêm vào
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const serverUrl = document.getElementById('serverUrl');
        const apiKey = document.getElementById('apiKey');
        const backupBtn = document.getElementById('backupBtn');
        const restoreBtn = document.getElementById('restoreBtn');
        const lastBackupInfo = document.getElementById('lastBackupInfo');
        
        // Elements cho confirm dialog
        const confirmDeleteModal = document.getElementById('confirmDeleteModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const deleteConfirmMessage = document.getElementById('deleteConfirmMessage');
        let codeToDelete = -1; // Lưu index của mã sẽ xóa

        // Variables
        let timer;
        let currentToken = '';
        let lastSecretInput = '';
        let savedCodes = [];
        let autoSaveTimer; // Timer cho việc tự động sao lưu

        // Base32 decoding
        function base32ToHex(base32) {
            // Base32 character set
            const base32chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            
            // Remove spaces and padding, convert to uppercase
            base32 = base32.replace(/\s+/g, '').toUpperCase().replace(/=+$/, '');
            
            // Validate characters
            if (!base32.match(/^[A-Z2-7]+$/i)) {
                throw new Error('Invalid base32 characters');
            }
            
            let bits = '';
            let hex = '';
            
            // Convert to bits
            for (let i = 0; i < base32.length; i++) {
                const val = base32chars.indexOf(base32[i]);
                bits += val.toString(2).padStart(5, '0');
            }
            
            // Convert bits to hex
            for (let i = 0; i + 4 <= bits.length; i += 4) {
                const chunk = bits.substring(i, i + 4);
                hex += parseInt(chunk, 2).toString(16);
            }
            
            return hex;
        }

        // Generate TOTP code
        function generateTOTP(secret, period = 30, digits = 6, algorithm = 'SHA-1') {
            try {
                // Convert secret to hex
                const hexSecret = base32ToHex(secret);
                
                // Calculate counter value (floor(current Unix time / period))
                const epoch = Math.floor(Date.now() / 1000);
                const counter = Math.floor(epoch / period);
                
                // Convert counter to hex and pad to 16 characters
                const counterHex = counter.toString(16).padStart(16, '0');
                
                // Create word arrays for HMAC
                const secretWordArray = CryptoJS.enc.Hex.parse(hexSecret);
                const counterWordArray = CryptoJS.enc.Hex.parse(counterHex);
                
                // Compute HMAC
                let hmacObj;
                if (algorithm === 'SHA-1') {
                    hmacObj = CryptoJS.HmacSHA1(counterWordArray, secretWordArray);
                } else if (algorithm === 'SHA-256') {
                    hmacObj = CryptoJS.HmacSHA256(counterWordArray, secretWordArray);
                } else if (algorithm === 'SHA-512') {
                    hmacObj = CryptoJS.HmacSHA512(counterWordArray, secretWordArray);
                }
                
                const hmac = hmacObj.toString(CryptoJS.enc.Hex);
                
                // Dynamic truncation
                const offset = parseInt(hmac.substr(hmac.length - 1), 16);
                const binary = parseInt(hmac.substr(offset * 2, 8), 16) & 0x7fffffff;
                
                // Calculate TOTP value
                const otp = binary % Math.pow(10, digits);
                const code = otp.toString().padStart(digits, '0');
                
                // Calculate remaining time
                const secondsRemaining = period - (epoch % period);
                
                return {
                    code,
                    secondsRemaining
                };
            } catch (error) {
                console.error('TOTP generation failed:', error);
                return null;
            }
        }

        // Update timer display
        function updateTimer(secondsRemaining, period) {
            // Update timer bar
            const percentage = (secondsRemaining / period) * 100;
            timerBar.style.width = `${percentage}%`;
            secondsCounter.textContent = secondsRemaining;
            
            // Change color when close to expiration
            if (secondsRemaining <= 5) {
                timerBar.style.background = 'linear-gradient(to right, #ff2d55, #ff9500)';
            } else {
                timerBar.style.background = 'linear-gradient(to right, #007aff, #5ac8fa)';
            }
        }

        // Generate and display token
        function generateToken() {
            const secret = secretInput.value.trim().replace(/\s+/g, '');
            
            if (!secret) {
                token.textContent = '------';
                clearInterval(timer);
                timerBar.style.width = '0%';
                return;
            }
            
            const period = parseInt(periodSelect.value);
            const digits = parseInt(digitsSelect.value);
            const algorithm = algorithmSelect.value;
            
            try {
                const result = generateTOTP(secret, period, digits, algorithm);
                
                if (!result) {
                    token.textContent = 'ERROR';
                    return;
                }
                
                const { code, secondsRemaining } = result;
                
                // Update only if token changes
                if (code !== currentToken) {
                    token.style.opacity = '0';
                    setTimeout(() => {
                        currentToken = code;
                        token.textContent = code;
                        token.style.opacity = '1';
                        token.style.transition = 'opacity 0.3s ease';
                    }, 100);
                }
                
                updateTimer(secondsRemaining, period);
                lastSecretInput = secret;
                
                return result;
            } catch (error) {
                console.error('Token generation failed:', error);
                token.textContent = 'ERROR';
                return null;
            }
        }

        // Start continuous token updates
        function startTokenUpdates() {
            // Clear existing timer
            if (timer) {
                clearInterval(timer);
            }
            
            // Generate initial token
            const result = generateToken();
            if (!result) return;
            
            // Set up timer for updates
            timer = setInterval(generateToken, 1000);
        }

        // Copy token to clipboard
        function copyToClipboard() {
            if (currentToken && currentToken !== '------' && currentToken !== 'ERROR') {
                navigator.clipboard.writeText(currentToken)
                    .then(() => {
                        showNotification('Code copied to clipboard', 'success');
                    })
                    .catch(err => {
                        console.error('Copy failed:', err);
                        showNotification('Failed to copy code', 'error');
                    });
            } else {
                showNotification('No valid code to copy', 'error');
            }
        }

        // Save current code
        function saveCurrentCode() {
            if (currentToken && currentToken !== '------' && currentToken !== 'ERROR') {
                newSecret.value = secretInput.value.trim();
                newLabel.value = '';
                openModal();
            } else {
                showNotification('Generate a valid code first', 'error');
            }
        }

        // Clear input and token
        function clearAll() {
            secretInput.value = '';
            token.textContent = '------';
            currentToken = '';
            timerBar.style.width = '0%';
            clearInterval(timer);
            showNotification('Input cleared', 'success');
        }

        // Show notification
        function showNotification(message, type = 'success') {
            notification.className = 'notification';
            notification.classList.add(`notification-${type}`);
            
            if (type === 'success') {
                notification.querySelector('i').className = 'fas fa-check-circle';
            } else {
                notification.querySelector('i').className = 'fas fa-exclamation-circle';
            }
            
            notificationText.textContent = message;
            notification.classList.add('show');
            
            // Hide after 3 seconds
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Open modal
        function openModal() {
            addModal.classList.add('active');
            setTimeout(() => newLabel.focus(), 300);
        }

        // Close modal
        function closeModal() {
            addModal.classList.remove('active');
        }

        // Add new code to saved list
        function addNewCode() {
            const label = newLabel.value.trim() || 'Unnamed';
            const secret = newSecret.value.trim();
            
            if (!secret) {
                showNotification('Secret key is required', 'error');
                return;
            }
            
            // Validate by generating a code
            try {
                const result = generateTOTP(secret);
                
                if (!result) {
                    showNotification('Invalid secret key', 'error');
                    return;
                }
                
                // Create new code object
                const newCode = {
                    id: Date.now(),
                    label,
                    secret,
                    algorithm: algorithmSelect.value,
                    digits: parseInt(digitsSelect.value),
                    period: parseInt(periodSelect.value)
                };
                
                // Add to start of array
                savedCodes.unshift(newCode);
                
                // Save to localStorage
                saveToLocalStorage();
                
                // Update UI
                updateSavedCodesList();
                
                // Close modal
                closeModal();
                
                showNotification(`Code saved: ${label}`, 'success');
                
                // Switch to saved codes tab if needed
                showSavedCodesTab();
            } catch (error) {
                console.error('Validation error:', error);
                showNotification('Invalid secret key', 'error');
            }
        }

        // Update saved codes list in UI
        function updateSavedCodesList() {
            // Remove existing code items
            const codeItems = savedCodesList.querySelectorAll('.saved-code-item');
            codeItems.forEach(item => item.remove());
            
            // Show empty state if no codes
            if (savedCodes.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            
            // Hide empty state
            emptyState.style.display = 'none';
            
            // Add each saved code
            savedCodes.forEach((code, index) => {
                // Generate current code value
                const result = generateTOTP(
                    code.secret,
                    code.period || 30,
                    code.digits || 6,
                    code.algorithm || 'SHA-1'
                );
                
                const currentCode = result ? result.code : 'ERROR';
                const secondsRemaining = result ? result.secondsRemaining : 0;
                
                const codeItem = document.createElement('div');
                codeItem.className = 'saved-code-item';
                codeItem.innerHTML = `
                    <div class="saved-code-header">
                        <div class="saved-code-label">${code.label}</div>
                        <div class="saved-code-time">${secondsRemaining}s</div>
                    </div>
                    <div class="saved-code-value">${currentCode}</div>
                    <div class="saved-code-actions">
                        <button class="action-btn btn-load" data-index="${index}">
                            <i class="fas fa-sync-alt"></i> Load
                        </button>
                        <button class="action-btn btn-copy" data-code="${currentCode}">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                        <button class="action-btn btn-delete" data-index="${index}">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                `;
                
                savedCodesList.appendChild(codeItem);
            });
            
            // Add event listeners to buttons
            addButtonEventListeners();
        }

        // Add event listeners to saved code buttons
        function addButtonEventListeners() {
            document.querySelectorAll('.btn-load').forEach(btn => {
                btn.addEventListener('click', e => {
                    const index = parseInt(e.currentTarget.getAttribute('data-index'));
                    loadSavedCode(index);
                });
            });
            
            document.querySelectorAll('.btn-copy').forEach(btn => {
                btn.addEventListener('click', e => {
                    const code = e.currentTarget.getAttribute('data-code');
                    copySavedCode(code);
                });
            });
            
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', e => {
                    const index = parseInt(e.currentTarget.getAttribute('data-index'));
                    deleteSavedCode(index);
                });
            });
        }

        // Load saved code to generator
        function loadSavedCode(index) {
            const code = savedCodes[index];
            if (!code) return;
            
            secretInput.value = code.secret;
            
            // Apply settings if they exist
            if (code.algorithm) algorithmSelect.value = code.algorithm;
            if (code.digits) digitsSelect.value = code.digits;
            if (code.period) periodSelect.value = code.period;
            
            // Generate token
            startTokenUpdates();
            
            showNotification(`Loaded: ${code.label}`, 'success');
        }

        // Copy a saved code
        function copySavedCode(code) {
            if (code && code !== 'ERROR') {
                navigator.clipboard.writeText(code)
                    .then(() => {
                        showNotification('Code copied to clipboard', 'success');
                    })
                    .catch(err => {
                        console.error('Copy failed:', err);
                        showNotification('Failed to copy code', 'error');
                    });
            } else {
                showNotification('Invalid code', 'error');
            }
        }

        // Delete a saved code - ĐÃ SỬA
        function deleteSavedCode(index) {
            const code = savedCodes[index];
            if (!code) return;
            
            // Hiển thị hộp thoại xác nhận tùy chỉnh
            codeToDelete = index;
            deleteConfirmMessage.textContent = `Delete "${code.label}" from saved codes?`;
            confirmDeleteModal.classList.add('active');
        }

        // Show saved codes tab
        function showSavedCodesTab() {
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
            tabIndicator.style.transform = 'translateX(0)';
            savedCodesContent.style.display = 'block';
            settingsContent.style.display = 'none';
            updateSavedCodesList();
        }

        // Show settings tab
        function showSettingsTab() {
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
            tabIndicator.style.transform = 'translateX(100%)';
            savedCodesContent.style.display = 'none';
            settingsContent.style.display = 'block';
        }

        // Initialize saved codes - ĐÃ ĐƯỢC SỬA ĐỔI
        function initSavedCodes() {
            // Tải mã đã lưu từ localStorage
            const savedCodesStr = localStorage.getItem('savedCodes');
            
            if (savedCodesStr) {
                try {
                    savedCodes = JSON.parse(savedCodesStr);
                    emptyState.style.display = savedCodes.length > 0 ? 'none' : 'block';
                    showNotification('Loaded saved codes from browser storage', 'success');
                } catch (e) {
                    console.error('Error loading saved codes:', e);
                    
                    // Thử phục hồi từ bản sao lưu
                    const backupCodesStr = localStorage.getItem('savedCodes_backup');
                    if (backupCodesStr) {
                        try {
                            savedCodes = JSON.parse(backupCodesStr);
                            localStorage.setItem('savedCodes', JSON.stringify(savedCodes));
                            emptyState.style.display = savedCodes.length > 0 ? 'none' : 'block';
                            showNotification('Restored codes from backup', 'success');
                        } catch (e) {
                            console.error('Error loading backup:', e);
                            savedCodes = [];
                            emptyState.style.display = 'block';
                        }
                    } else {
                        savedCodes = [];
                        emptyState.style.display = 'block';
                    }
                }
            } else {
                // Thử phục hồi từ bản sao lưu nếu không có dữ liệu chính
                const backupCodesStr = localStorage.getItem('savedCodes_backup');
                if (backupCodesStr) {
                    try {
                        savedCodes = JSON.parse(backupCodesStr);
                        localStorage.setItem('savedCodes', JSON.stringify(savedCodes));
                        emptyState.style.display = savedCodes.length > 0 ? 'none' : 'block';
                        showNotification('Restored from backup', 'success');
                    } catch (e) {
                        console.error('Error loading backup:', e);
                        savedCodes = [];
                        emptyState.style.display = 'block';
                    }
                } else {
                    savedCodes = [];
                    emptyState.style.display = 'block';
                }
            }
            
            // Cập nhật thông tin bản sao lưu
            updateBackupInfo();
        }

        // Tải cài đặt server
        function loadServerSettings() {
            serverUrl.value = localStorage.getItem('2fa_server_url') || '';
            apiKey.value = localStorage.getItem('2fa_server_key') || '';
        }

        // Lưu cài đặt server
        function saveServerSettings() {
            localStorage.setItem('2fa_server_url', serverUrl.value);
            localStorage.setItem('2fa_server_key', apiKey.value);
            showNotification('Server settings saved', 'success');
        }

        // Lưu vào localStorage
        function saveToLocalStorage() {
            localStorage.setItem('savedCodes', JSON.stringify(savedCodes));
            
            // Tạo bản sao lưu tự động
            createBackup(false);
        }

        // Tạo bản sao lưu
        function createBackup(showMessage = true) {
            if (savedCodes.length > 0) {
                const now = new Date();
                const backupData = {
                    codes: savedCodes,
                    timestamp: now.getTime(),
                    date: now.toLocaleString()
                };
                
                localStorage.setItem('savedCodes_backup', JSON.stringify(backupData));
                
                if (showMessage) {
                    showNotification('Backup created successfully', 'success');
                }
                
                updateBackupInfo();
            } else {
                if (showMessage) {
                    showNotification('No codes to backup', 'error');
                }
            }
        }

        // Phục hồi từ bản sao lưu
        function restoreFromBackup() {
            const backupStr = localStorage.getItem('savedCodes_backup');
            
            if (!backupStr) {
                showNotification('No backup found', 'error');
                return;
            }
            
            try {
                const backupData = JSON.parse(backupStr);
                
                if (!backupData.codes || !Array.isArray(backupData.codes)) {
                    showNotification('Invalid backup data', 'error');
                    return;
                }
                
                // Xác nhận phục hồi
                if (confirm(`Restore backup from ${backupData.date || 'unknown time'}?`)) {
                    savedCodes = backupData.codes;
                    saveToLocalStorage();
                    updateSavedCodesList();
                    showNotification('Backup restored successfully', 'success');
                }
            } catch (e) {
                console.error('Error restoring backup:', e);
                showNotification('Failed to restore backup', 'error');
            }
        }

        // Cập nhật thông tin bản sao lưu
        function updateBackupInfo() {
            const backupStr = localStorage.getItem('savedCodes_backup');
            
            if (backupStr) {
                try {
                    const backupData = JSON.parse(backupStr);
                    if (backupData.date) {
                        lastBackupInfo.textContent = `Last backup: ${backupData.date}`;
                    } else {
                        lastBackupInfo.textContent = 'Backup available (unknown date)';
                    }
                } catch (e) {
                    lastBackupInfo.textContent = 'Backup data corrupted';
                }
            } else {
                lastBackupInfo.textContent = 'No backup available';
            }
        }

        // Xuất dữ liệu lên server
        function exportToServer() {
            const url = serverUrl.value.trim();
            if (!url) {
                showNotification('Please enter server URL', 'error');
                return;
            }
            
            saveServerSettings();
            
            // Chuẩn bị dữ liệu để xuất
            const exportData = {
                codes: savedCodes,
                timestamp: new Date().getTime(),
                deviceInfo: navigator.userAgent
            };
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': apiKey.value ? `Bearer ${apiKey.value}` : ''
                },
                body: JSON.stringify(exportData)
            })
            .then(response => {
                if (!response.ok) throw new Error('Server responded with an error');
                return response.json();
            })
            .then(data => {
                showNotification('Successfully exported to server', 'success');
            })
            .catch(error => {
                console.error('Export error:', error);
                showNotification('Failed to export: ' + error.message, 'error');
            });
        }

        // Nhập dữ liệu từ server
        function importFromServer() {
            const url = serverUrl.value.trim();
            if (!url) {
                showNotification('Please enter server URL', 'error');
                return;
            }
            
            saveServerSettings();
            
            fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': apiKey.value ? `Bearer ${apiKey.value}` : ''
                }
            })
            .then(response => {
                if (!response.ok) throw new Error('Server responded with an error');
                return response.json();
            })
            .then(data => {
                if (data && data.codes && Array.isArray(data.codes)) {
                    if (confirm('Replace current codes with server data?')) {
                        // Tạo bản sao lưu trước khi thay thế
                        createBackup(false);
                        
                        savedCodes = data.codes;
                        saveToLocalStorage();
                        updateSavedCodesList();
                        showNotification('Successfully imported from server', 'success');
                    }
                } else {
                    throw new Error('Invalid data format');
                }
            })
            .catch(error => {
                console.error('Import error:', error);
                showNotification('Failed to import: ' + error.message, 'error');
            });
        }

        // Thiết lập tự động sao lưu định kỳ
        function setupAutoBackup() {
            // Xóa timer hiện tại nếu có
            if (autoSaveTimer) {
                clearInterval(autoSaveTimer);
            }
            
            // Tạo timer mới - sao lưu mỗi 5 phút
            autoSaveTimer = setInterval(() => {
                if (savedCodes.length > 0) {
                    createBackup(false);
                    console.log('Auto backup completed at ' + new Date().toLocaleTimeString());
                }
            }, 5 * 60 * 1000); // 5 phút
        }

        // Thêm event listeners cho nút xác nhận và hủy trong hộp thoại xác nhận xóa
        confirmDeleteBtn.addEventListener('click', () => {
            if (codeToDelete >= 0) {
                savedCodes.splice(codeToDelete, 1);
                saveToLocalStorage();
                updateSavedCodesList();
                showNotification('Code deleted', 'success');
                confirmDeleteModal.classList.remove('active');
                codeToDelete = -1;
            }
        });

        cancelDeleteBtn.addEventListener('click', () => {
            confirmDeleteModal.classList.remove('active');
            codeToDelete = -1;
        });

        // Event listeners mới
        exportBtn.addEventListener('click', exportToServer);
        importBtn.addEventListener('click', importFromServer);
        backupBtn.addEventListener('click', () => createBackup(true));
        restoreBtn.addEventListener('click', restoreFromBackup);

        // Sửa event listeners cho cài đặt
        algorithmSelect.addEventListener('change', () => {
            startTokenUpdates();
            
            // Hỏi xem có muốn áp dụng cho tất cả mã đã lưu không
            if (savedCodes.length > 0 && confirm('Apply this algorithm to all saved codes?')) {
                savedCodes.forEach(code => {
                    code.algorithm = algorithmSelect.value;
                });
                saveToLocalStorage();
                updateSavedCodesList();
                showNotification('Updated algorithm for all codes', 'success');
            }
        });

        digitsSelect.addEventListener('change', () => {
            startTokenUpdates();
            
            if (savedCodes.length > 0 && confirm('Apply this digit setting to all saved codes?')) {
                const digits = parseInt(digitsSelect.value);
                savedCodes.forEach(code => {
                    code.digits = digits;
                });
                saveToLocalStorage();
                updateSavedCodesList();
                showNotification('Updated digits for all codes', 'success');
            }
        });

        periodSelect.addEventListener('change', () => {
            startTokenUpdates();
            
            if (savedCodes.length > 0 && confirm('Apply this period setting to all saved codes?')) {
                const period = parseInt(periodSelect.value);
                savedCodes.forEach(code => {
                    code.period = period;
                });
                saveToLocalStorage();
                updateSavedCodesList();
                showNotification('Updated period for all codes', 'success');
            }
        });

        // Event listeners hiện có
        secretInput.addEventListener('input', () => {
            clearTimeout(window.debounceTimer);
            window.debounceTimer = setTimeout(() => {
                if (secretInput.value.trim() !== lastSecretInput) {
                    startTokenUpdates();
                }
            }, 300);
        });

        // Auto-generate when pasting
        secretInput.addEventListener('paste', () => {
            setTimeout(startTokenUpdates, 100);
        });

        // Generate button
        generateBtn.addEventListener('click', startTokenUpdates);

        // Copy button
        copyBtn.addEventListener('click', copyToClipboard);

        // Save button
        saveBtn.addEventListener('click', saveCurrentCode);

        // Clear button
        clearBtn.addEventListener('click', clearAll);

        // Click on token to copy
        tokenDisplay.addEventListener('click', copyToClipboard);

        // Tab switching
        tabs[0].addEventListener('click', showSavedCodesTab);
        tabs[1].addEventListener('click', showSettingsTab);

        // Add new code button
        addNewBtn.addEventListener('click', openModal);

        // Modal buttons
        closeModalBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);
        saveNewBtn.addEventListener('click', addNewCode);

        // Close modal when clicking outside
        addModal.addEventListener('click', e => {
            if (e.target === addModal) {
                closeModal();
            }
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            // Tải mã đã lưu
            initSavedCodes();
            
            // Tải cài đặt server
            loadServerSettings();
            
            // Show saved codes tab initially
            showSavedCodesTab();
            
            // Start token generation if input has value
            if (secretInput.value.trim()) {
                startTokenUpdates();
            }
            
            // Update saved codes every second
            setInterval(() => {
                if (savedCodesContent.style.display !== 'none' && savedCodes.length > 0) {
                    updateSavedCodesList();
                }
            }, 1000);
            
            // Thiết lập tự động sao lưu
            setupAutoBackup();
            
            // Kiểm tra khi trang đóng để sao lưu
            window.addEventListener('beforeunload', () => {
                if (savedCodes.length > 0) {
                    createBackup(false);
                }
            });
        });
    </script>
</body>
</html>
