<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get 2FA Code</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* Light Theme (Default) */
            --bg-gradient: linear-gradient(125deg, #e0eafc, #d2d8f0, #cfdef3);
            --text-color: #212529;
            --text-color-on-primary: #ffffff;
            --text-color-on-danger-light: #ffffff; /* Text on solid danger button in light theme */
            --text-color-on-action-special-light: #0056b3; /* For specific action buttons in light theme */
            --text-secondary: #5a6268;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(0, 0, 0, 0.1);
            --card-highlight: rgba(0, 0, 0, 0.05);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);

            --input-bg: rgba(0, 0, 0, 0.04);
            --input-border: rgba(0, 0, 0, 0.15);
            --input-placeholder-color: #6c757d;
            --input-focus-border: var(--primary-glow);
            --input-focus-shadow: rgba(0, 122, 255, 0.2);

            --btn-bg: rgba(255, 255, 255, 0.7); /* Slightly more opaque for better text contrast */
            --btn-border: rgba(0, 0, 0, 0.15);
            --btn-hover-bg: rgba(0, 0, 0, 0.1);
            --btn-text-color: #004085; /* Darker blue for default glass buttons in light theme */

            /* Glows and Accents */
            --primary-glow: #007aff;
            --secondary-glow: #5856d6;
            --accent-glow: #5ac8fa;
            --danger-glow: #ff3b30;
            --success-glow: #34c759;

            --border-radius: 20px;
            --btn-radius: 12px;
            --primary-blue: #0d6efd;
            --primary-dark: #0a2a80;
            --primary: #0e5bae;
            --primary-light: #0e8bd5;
        }

        body.dark-theme {
            --bg-gradient: linear-gradient(125deg, #1e3c72, #2a5298, #2b32b2);
            --text-color: #ffffff;
            --text-color-on-primary: #ffffff;
            --text-color-on-danger-light: #ffffff; /* Not directly used in dark theme but defined */
            --text-color-on-action-special-light: #0056b3; /* Not directly used */
            --text-secondary: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.2);
            --card-highlight: rgba(255, 255, 255, 0.3);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);

            --input-bg: rgba(255, 255, 255, 0.1);
            --input-border: var(--card-border);
            --input-placeholder-color: rgba(255, 255, 255, 0.4);
            --input-focus-shadow: rgba(0, 122, 255, 0.3);

            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-border: var(--card-border);
            --btn-hover-bg: rgba(255, 255, 255, 0.2);
            --btn-text-color: var(--text-color);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Background elements */
        .bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 10%, transparent 70%);
            filter: blur(30px);
            transition: opacity 0.3s ease;
        }
        body:not(.dark-theme) .bg-circle { opacity: 0.6; }
        body.dark-theme .bg-circle { opacity: 0.4; }


        .circle-1 { top: 15%; left: 10%; width: 300px; height: 300px; animation: float 25s infinite alternate ease-in-out; }
        .circle-2 { bottom: 10%; right: 15%; width: 400px; height: 400px; background: radial-gradient(circle, var(--secondary-glow) 10%, transparent 70%); animation: float 30s infinite alternate-reverse ease-in-out; }
        .circle-3 { top: 40%; right: 25%; width: 250px; height: 250px; background: radial-gradient(circle, var(--accent-glow) 10%, transparent 70%); animation: float 20s infinite alternate ease-in-out; }

        .glass-sphere {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.1) 60%, rgba(255, 255, 255, 0) 70%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: background 0.3s ease;
        }
        body.dark-theme .glass-sphere {
             background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05) 60%, transparent 70%);
        }


        .sphere-1 { top: 20%; left: 5%; animation: bounce 15s infinite alternate ease-in-out; }
        .sphere-2 { bottom: 15%; right: 10%; width: 80px; height: 80px; animation: bounce 12s infinite alternate-reverse ease-in-out; }

        @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, -30px); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-40px); } }

        /* Main container */
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 1;
        }

        /* Glass card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            padding: 30px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--card-highlight), transparent);
            transition: 0.5s;
        }
        .glass-card:hover::before { left: 100%; }

        /* App header */
        .app-header { text-align: center; margin-bottom: 10px; padding-bottom: 20px; }
        .app-title { font-size: 42px; font-weight: 700; color: var(--text-color); margin-bottom: 10px; letter-spacing: -0.5px; text-shadow: 0 0 15px var(--card-highlight); }
        .app-subtitle { font-size: 16px; color: var(--text-secondary); }

        /* Split layout */
        .split-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .generator-section { display: flex; flex-direction: column; gap: 20px; }
        .section-title { font-size: 20px; font-weight: 600; color: var(--text-color); margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--accent-glow); }
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 14px; font-weight: 500; }

        .glass-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--btn-radius);
            padding: 15px;
            color: var(--text-color);
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        select.glass-input {
            -webkit-appearance: none; -moz-appearance: none; appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20292.4%20292.4%22%3E%3Cpath%20fill%3D%22%23212529%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat; background-position: right 15px center; background-size: 10px;
            padding-right: 40px;
        }
        body.dark-theme select.glass-input {
             background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20292.4%20292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
        }

        select.glass-input::-moz-focus-inner { border: 0; }
        select.glass-input:-moz-focusring { color: transparent; text-shadow: 0 0 0 var(--text-color); }
        select.glass-input::-ms-expand { display: none; }
        .glass-input:focus { outline: none; border-color: var(--input-focus-border); box-shadow: 0 0 0 3px var(--input-focus-shadow); }
        .glass-input::placeholder { color: var(--input-placeholder-color); }

        select.glass-input option {
            background: #ffffff;
            color: #212529;
            padding: 8px 15px;
        }
        body.dark-theme select.glass-input option {
            background: var(--primary-dark);
            color: #FFFFFF;
        }
        select.glass-input option:hover { background: #e9ecef; }
        body.dark-theme select.glass-input option:hover { background: var(--primary); }
        select.glass-input option:checked { background: var(--primary-blue); color: white; }
        body.dark-theme select.glass-input option:checked { background: var(--primary-light); }


        /* Token display */
        .token-display { background: var(--input-bg); border-radius: var(--btn-radius); padding: 30px 20px; text-align: center; position: relative; overflow: hidden; cursor: pointer; border: 1px solid var(--input-border); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: all 0.3s ease; }
        .token-display:hover { background: var(--btn-hover-bg); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); }
        .token-value { font-family: 'SF Mono', 'Consolas', monospace; font-size: 42px; font-weight: 700; color: var(--text-color); letter-spacing: 5px; margin-bottom: 20px; text-shadow: 0 0 15px var(--card-highlight); }
        .timer-container { width: 100%; height: 6px; background: rgba(0, 0, 0, 0.2); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
        .timer-bar { height: 100%; background: linear-gradient(to right, var(--primary-glow), var(--accent-glow)); border-radius: 3px; transition: width 1s linear, background 0.3s ease; box-shadow: 0 0 8px rgba(90, 200, 250, 0.5); }
        .timer-text { color: var(--text-secondary); font-size: 14px; font-weight: 500; }

        /* Button styles */
        .button-group { display: flex; gap: 10px; margin-top: 10px; }
        .glass-btn { flex: 1; padding: 12px 15px; border-radius: var(--btn-radius); border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-text-color); font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .glass-btn i { font-size: 14px; color: inherit; }
        .glass-btn:hover { background: var(--btn-hover-bg); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); }

        .btn-primary { background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow)); border: none; box-shadow: 0 5px 15px rgba(0, 122, 255, 0.4); color: var(--text-color-on-primary); }
        .btn-primary:hover { box-shadow: 0 8px 25px rgba(0, 122, 255, 0.5); }

        .btn-danger { background: var(--danger-glow); color: var(--text-color-on-danger-light); border: none; box-shadow: 0 5px 15px rgba(255, 59, 48, 0.3); }
        body.dark-theme .btn-danger { background: rgba(255, 59, 48, 0.3); color: #ffd0cc; border-color: rgba(255,59,48,0.4); box-shadow: 0 5px 15px rgba(255, 59, 48, 0.2); }
        .btn-danger:hover { opacity: 0.85; box-shadow: 0 8px 25px rgba(255, 59, 48, 0.4); }
        .btn-danger i { color: inherit; }


        /* Tabs */
        .tabs { display: flex; border-bottom: 1px solid var(--input-border); margin-bottom: 20px; position: relative; }
        .tab { padding: 15px 20px; color: var(--text-secondary); font-size: 16px; font-weight: 500; cursor: pointer; transition: color 0.3s ease; position: relative; background: none; border: none; text-align: center; flex: 1; }
        .tab.active { color: var(--text-color); }
        .tab-indicator { position: absolute; bottom: -1px; left: 0; height: 3px; width: 50%; background: linear-gradient(to right, var(--primary-glow), var(--secondary-glow)); transition: transform 0.3s ease; border-radius: 3px 3px 0 0; }

        /* Saved codes */
        .saved-codes-list { max-height: 500px; overflow-y: auto; padding-right: 5px; margin-bottom: 20px; }
        .saved-codes-list::-webkit-scrollbar { width: 6px; }
        .saved-codes-list::-webkit-scrollbar-track { background: var(--input-bg); border-radius: 3px; }
        .saved-codes-list::-webkit-scrollbar-thumb { background: var(--input-border); border-radius: 3px; }
        .saved-code-item { background: var(--input-bg); border-radius: var(--btn-radius); padding: 20px; margin-bottom: 15px; transition: all 0.3s ease; border: 1px solid var(--input-border); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .saved-code-item:hover { background: var(--btn-hover-bg); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); }
        .saved-code-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .saved-code-label { font-size: 15px; color: var(--text-color); font-weight: 500; word-break: break-all; }
        .saved-code-time { font-size: 14px; color: var(--text-color); background: rgba(0, 122, 255, 0.3); padding: 4px 12px; border-radius: 50px; font-weight: 500; white-space: nowrap; }
        body:not(.dark-theme) .saved-code-time { background: rgba(0,122,255,0.1); color: var(--primary-blue); }
        .saved-code-value { font-family: 'SF Mono', 'Consolas', monospace; font-size: 30px; font-weight: 700; color: var(--text-color); margin-bottom: 15px; letter-spacing: 3px; text-shadow: 0 0 10px var(--card-highlight); }
        .saved-code-actions { display: flex; gap: 8px; }
        .action-btn { flex: 1; padding: 10px; border-radius: var(--btn-radius); background: var(--btn-bg); color: var(--btn-text-color); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--btn-border); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
        .action-btn i { color: inherit; }
        .action-btn:hover { background: var(--btn-hover-bg); transform: translateY(-2px); }

        .btn-load { color: var(--btn-text-color); } /* Default color from var */
        body:not(.dark-theme) .btn-load { background: rgba(0,122,255,0.08); color: var(--primary-blue); }
        body:not(.dark-theme) .btn-load i { color: var(--primary-blue); }
        .btn-load:hover { background: rgba(0, 122, 255, 0.3); } body:not(.dark-theme) .btn-load:hover { background: rgba(0,122,255,0.15); }

        .btn-copy { color: var(--btn-text-color); }
        body:not(.dark-theme) .btn-copy { background: rgba(90,200,250,0.08); color: var(--text-color-on-action-special-light); }
        body:not(.dark-theme) .btn-copy i { color: var(--text-color-on-action-special-light); }
        .btn-copy:hover { background: rgba(90, 200, 250, 0.3); } body:not(.dark-theme) .btn-copy:hover { background: rgba(90,200,250,0.15); }

        .btn-delete { color: #ffb3c0; } /* Default dark theme delete text color */
        body:not(.dark-theme) .btn-delete { background: rgba(255,45,85,0.08); color: #a71d2a; } /* Darker red for light theme */
        body:not(.dark-theme) .btn-delete i { color: #a71d2a; }
        .btn-delete:hover { background: rgba(255, 45, 85, 0.3); } body:not(.dark-theme) .btn-delete:hover { background: rgba(255,45,85,0.15); }

        .add-code-btn { background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow)); color: white; border: none; border-radius: var(--btn-radius); padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0, 122, 255, 0.3); }
        .add-code-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 122, 255, 0.4); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-state i { font-size: 40px; margin-bottom: 15px; opacity: 0.5; }
        .empty-state p { margin-bottom: 5px; }

        /* Settings */
        .settings-content { display: none; }
        .settings-content.active { display: block; }
        select#period {
            background-color: var(--primary-blue) !important;
            color: white !important;
            font-weight: bold !important;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20292.4%20292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E') !important;
            background-repeat: no-repeat !important;
            background-position: right 15px center !important;
            background-size: 10px !important;
            padding-right: 40px !important;
        }
        select#period option {
             background: var(--primary-blue) !important;
             color: white !important;
        }
        select#period option:hover {
            background: var(--primary-dark) !important;
        }
         select#period option:checked {
            background: var(--primary-light) !important;
        }


        .settings-content .input-group .button-pair { display: flex; gap: 10px; margin-bottom: 15px; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: var(--border-radius); width: 90%; max-width: 450px; box-shadow: var(--card-shadow); transform: scale(0.95); opacity: 0; transition: all 0.3s ease .1s; }
        .modal.active .modal-content { transform: scale(1); opacity: 1; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--input-border); display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 18px; font-weight: 600; color: var(--text-color); }
        .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; transition: all 0.3s ease; }
        .modal-close:hover { color: var(--text-color); }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 20px; border-top: 1px solid var(--input-border); display: flex; justify-content: flex-end; gap: 10px; }

        #confirmDeleteModal { background-color: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); } /* Ensure this is displayed like other modals */
        #confirmDeleteModal.modal { /* Add modal class for consistency if not already handled */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        #confirmDeleteModal.modal.active { opacity: 1; visibility: visible; }

        .confirm-modal-content {
            background: var(--card-bg); /* Use theme variable */
            backdrop-filter: blur(16px); /* Consistent glass effect */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border); /* Use theme variable */
            border-radius: var(--border-radius); /* Consistent radius */
            max-width: 380px; /* Adjusted for better content fit */
            width: calc(100% - 40px);
            box-shadow: var(--card-shadow); /* Use theme variable */
            transform: scale(0.95);
            opacity: 0; /* Add for transition */
            transition: all 0.3s ease .1s; /* Consistent transition */
            overflow: hidden;
        }
        #confirmDeleteModal.modal.active .confirm-modal-content {
            transform: scale(1);
            opacity: 1; /* Add for transition */
        }

        .confirm-modal-header {
            padding: 18px 20px; /* Adjusted padding */
            border-bottom: 1px solid var(--input-border); /* Use theme variable */
            display: flex; align-items: center; justify-content: space-between; /* For potential close button */
        }
        .confirm-modal-title {
            font-size: 17px; /* Adjusted size */
            color: var(--text-color); /* Use theme variable */
            font-weight: 600; /* Consistent weight */
        }
        .confirm-modal-body {
            padding: 25px 20px; /* Adjusted padding */
            color: var(--text-color); /* Use theme variable */
            font-size: 15px;
            line-height: 1.6; /* Improved readability */
        }
        .confirm-modal-footer {
            display: flex;
            justify-content: flex-end; /* Align to right like other modals */
            padding: 18px 20px; /* Adjusted padding */
            gap: 10px;
            border-top: 1px solid var(--input-border); /* Use theme variable */
        }
        .confirm-btn { /* General styling for confirm buttons */

        .btn-cancel:hover { background: var(--btn-hover-bg); opacity: 0.85; }


        /* Notification */
        .notification { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(30px); background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 15px; padding: 15px 20px; box-shadow: var(--card-shadow); display: flex; align-items: center; gap: 10px; color: var(--text-color); opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55); z-index: 1000; max-width: calc(100% - 40px); width: auto; }
        .notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .notification-success { border-left: 4px solid var(--success-glow); }

        .notification-error { border-left: 4px solid var(--danger-glow); }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .split-layout { grid-template-columns: 1fr; }

            .button-group .glass-btn { flex-basis: 100%; } /* Stack generator buttons */

        /* Theme Toggle Button Specific Style */

<body>

    <div class="modal" id="confirmDeleteModal">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script>
        // Anti-debug / anti-view-source (user's original code)

        // ***********************************************************************************

        // DOM Elements
        const secretInput = document.getElementById('secretInput');
        const token = document.getElementById('token');
        const timerBar = document.getElementById('timerBar');
        const secondsCounter = document.getElementById('secondsCounter');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const saveBtn = document.getElementById('saveBtn');
        const clearBtn = document.getElementById('clearBtn');
        const tokenDisplay = document.getElementById('tokenDisplay');
        const savedCodesList = document.getElementById('savedCodesList');
        const emptyState = document.getElementById('emptyState');
        const addNewBtn = document.getElementById('addNewBtn');

        const algorithmSelect = document.getElementById('algorithm');
        const digitsSelect = document.getElementById('digits');
        const periodSelect = document.getElementById('period');
        const addModal = document.getElementById('addModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const newLabel = document.getElementById('newLabel');
        const newSecret = document.getElementById('newSecret');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveNewBtn = document.getElementById('saveNewBtn');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const serverUrl = document.getElementById('serverUrl');
        const apiKey = document.getElementById('apiKey');
        const backupBtn = document.getElementById('backupBtn');
        const restoreBtn = document.getElementById('restoreBtn');
        const lastBackupInfo = document.getElementById('lastBackupInfo');
        const confirmDeleteModal = document.getElementById('confirmDeleteModal'); // This is now a .modal
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const deleteConfirmMessage = document.getElementById('deleteConfirmMessage');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        let codeToDelete = -1;
        let mainTimer;
        let savedCodesRefreshTimer;
        let currentToken = '';
        let lastSecretInput = '';
        let savedCodes = [];
        let autoSaveTimer;

        // --- THEME TOGGLE ---
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
                themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.body.classList.remove('dark-theme');
                themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const currentThemeIsDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', currentThemeIsDark ? 'dark' : 'light');
            applyTheme(currentThemeIsDark ? 'dark' : 'light');
        });


        function base32ToHex(base32) {
            const base32chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            base32 = base32.replace(/\s+/g, '').toUpperCase().replace(/=+$/, '');
            if (!/^[A-Z2-7]+$/.test(base32)) {
                 console.error('Invalid base32 characters in secret:', base32);
                 throw new Error('Invalid base32 characters');
            }
            let bits = '';
            let hex = '';
            for (let i = 0; i < base32.length; i++) {
                const val = base32chars.indexOf(base32[i]);
                bits += val.toString(2).padStart(5, '0');
            }
            for (let i = 0; i + 4 <= bits.length; i += 4) {
                const chunk = bits.substring(i, i + 4);
                hex += parseInt(chunk, 2).toString(16);
            }
            return hex;
        }

        function generateTOTP(secret, period = 30, digits = 6, algorithm = 'SHA-1') {
            try {
                if (!secret || typeof secret !== 'string' || secret.trim() === '') {
                    throw new Error('Secret key is empty or invalid');
                }
                // Ensure CryptoJS is loaded
                if (typeof CryptoJS === 'undefined') {
                    console.error('CryptoJS library is not loaded.');
                    throw new Error('CryptoJS library is not loaded.');
                }
                const hexSecret = base32ToHex(secret);
                const epoch = Math.floor(Date.now() / 1000);
                const counter = Math.floor(epoch / period);
                const counterHex = counter.toString(16).padStart(16, '0');
                const secretWordArray = CryptoJS.enc.Hex.parse(hexSecret);
                const counterWordArray = CryptoJS.enc.Hex.parse(counterHex);
                let hmacObj;
                if (algorithm === 'SHA-1') hmacObj = CryptoJS.HmacSHA1(counterWordArray, secretWordArray);
                else if (algorithm === 'SHA-256') hmacObj = CryptoJS.HmacSHA256(counterWordArray, secretWordArray);
                else if (algorithm === 'SHA-512') hmacObj = CryptoJS.HmacSHA512(counterWordArray, secretWordArray);
                else throw new Error('Unsupported algorithm: ' + algorithm);
                const hmac = hmacObj.toString(CryptoJS.enc.Hex);
                const offset = parseInt(hmac.substr(hmac.length - 1), 16);
                const binary = parseInt(hmac.substr(offset * 2, 8), 16) & 0x7fffffff;
                const otp = binary % Math.pow(10, digits);
                const code = otp.toString().padStart(digits, '0');
                const secondsRemaining = period - (epoch % period);
                return { code, secondsRemaining };
            } catch (error) {
                console.error('TOTP generation error:', error.message, 'Secret (partial):', String(secret).substring(0,5) + "...");
                return null;
            }
        }

        function updateMainTimerDisplay(secondsRemaining, period) {
            const percentage = (secondsRemaining / period) * 100;
            timerBar.style.width = `${percentage}%`;
            secondsCounter.textContent = secondsRemaining;
            if (secondsRemaining <= 5) timerBar.style.background = 'linear-gradient(to right, var(--danger-glow), #ff9500)';
            else timerBar.style.background = 'linear-gradient(to right, var(--primary-glow), var(--accent-glow))';
        }

        function generateMainToken() {
            const secret = secretInput.value.trim().replace(/\s+/g, '');
            if (!secret) {
                token.textContent = '------';
                if(mainTimer) clearInterval(mainTimer);
                updateMainTimerDisplay(0, parseInt(periodSelect.value || 30));
                return;
            }
            const period = parseInt(periodSelect.value);
            const digits = parseInt(digitsSelect.value);
            const algorithm = algorithmSelect.value;
            try {
                const result = generateTOTP(secret, period, digits, algorithm);
                if (!result) {
                    token.textContent = 'ERROR';
                    updateMainTimerDisplay(0, period);
                    return;
                }
                if (result.code !== currentToken) {
                    token.style.opacity = '0';
                    setTimeout(() => {
                        currentToken = result.code;
                        token.textContent = result.code;
                        token.style.opacity = '1';
                    }, 100);
                }
                updateMainTimerDisplay(result.secondsRemaining, period);
                lastSecretInput = secret;
            } catch (error) {
                token.textContent = 'ERROR';
                updateMainTimerDisplay(0, period);
            }
        }

        function startMainTokenUpdates() {
            if (mainTimer) clearInterval(mainTimer);
            generateMainToken();
            mainTimer = setInterval(generateMainToken, 1000);
        }

        function copyToClipboard() {
            if (currentToken && currentToken !== '------' && currentToken !== 'ERROR') {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(currentToken)
                        .then(() => showNotification('Code copied to clipboard', 'success'))
                        .catch(err => {
                            console.error('Copy failed:', err);
                            showNotification('Failed to copy code (modern method)', 'error');
                        });
                } else {
                    // Fallback for older browsers or non-HTTPS contexts (less common now)
                    const textArea = document.createElement("textarea");
                    textArea.value = currentToken;
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        showNotification('Code copied (fallback method)', 'success');
                    } catch (err) {
                        showNotification('Failed to copy code (fallback method)', 'error');
                    }
                    document.body.removeChild(textArea);
                }
            } else {
                showNotification('No valid code to copy', 'error');
            }
        }

        function updateSavedCodesListDOM() {
            savedCodesList.innerHTML = '';
            if (savedCodes.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            savedCodes.forEach((code, index) => {
                const codeItem = document.createElement('div');
                codeItem.className = 'saved-code-item';
                codeItem.setAttribute('data-index', index);
                codeItem.setAttribute('data-id', code.id);

                codeItem.innerHTML = `
                    <div class="saved-code-header">
                        <div class="saved-code-label">${code.label}</div>
                        <div class="saved-code-time" id="saved-time-${code.id}">--s</div>
                    </div>
                    <div class="saved-code-value" id="saved-token-${code.id}">------</div>
                    <div class="saved-code-actions">
                        <button class="action-btn btn-load" data-index="${index}"><i class="fas fa-sync-alt"></i> Load</button>
                        <button class="action-btn btn-copy" data-code="------" id="saved-copy-${code.id}"><i class="fas fa-copy"></i> Copy</button>
                        <button class="action-btn btn-delete" data-index="${index}"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                `;
                savedCodesList.appendChild(codeItem);
            });
            addButtonEventListeners(); // Consider event delegation later for performance
            refreshLiveSavedCodes();
        }

        function refreshLiveSavedCodes() {
            if ( (settingsContent.style.display === 'block' && savedCodesContent.style.display === 'none') || savedCodes.length === 0) { // only run if saved tab is active or no codes
                 return;
            }

            savedCodes.forEach((codeData) => {
                 const item = savedCodesList.querySelector(`.saved-code-item[data-id="${codeData.id}"]`);
                 if (!item) return;

                const result = generateTOTP(
                    codeData.secret,
                    codeData.period || 30,
                    codeData.digits || 6,
                    codeData.algorithm || 'SHA-1'
                );

                const tokenEl = item.querySelector(`#saved-token-${codeData.id}`);
                const timeEl = item.querySelector(`#saved-time-${codeData.id}`);
                const copyBtnEl = item.querySelector(`#saved-copy-${codeData.id}`);

                if (result) {
                    if (tokenEl && tokenEl.textContent !== result.code) tokenEl.textContent = result.code;
                    if (timeEl) timeEl.textContent = `${result.secondsRemaining}s`;
                    if (copyBtnEl) copyBtnEl.setAttribute('data-code', result.code);
                } else {
                    if (tokenEl) tokenEl.textContent = 'ERROR';
                    if (timeEl) timeEl.textContent = 'Error';
                    if (copyBtnEl) copyBtnEl.setAttribute('data-code', 'ERROR');
                }
            });
        }


        function saveCurrentCode() {
            if (currentToken && currentToken !== '------' && currentToken !== 'ERROR') {
                newSecret.value = secretInput.value.trim();
                newLabel.value = '';
                openAddModal();
            } else {
                showNotification('Generate a valid code first', 'error');
            }
        }

        function clearAll() {
            secretInput.value = '';
            token.textContent = '------';
            currentToken = '';
            if(mainTimer) clearInterval(mainTimer);
            updateMainTimerDisplay(0, parseInt(periodSelect.value || 30));
            showNotification('Input cleared', 'success');
        }

        function showNotification(message, type = 'success') {
            notification.className = 'notification';
            notification.classList.add(`notification-${type}`);
            notification.querySelector('i').className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
            notificationText.textContent = message;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        function openModal(modalElement) {
            if(modalElement) modalElement.classList.add('active');
        }

        function closeModal(modalElement) {
            if(modalElement) modalElement.classList.remove('active');
        }

        function openAddModal() {
            openModal(addModal);
            setTimeout(() => newLabel.focus(), 50); // Focus might be tricky on mobile, test this
        }

        function closeAddModal() {
            closeModal(addModal);
        }

        function addNewCodeToList() {
            const label = newLabel.value.trim() || 'Unnamed Code';
            const secret = newSecret.value.trim();
            if (!secret) {
                showNotification('Secret key is required', 'error');
                return;
            }
            try {
                const result = generateTOTP(secret);
                if (!result) {
                    showNotification('Invalid secret key or parameters', 'error');
                    return;
                }
                const newCodeEntry = {
                    id: Date.now(),
                    label,
                    secret,
                    algorithm: algorithmSelect.value,
                    digits: parseInt(digitsSelect.value),
                    period: parseInt(periodSelect.value)
                };
                savedCodes.unshift(newCodeEntry);
                saveCodesToLocalStorage();
                updateSavedCodesListDOM();
                closeAddModal();
                showNotification(`Code "${label}" saved`, 'success');
                showTab('saved');
            } catch (error) {
                showNotification('Invalid secret key format', 'error');
                console.error("Error adding new code:", error);
            }
        }

        function addButtonEventListeners() {
            // Consider event delegation for better performance with many items
            savedCodesList.querySelectorAll('.btn-load').forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                newBtn.addEventListener('click', (e) => loadSavedCode(parseInt(e.currentTarget.getAttribute('data-index'))));
            });
            savedCodesList.querySelectorAll('.btn-copy').forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                newBtn.addEventListener('click', (e) => copySavedCodeValue(e.currentTarget.getAttribute('data-code')));
            });
             savedCodesList.querySelectorAll('.btn-delete').forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                newBtn.addEventListener('click', (e) => confirmDeletion(parseInt(e.currentTarget.getAttribute('data-index'))));
            });
        }

        function loadSavedCode(index) {
            if (index < 0 || index >= savedCodes.length) return;
            const code = savedCodes[index];
            if (!code) return;
            secretInput.value = code.secret;
            algorithmSelect.value = code.algorithm || 'SHA-1';
            digitsSelect.value = code.digits || 6;
            periodSelect.value = code.period || 30;
            startMainTokenUpdates();
            showNotification(`Loaded: ${code.label}`, 'success');
        }

        function copySavedCodeValue(codeToCopy) {
            if (codeToCopy && codeToCopy !== 'ERROR' && codeToCopy !== '------') {
                 if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(codeToCopy)
                        .then(() => showNotification('Code copied', 'success'))
                        .catch(err => showNotification('Copy failed', 'error'));
                } else {
                    // Fallback for older browsers
                    const textArea = document.createElement("textarea");
                    textArea.value = codeToCopy;
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        showNotification('Code copied (fallback)', 'success');
                    } catch (err) {
                        showNotification('Copy failed (fallback)', 'error');
                    }
                    document.body.removeChild(textArea);
                }
            } else {
                showNotification('No valid code to copy', 'error');
            }
        }

        function confirmDeletion(index) {
            if (index < 0 || index >= savedCodes.length) {
                 console.error("Code to delete at index " + index + " not found.");
                 return;
            }
            const code = savedCodes[index];
            if (!code) return;

            codeToDelete = index;
            const labelText = code.label || 'this code';
            deleteConfirmMessage.textContent = `Delete "${labelText}"? This action cannot be undone.`;
            openModal(confirmDeleteModal); // Use generic openModal
        }

        function showTab(tabName) {
            tabs.forEach(t => t.classList.remove('active'));
            const activeTabButton = document.querySelector(`.tab[data-tab="${tabName}"]`);
            if (activeTabButton) activeTabButton.classList.add('active');

            const tabIndex = Array.from(tabs).findIndex(t => t.getAttribute('data-tab') === tabName);
            if (tabIndicator) tabIndicator.style.transform = `translateX(${tabIndex * 100}%)`;

            if (savedCodesContent) savedCodesContent.style.display = tabName === 'saved' ? 'block' : 'none';
            if (settingsContent) settingsContent.style.display = tabName === 'settings' ? 'block' : 'none';

            if(tabName === 'saved' && typeof updateSavedCodesListDOM === 'function') {
                 updateSavedCodesListDOM();
            }
             if(tabName === 'saved') {
                refreshLiveSavedCodes(); // Refresh when tab becomes active
                if (!savedCodesRefreshTimer) {
                    savedCodesRefreshTimer = setInterval(refreshLiveSavedCodes, 1000);
                }
            } else {
                if (savedCodesRefreshTimer) {
                    clearInterval(savedCodesRefreshTimer);
                    savedCodesRefreshTimer = null;
                }
            }
        }

        function loadCodesFromLocalStorage() {
            const savedCodesStr = localStorage.getItem('savedCodes_v2');
            if (savedCodesStr) {
                try {
                    savedCodes = JSON.parse(savedCodesStr);
                } catch (e) {
                    console.error('Error loading saved codes:', e);
                    savedCodes = [];
                }
            } else {
                const oldCodesStr = localStorage.getItem('savedCodes');
                if (oldCodesStr) {
                    try {
                        const oldCodes = JSON.parse(oldCodesStr);
                        savedCodes = oldCodes.map((code, index) => ({
                            id: code.id || Date.now() + index,
                            label: code.label || `Code ${index + 1}`,
                            secret: code.secret,
                            algorithm: code.algorithm || 'SHA-1',
                            digits: code.digits || 6,
                            period: code.period || 30
                        }));
                        saveCodesToLocalStorage();
                        localStorage.removeItem('savedCodes');
                        showNotification('Migrated codes to new format.', 'success');
                    } catch (e) { savedCodes = []; }
                } else {
                    savedCodes = [];
                }
            }
            updateBackupInfo();
        }

        function saveCodesToLocalStorage() {
            localStorage.setItem('savedCodes_v2', JSON.stringify(savedCodes));
            createBackup(false);
        }

        function createBackup(showMessage = true) {
            if (savedCodes.length > 0) {
                const now = new Date();
                const backupData = { codes: savedCodes, timestamp: now.getTime(), date: now.toLocaleString() };
                localStorage.setItem('savedCodes_backup_v2', JSON.stringify(backupData));
                if (showMessage) showNotification('Backup created successfully', 'success');
                updateBackupInfo();
            } else {
                if (showMessage) showNotification('No codes to backup', 'error');
            }
        }

        function restoreFromBackup() {
            const backupStr = localStorage.getItem('savedCodes_backup_v2');
            if (!backupStr) {
                showNotification('No backup found', 'error');
                return;
            }
            try {
                const backupData = JSON.parse(backupStr);
                if (!backupData.codes || !Array.isArray(backupData.codes)) {
                    showNotification('Invalid backup data', 'error');
                    return;
                }
                if (confirm(`Restore backup from ${backupData.date || new Date(backupData.timestamp).toLocaleString()}? This will overwrite current codes.`)) {
                    savedCodes = backupData.codes;
                    saveCodesToLocalStorage();
                    updateSavedCodesListDOM();
                    showNotification('Backup restored successfully', 'success');
                }
            } catch (e) {
                showNotification('Failed to restore backup', 'error');
            }
        }
         function updateBackupInfo() {
            const backupStr = localStorage.getItem('savedCodes_backup_v2');
            if (lastBackupInfo && backupStr) {
                try {
                    const backupData = JSON.parse(backupStr);
                    lastBackupInfo.textContent = `Last backup: ${backupData.date || new Date(backupData.timestamp).toLocaleString() || 'Unknown'}`;
                } catch { lastBackupInfo.textContent = 'Backup data may be corrupted.'; }
            } else if (lastBackupInfo) {
                lastBackupInfo.textContent = 'No backup available.';
            }
        }

        function exportToServer() {
            const url = serverUrl.value.trim();
            if (!url) { showNotification('Server URL is required', 'error'); return; }
            saveServerSettings();
            const exportData = { codes: savedCodes, timestamp: Date.now(), deviceInfo: navigator.userAgent };
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': apiKey.value ? `Bearer ${apiKey.value}` : '' },
                body: JSON.stringify(exportData)
            })
            .then(response => {
                if (!response.ok) return response.text().then(text => { throw new Error('Server error: ' + response.status + " " + text) });
                return response.json();
            })
            .then(() => showNotification('Exported to server', 'success'))
            .catch(error => showNotification('Export failed: ' + error.message, 'error'));
        }

        function importFromServer() {
            const url = serverUrl.value.trim();
            if (!url) { showNotification('Server URL is required', 'error'); return; }
            saveServerSettings();
            fetch(url, { method: 'GET', headers: { 'Authorization': apiKey.value ? `Bearer ${apiKey.value}` : '' }})
            .then(response => {
                if (!response.ok) return response.text().then(text => { throw new Error('Server error: ' + response.status + " " + text) });
                return response.json();
            })
            .then(data => {
                if (data && data.codes && Array.isArray(data.codes)) {
                    if (confirm('Replace current codes with data from server? (Current codes will be backed up)')) {
                        createBackup(false);
                        savedCodes = data.codes;
                        saveCodesToLocalStorage();
                        updateSavedCodesListDOM();
                        showNotification('Imported from server', 'success');
                    }
                } else { throw new Error('Invalid data format from server'); }
            })
            .catch(error => showNotification('Import failed: ' + error.message, 'error'));
        }

        function loadServerSettings() {
            if(serverUrl) serverUrl.value = localStorage.getItem('2fa_server_url') || '';
            if(apiKey) apiKey.value = localStorage.getItem('2fa_api_key') || '';
        }

        function saveServerSettings() {
            if(serverUrl) localStorage.setItem('2fa_server_url', serverUrl.value.trim());
            if(apiKey) localStorage.setItem('2fa_api_key', apiKey.value.trim());
        }

        confirmDeleteBtn.addEventListener('click', () => {
            if (codeToDelete >= 0 && codeToDelete < savedCodes.length) {
                savedCodes.splice(codeToDelete, 1);
                saveCodesToLocalStorage();
                updateSavedCodesListDOM();
                showNotification('Code deleted', 'success');
            }
            closeModal(confirmDeleteModal); // Use generic closeModal
            codeToDelete = -1;
        });
        cancelDeleteBtn.addEventListener('click', () => {
            closeModal(confirmDeleteModal); // Use generic closeModal
            codeToDelete = -1;
        });

        if(exportBtn) exportBtn.addEventListener('click', exportToServer);
        if(importBtn) importBtn.addEventListener('click', importFromServer);
        if(backupBtn) backupBtn.addEventListener('click', () => createBackup(true));
        if(restoreBtn) restoreBtn.addEventListener('click', restoreFromBackup);

        const applySettingToAll = (settingType, value) => {
             if (savedCodes.length > 0 && confirm(`Apply this ${settingType.toLowerCase()} setting to all saved codes?`)) {
                savedCodes.forEach(code => {
                    code[settingType.toLowerCase()] = value;
                });
                saveCodesToLocalStorage();
                updateSavedCodesListDOM();
                refreshLiveSavedCodes();
                showNotification(`Updated ${settingType.toLowerCase()} for all codes`, 'success');
            }
        };

        if(algorithmSelect) algorithmSelect.addEventListener('change', () => {
            startMainTokenUpdates();
            applySettingToAll('Algorithm', algorithmSelect.value);
        });
        if(digitsSelect) digitsSelect.addEventListener('change', () => {
            startMainTokenUpdates();
            applySettingToAll('Digits', parseInt(digitsSelect.value));
        });
        if(periodSelect) periodSelect.addEventListener('change', () => {
            startMainTokenUpdates();
            applySettingToAll('Period', parseInt(periodSelect.value));
        });

        secretInput.addEventListener('input', () => {
            clearTimeout(window.debounceTimer);
            window.debounceTimer = setTimeout(() => {
                if (secretInput.value.trim() !== lastSecretInput) startMainTokenUpdates();
            }, 300);
        });
        secretInput.addEventListener('paste', () => setTimeout(startMainTokenUpdates, 50));
        generateBtn.addEventListener('click', startMainTokenUpdates);
        copyBtn.addEventListener('click', copyToClipboard);
        saveBtn.addEventListener('click', saveCurrentCode);
        clearBtn.addEventListener('click', clearAll);
        tokenDisplay.addEventListener('click', copyToClipboard);
        tabs.forEach((tab) => {
            tab.addEventListener('click', () => showTab(tab.getAttribute('data-tab')));
        });
        addNewBtn.addEventListener('click', openAddModal);
        closeModalBtn.addEventListener('click', closeAddModal);
        cancelBtn.addEventListener('click', closeAddModal);
        saveNewBtn.addEventListener('click', addNewCodeToList);
        addModal.addEventListener('click', e => { if (e.target === addModal) closeAddModal(); });
        confirmDeleteModal.addEventListener('click', e => { if (e.target === confirmDeleteModal) closeModal(confirmDeleteModal); });


        function setupAutoBackup() {
            if (autoSaveTimer) clearInterval(autoSaveTimer);
            autoSaveTimer = setInterval(() => {
                if (savedCodes.length > 0) {
                    createBackup(false);
                    console.log('Auto backup performed at ' + new Date().toLocaleTimeString());
                }
            }, 5 * 60 * 1000);
        }

        window.addEventListener('beforeunload', () => {
            if (savedCodes.length > 0) createBackup(false);
        });


        // Initialize
        const preferredTheme = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(preferredTheme);

        loadCodesFromLocalStorage();
        loadServerSettings();
        showTab('saved'); // Show saved tab first, which will init its timer
        if (secretInput.value.trim()) startMainTokenUpdates();

        // Initial call to refresh live codes if saved tab is active
        if (savedCodesContent.classList.contains('active')) {
            refreshLiveSavedCodes();
        }
        setupAutoBackup();
    </script>
</body>
