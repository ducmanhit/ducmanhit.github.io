<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get 2FA Code</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-highlight: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            --primary-glow: #007aff;
            --secondary-glow: #5856d6;
            --accent-glow: #5ac8fa;
            --danger-glow: #ff2d55;
            --success-glow: #34c759;
            --text-color: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border-radius: 20px;
            --btn-radius: 12px;
            --primary-blue: #0d6efd; /* User defined for period select */
            --primary-dark: #0a2a80; /* Darker blue for option backgrounds */
            --primary: #0e5bae;     /* Primary color for hover */
            --primary-light: #0e8bd5;/* Lighter blue for checked option */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(125deg, #1e3c72, #2a5298, #2b32b2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background elements */
        .bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 10%, transparent 70%);
            filter: blur(30px);
        }

        .circle-1 {
            top: 15%;
            left: 10%;
            width: 300px;
            height: 300px;
            opacity: 0.4;
            animation: float 25s infinite alternate ease-in-out;
        }

        .circle-2 {
            bottom: 10%;
            right: 15%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--secondary-glow) 10%, transparent 70%);
            opacity: 0.3;
            animation: float 30s infinite alternate-reverse ease-in-out;
        }

        .circle-3 {
            top: 40%;
            right: 25%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, var(--accent-glow) 10%, transparent 70%);
            opacity: 0.2;
            animation: float 20s infinite alternate ease-in-out;
        }

        .glass-sphere {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.1) 60%, rgba(255, 255, 255, 0) 70%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .sphere-1 {
            top: 20%;
            left: 5%;
            animation: bounce 15s infinite alternate ease-in-out;
        }

        .sphere-2 {
            bottom: 15%;
            right: 10%;
            width: 80px;
            height: 80px;
            animation: bounce 12s infinite alternate-reverse ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(30px, -30px);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-40px);
            }
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 1;
        }

        /* Glass card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            box-shadow: var(--glass-shadow);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        /* Glass shine effect */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                var(--glass-highlight),
                transparent
            );
            transition: 0.5s;
        }

        .glass-card:hover::before {
            left: 100%;
        }

        /* App header */
        .app-header {
            text-align: center;
            margin-bottom: 10px;
            padding-bottom: 20px;
        }

        .app-title {
            font-size: 42px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .app-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
        }

        /* Split layout for generator and saved codes */
        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        /* Generator section */
        .generator-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent-glow);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .glass-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: var(--btn-radius);
            padding: 15px;
            color: var(--text-color);
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        select.glass-input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20292.4%20292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 10px; /* Adjusted arrow size */
            padding-right: 40px; /* Make space for custom arrow */
        }
        /* Remove default arrow in Firefox */
        select.glass-input::-moz-focus-inner { border: 0; }
        select.glass-input:-moz-focusring { color: transparent; text-shadow: 0 0 0 var(--text-color); }
        /* Remove default arrow in IE */
        select.glass-input::-ms-expand { display: none; }


        .glass-input:focus {
            outline: none;
            border-color: var(--primary-glow);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.3);
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Styling for <option> elements */
        select.glass-input option {
            background: var(--primary-dark, #0a2a80); /* Dark theme background for options */
            color: var(--text-color, #ffffff);       /* White text */
            padding: 8px 15px; /* Consistent padding */
        }

        select.glass-input option:hover { /* Browser support for option hover is limited */
            background: var(--primary, #0e5bae);
        }
        
        select.glass-input option:checked { /* Browser support for option checked is limited */
            background: var(--primary-light, #0e8bd5);
        }


        /* Token display */
        .token-display {
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--btn-radius);
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .token-display:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .token-value {
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 42px;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .timer-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .timer-bar {
            height: 100%;
            background: linear-gradient(to right, var(--primary-glow), var(--accent-glow));
            border-radius: 3px;
            transition: width 1s linear; 
            box-shadow: 0 0 8px rgba(90, 200, 250, 0.5);
        }

        .timer-text {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        /* Button styles */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .glass-btn {
            flex: 1;
            padding: 12px 15px;
            border-radius: var(--btn-radius);
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .glass-btn i {
            font-size: 14px;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border: none;
            box-shadow: 0 5px 15px rgba(0, 122, 255, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.5);
        }

        .btn-danger {
            background: rgba(255, 45, 85, 0.2);
            color: #ffb3c0;
        }

        .btn-danger:hover {
            background: rgba(255, 45, 85, 0.3);
        }

        /* Tab navigation for saved codes section */
        .tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            position: relative;
        }

        .tab {
            padding: 15px 20px;
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: none;
            border: none;
            text-align: center;
            flex: 1; 
        }

        .tab.active {
            color: var(--text-color);
        }

        .tab-indicator {
            position: absolute;
            bottom: -1px;
            left: 0;
            height: 3px;
            width: 50%; 
            background: linear-gradient(to right, var(--primary-glow), var(--secondary-glow));
            transition: transform 0.3s ease;
            border-radius: 3px 3px 0 0;
        }

        /* Saved codes section */
        .saved-codes-list {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 20px;
        }

        .saved-codes-list::-webkit-scrollbar {
            width: 6px;
        }

        .saved-codes-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .saved-codes-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .saved-code-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--btn-radius);
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .saved-code-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .saved-code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .saved-code-label {
            font-size: 15px;
            color: var(--text-color);
            font-weight: 500;
            word-break: break-all; 
        }

        .saved-code-time {
            font-size: 14px;
            color: var(--text-color);
            background: rgba(0, 122, 255, 0.3);
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: 500;
            white-space: nowrap; 
        }

        .saved-code-value {
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 30px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 15px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .saved-code-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: var(--btn-radius);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-load {
            background: rgba(0, 122, 255, 0.2);
        }

        .btn-load:hover {
            background: rgba(0, 122, 255, 0.3);
        }

        .btn-copy {
            background: rgba(90, 200, 250, 0.2);
        }

        .btn-copy:hover {
            background: rgba(90, 200, 250, 0.3);
        }

        .btn-delete {
            background: rgba(255, 45, 85, 0.2);
        }

        .btn-delete:hover {
            background: rgba(255, 45, 85, 0.3);
        }

        .add-code-btn {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            color: white;
            border: none;
            border-radius: var(--btn-radius);
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 122, 255, 0.3);
        }

        .add-code-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state p {
            margin-bottom: 5px;
        }

        /* Settings section */
        .settings-content {
            display: none;
        }

        .settings-content.active {
            display: block;
        }

        /* Period select styling - USER OVERRIDE + Custom Arrow Compatibility */
        select#period {
            background-color: var(--primary-blue) !important; 
            color: white !important;
            font-weight: bold !important;
            /* Ensure custom arrow is visible and correctly positioned */
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20292.4%20292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E') !important;
            background-repeat: no-repeat !important;
            background-position: right 15px center !important;
            background-size: 10px !important;
            padding-right: 40px !important;
        }

        .settings-content .input-group .button-pair { 
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }


        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 450px;
            box-shadow: var(--glass-shadow);
            transform: scale(0.95);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: var(--text-color);
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Confirmation Modal */
        #confirmDeleteModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        #confirmDeleteModal.active {
            opacity: 1;
            visibility: visible;
        }

        .confirm-modal-content {
            background-color: white; 
            border-radius: 8px;
            max-width: 350px;
            width: calc(100% - 40px); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transform: scale(0.95);
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        #confirmDeleteModal.active .confirm-modal-content {
            transform: scale(1);
        }

        .confirm-modal-header {
            padding: 15px 20px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .confirm-modal-title {
            font-size: 16px;
            color: #212529;
            font-weight: 500;
        }

        .confirm-modal-body {
            padding: 20px;
            color: #212529;
            font-size: 15px;
        }

        .confirm-modal-footer {
            display: flex;
            justify-content: center; 
            padding: 15px 20px;
            gap: 10px; 
        }

        .confirm-btn {
            flex: 1; 
            max-width: 120px; 
            padding: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-ok { 
            background-color: #dc3545; 
            color: white;
        }

        .btn-ok:hover {
            background-color: #c82333;
        }

        .btn-cancel {
            background-color: #6c757d; 
            color: white;
        }

        .btn-cancel:hover {
            background-color: #5a6268;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%; 
            transform: translateX(-50%) translateY(30px); 
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px 20px;
            box-shadow: var(--glass-shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-color);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 1000;
            max-width: calc(100% - 40px); 
            width: auto; 
        }

        .notification.show {
            transform: translateX(-50%) translateY(0); 
            opacity: 1;
        }

        .notification-success {
            border-left: 4px solid var(--success-glow);
        }

        .notification-success i {
            color: var(--success-glow);
            font-size: 20px;
        }

        .notification-error {
            border-left: 4px solid var(--danger-glow);
        }

        .notification-error i {
            color: var(--danger-glow);
            font-size: 20px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .split-layout {
                grid-template-columns: 1fr;

    </style>
</head>
<body>
    <div class="bg-elements">
        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>
        <div class="bg-circle circle-3"></div>
        <div class="glass-sphere sphere-1"></div>
        <div class="glass-sphere sphere-2"></div>
    </div>

    <div class="container">
        <div class="app-header">
            <h1 class="app-title">Get 2FA Code</h1>
            <p class="app-subtitle">Generate and manage two-factor authentication codes.</p>
        </div>

        <div class="split-layout">
            <div class="glass-card generator-section">
                <div class="section-title">
                    <i class="fas fa-key"></i> Generate Code
                </div>
                
                <div class="input-group">
                    <label class="input-label" for="secretInput">Secret Key</label>
                    <input type="text" id="secretInput" class="glass-input" placeholder="Enter your 2FA secret key" autocomplete="off">
                </div>

                <div class="token-display" id="tokenDisplay">
                    <div class="token-value" id="token">------</div>
                    <div class="timer-container">
                        <div class="timer-bar" id="timerBar"></div>
                    </div>
                    <div class="timer-text">
                        Refreshes in <span id="secondsCounter">30</span> seconds
                    </div>
                </div>

                <div class="button-group">
                    <button class="glass-btn btn-primary" id="generateBtn">
                        <i class="fas fa-sync-alt"></i> Generate
                    </button>
                    <button class="glass-btn" id="copyBtn">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                    <button class="glass-btn" id="saveBtn">
                        <i class="fas fa-save"></i> Save
                    </button>
                    <button class="glass-btn btn-danger" id="clearBtn">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
            </div>

            <div class="glass-card">
                <div class="tabs">
                    <button class="tab active" data-tab="saved">Saved Codes</button>
                    <button class="tab" data-tab="settings">Settings</button>
                    <div class="tab-indicator"></div>
                </div>

                <div class="saved-codes-content active"> <div class="saved-codes-list" id="savedCodesList">
                        <div class="empty-state" id="emptyState">
                            <i class="fas fa-folder-open"></i>
                            <p>No saved codes yet</p>
                            <p style="font-size: 14px; opacity: 0.7;">Save codes using the Save button</p>
                        </div>
                    </div>
                    <button class="add-code-btn" id="addNewBtn">
                        <i class="fas fa-plus"></i> Add New Code
                    </button>
                </div>

                <div class="settings-content">
                    <div class="input-group">
                        <label class="input-label" for="algorithm">Algorithm</label>
                        <select class="glass-input" id="algorithm">
                            <option value="SHA-1">SHA-1 (Default)</option>
                            <option value="SHA-256">SHA-256</option>
                            <option value="SHA-512">SHA-512</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="digits">Digits</label>
                        <select class="glass-input" id="digits">
                            <option value="6">6 digits (Default)</option>
                            <option value="7">7 digits</option>
                            <option value="8">8 digits</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="period">Period (seconds)</label>
                        <select class="glass-input" id="period" style="background-color: var(--primary-blue) !important; color: white !important; font-weight: bold !important;">
                            <option value="30">30 seconds (Default)</option>
                            <option value="60">60 seconds</option>
                            <option value="90">90 seconds</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Sync with Server</label>
                        <div class="button-pair">
                            <button class="glass-btn" id="exportBtn">
                                <i class="fas fa-upload"></i> Export to Server
                            </button>
                            <button class="glass-btn" id="importBtn">
                                <i class="fas fa-download"></i> Import from Server
                            </button>
                        </div>
                        <input type="text" id="serverUrl" class="glass-input" placeholder="Server URL (e.g., https://your-api.com/2fa)">
                        <input type="password" id="apiKey" class="glass-input" placeholder="API Key (optional)" style="margin-top: 10px;">
                    </div>

                    <div class="input-group">
                        <label class="input-label">Backup & Restore</label>
                         <div class="button-pair">
                            <button class="glass-btn" id="backupBtn">
                                <i class="fas fa-download"></i> Create Backup
                            </button>
                            <button class="glass-btn" id="restoreBtn">
                                <i class="fas fa-upload"></i> Restore Backup
                            </button>
                        </div>
                        <div id="lastBackupInfo" style="font-size: 13px; color: var(--text-secondary); margin-top: 5px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Add New Code</div>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label class="input-label" for="newLabel">Label</label>
                    <input type="text" id="newLabel" class="glass-input" placeholder="Google, Microsoft, etc.">
                </div>
                <div class="input-group">
                    <label class="input-label" for="newSecret">Secret Key</label>
                    <input type="text" id="newSecret" class="glass-input" placeholder="Enter 2FA secret key">
                </div>
            </div>
            <div class="modal-footer">
                <button class="glass-btn" id="cancelBtn">Cancel</button>
                <button class="glass-btn btn-primary" id="saveNewBtn">Save</button>
            </div>
        </div>
    </div>

    <div id="confirmDeleteModal">
        <div class="confirm-modal-content">
            <div class="confirm-modal-header">
                <div class="confirm-modal-title">Confirm Deletion</div>
            </div>
            <div class="confirm-modal-body">
                <p id="deleteConfirmMessage">Are you sure you want to delete this code?</p>
            </div>
            <div class="confirm-modal-footer">
                <button class="confirm-btn btn-cancel" id="cancelDeleteBtn">Cancel</button>
                <button class="confirm-btn btn-ok" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">
        <i class="fas fa-check-circle"></i>
        <span id="notificationText">Notification message</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script>
        document.addEventListener('keydown', function(event) {
            if (event.keyCode === 123 || (event.ctrlKey && event.keyCode === 85) || (event.ctrlKey && event.shiftKey && event.keyCode === 73) || (event.ctrlKey && event.shiftKey && event.keyCode === 74) || (event.ctrlKey && event.shiftKey && event.keyCode === 67)) {
                event.preventDefault();
                return false;
            }
        });
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
            return false;
        });

        const secretInput = document.getElementById('secretInput');
        const token = document.getElementById('token');
        const timerBar = document.getElementById('timerBar');
        const secondsCounter = document.getElementById('secondsCounter');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const saveBtn = document.getElementById('saveBtn');
        const clearBtn = document.getElementById('clearBtn');
        const tokenDisplay = document.getElementById('tokenDisplay');
        const savedCodesList = document.getElementById('savedCodesList');
        const emptyState = document.getElementById('emptyState');
        const addNewBtn = document.getElementById('addNewBtn');
        const tabs = document.querySelectorAll('.tab');
        const tabIndicator = document.querySelector('.tab-indicator');
        const savedCodesContent = document.querySelector('.saved-codes-content');
        const settingsContent = document.querySelector('.settings-content');
        const algorithmSelect = document.getElementById('algorithm');
        const digitsSelect = document.getElementById('digits');
        const periodSelect = document.getElementById('period');
        const addModal = document.getElementById('addModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const newLabel = document.getElementById('newLabel');
        const newSecret = document.getElementById('newSecret');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveNewBtn = document.getElementById('saveNewBtn');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const serverUrl = document.getElementById('serverUrl');
        const apiKey = document.getElementById('apiKey');
        const backupBtn = document.getElementById('backupBtn');
        const restoreBtn = document.getElementById('restoreBtn');
        const lastBackupInfo = document.getElementById('lastBackupInfo');
        const confirmDeleteModal = document.getElementById('confirmDeleteModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const deleteConfirmMessage = document.getElementById('deleteConfirmMessage');
        let codeToDelete = -1; 

        let mainTimer;
        let savedCodesRefreshTimer;
        let currentToken = '';
        let lastSecretInput = '';
        let savedCodes = [];
        let autoSaveTimer;

        function base32ToHex(base32) {
            const base32chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            base32 = base32.replace(/\s+/g, '').toUpperCase().replace(/=+$/, '');
            if (!/^[A-Z2-7]+$/.test(base32)) { 
                 console.error('Invalid base32 characters in secret:', base32);
                 throw new Error('Invalid base32 characters');
            }
            let bits = '';
            let hex = '';
            for (let i = 0; i < base32.length; i++) {
                const val = base32chars.indexOf(base32[i]);
                bits += val.toString(2).padStart(5, '0');
            }
            for (let i = 0; i + 4 <= bits.length; i += 4) {
                const chunk = bits.substring(i, i + 4);
                hex += parseInt(chunk, 2).toString(16);
            }
            return hex;
        }

        function generateTOTP(secret, period = 30, digits = 6, algorithm = 'SHA-1') {
            try {
                if (!secret || typeof secret !== 'string' || secret.trim() === '') {
                    throw new Error('Secret key is empty or invalid');
                }
                const hexSecret = base32ToHex(secret);
                const epoch = Math.floor(Date.now() / 1000);
                const counter = Math.floor(epoch / period);
                const counterHex = counter.toString(16).padStart(16, '0');
                const secretWordArray = CryptoJS.enc.Hex.parse(hexSecret);
                const counterWordArray = CryptoJS.enc.Hex.parse(counterHex);
                let hmacObj;
                if (algorithm === 'SHA-1') hmacObj = CryptoJS.HmacSHA1(counterWordArray, secretWordArray);
                else if (algorithm === 'SHA-256') hmacObj = CryptoJS.HmacSHA256(counterWordArray, secretWordArray);
                else if (algorithm === 'SHA-512') hmacObj = CryptoJS.HmacSHA512(counterWordArray, secretWordArray);
                else throw new Error('Unsupported algorithm: ' + algorithm);
                const hmac = hmacObj.toString(CryptoJS.enc.Hex);
                const offset = parseInt(hmac.substr(hmac.length - 1), 16);
                const binary = parseInt(hmac.substr(offset * 2, 8), 16) & 0x7fffffff;
                const otp = binary % Math.pow(10, digits);
                const code = otp.toString().padStart(digits, '0');
                const secondsRemaining = period - (epoch % period);
                return { code, secondsRemaining };
            } catch (error) {
                console.error('TOTP generation error:', error.message, 'Secret (partial):', String(secret).substring(0,5) + "...");
                return null;
            }
        }

        function updateMainTimerDisplay(secondsRemaining, period) {
            const percentage = (secondsRemaining / period) * 100;
            timerBar.style.width = `${percentage}%`;
            secondsCounter.textContent = secondsRemaining;
            if (secondsRemaining <= 5) timerBar.style.background = 'linear-gradient(to right, var(--danger-glow), #ff9500)';
            else timerBar.style.background = 'linear-gradient(to right, var(--primary-glow), var(--accent-glow))';
        }

        function generateMainToken() {
            const secret = secretInput.value.trim().replace(/\s+/g, '');
            if (!secret) {
                token.textContent = '------';
                if(mainTimer) clearInterval(mainTimer); 
                updateMainTimerDisplay(0, parseInt(periodSelect.value || 30));
                return;
            }
            const period = parseInt(periodSelect.value);
            const digits = parseInt(digitsSelect.value);
            const algorithm = algorithmSelect.value;
            try {
                const result = generateTOTP(secret, period, digits, algorithm);
                if (!result) {
                    token.textContent = 'ERROR';
                    updateMainTimerDisplay(0, period);
                    return;
                }
                if (result.code !== currentToken) {
                    token.style.opacity = '0';
                    setTimeout(() => {
                        currentToken = result.code;
                        token.textContent = result.code;
                        token.style.opacity = '1';
                    }, 100); 
                }
                updateMainTimerDisplay(result.secondsRemaining, period);
                lastSecretInput = secret;
            } catch (error) {
                token.textContent = 'ERROR';
                updateMainTimerDisplay(0, period);
            }
        }

        function startMainTokenUpdates() {
            if (mainTimer) clearInterval(mainTimer);
            generateMainToken(); 
            mainTimer = setInterval(generateMainToken, 1000);
        }

        function copyToClipboard() {
            if (currentToken && currentToken !== '------' && currentToken !== 'ERROR') {
                navigator.clipboard.writeText(currentToken)
                    .then(() => showNotification('Code copied to clipboard', 'success'))
                    .catch(err => {
                        console.error('Copy failed:', err);
                        showNotification('Failed to copy code', 'error');
                    });
            } else {
                showNotification('No valid code to copy', 'error');
            }
        }
        
        function updateSavedCodesListDOM() {
            savedCodesList.innerHTML = ''; 
            if (savedCodes.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            savedCodes.forEach((code, index) => {
                const codeItem = document.createElement('div');
                codeItem.className = 'saved-code-item';
                codeItem.setAttribute('data-index', index);
                codeItem.setAttribute('data-id', code.id); 

                codeItem.innerHTML = `
                    <div class="saved-code-header">
                        <div class="saved-code-label">${code.label}</div>
                        <div class="saved-code-time" id="saved-time-${code.id}">--s</div>
                    </div>
                    <div class="saved-code-value" id="saved-token-${code.id}">------</div>
                    <div class="saved-code-actions">
                        <button class="action-btn btn-load" data-index="${index}"><i class="fas fa-sync-alt"></i> Load</button>
                        <button class="action-btn btn-copy" data-code="------" id="saved-copy-${code.id}"><i class="fas fa-copy"></i> Copy</button>
                        <button class="action-btn btn-delete" data-index="${index}"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                `;
                savedCodesList.appendChild(codeItem);
            });
            addButtonEventListeners();
            refreshLiveSavedCodes(); 
        }

        function refreshLiveSavedCodes() {
            if (savedCodesContent.style.display === 'none' || savedCodes.length === 0) {
                return; 
            }
            savedCodes.forEach((codeData) => { 
                 const item = savedCodesList.querySelector(`.saved-code-item[data-id="${codeData.id}"]`);
                 if (!item) return; 

                const result = generateTOTP(
                    codeData.secret,
                    codeData.period || 30,
                    codeData.digits || 6,
                    codeData.algorithm || 'SHA-1'
                );

                const tokenEl = item.querySelector(`#saved-token-${codeData.id}`);
                const timeEl = item.querySelector(`#saved-time-${codeData.id}`);
                const copyBtnEl = item.querySelector(`#saved-copy-${codeData.id}`);

                if (result) {
                    if (tokenEl && tokenEl.textContent !== result.code) tokenEl.textContent = result.code;
                    if (timeEl) timeEl.textContent = `${result.secondsRemaining}s`;
                    if (copyBtnEl) copyBtnEl.setAttribute('data-code', result.code);
                } else {
                    if (tokenEl) tokenEl.textContent = 'ERROR';
                    if (timeEl) timeEl.textContent = 'Error';
                    if (copyBtnEl) copyBtnEl.setAttribute('data-code', 'ERROR');
                }
            });
        }


        function saveCurrentCode() {
            if (currentToken && currentToken !== '------' && currentToken !== 'ERROR') {
                newSecret.value = secretInput.value.trim();
                newLabel.value = ''; 
                openAddModal();
            } else {
                showNotification('Generate a valid code first', 'error');
            }
        }

        function clearAll() {
            secretInput.value = '';
            token.textContent = '------';
            currentToken = '';
            if(mainTimer) clearInterval(mainTimer);
            updateMainTimerDisplay(0, parseInt(periodSelect.value || 30));
            showNotification('Input cleared', 'success');
        }

        function showNotification(message, type = 'success') {
            notification.className = 'notification'; 
            notification.classList.add(`notification-${type}`);
            notification.querySelector('i').className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
            notificationText.textContent = message;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        function openAddModal() {
            addModal.classList.add('active');
            setTimeout(() => newLabel.focus(), 50);
        }

        function closeAddModal() {
            addModal.classList.remove('active');
        }
        
        function addNewCodeToList() {
            const label = newLabel.value.trim() || 'Unnamed Code';
            const secret = newSecret.value.trim();
            if (!secret) {
                showNotification('Secret key is required', 'error');
                return;
            }
            try {
                const result = generateTOTP(secret); 
                if (!result) { 
                    showNotification('Invalid secret key or parameters', 'error');
                    return;
                }
                const newCodeEntry = {
                    id: Date.now(), 
                    label,
                    secret,
                    algorithm: algorithmSelect.value, 
                    digits: parseInt(digitsSelect.value),
                    period: parseInt(periodSelect.value)
                };
                savedCodes.unshift(newCodeEntry); 
                saveCodesToLocalStorage();
                updateSavedCodesListDOM(); 
                closeAddModal();
                showNotification(`Code "${label}" saved`, 'success');
                showTab('saved'); 
            } catch (error) { 
                showNotification('Invalid secret key format', 'error');
                console.error("Error adding new code:", error);
            }
        }

        function addButtonEventListeners() {
            savedCodesList.querySelectorAll('.btn-load').forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                newBtn.addEventListener('click', (e) => loadSavedCode(parseInt(e.currentTarget.getAttribute('data-index'))));
            });
            savedCodesList.querySelectorAll('.btn-copy').forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                newBtn.addEventListener('click', (e) => copySavedCodeValue(e.currentTarget.getAttribute('data-code')));
            });
             savedCodesList.querySelectorAll('.btn-delete').forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                newBtn.addEventListener('click', (e) => confirmDeletion(parseInt(e.currentTarget.getAttribute('data-index'))));
            });
        }

        function loadSavedCode(index) {
            const code = savedCodes[index];
            if (!code) return;
            secretInput.value = code.secret;
            algorithmSelect.value = code.algorithm || 'SHA-1';
            digitsSelect.value = code.digits || 6;
            periodSelect.value = code.period || 30;
            startMainTokenUpdates();
            showNotification(`Loaded: ${code.label}`, 'success');
        }

        function copySavedCodeValue(codeToCopy) {
            if (codeToCopy && codeToCopy !== 'ERROR' && codeToCopy !== '------') {
                navigator.clipboard.writeText(codeToCopy)
                    .then(() => showNotification('Code copied', 'success'))
                    .catch(err => showNotification('Copy failed', 'error'));
            } else {
                showNotification('No valid code to copy', 'error');
            }
        }

        function confirmDeletion(index) {
            const code = savedCodes[index];
            if (!code) return;
            codeToDelete = index; 
            deleteConfirmMessage.textContent = `Delete "${code.label}"?`;
            confirmDeleteModal.classList.add('active');
        }
        
        function showTab(tabName) {
            tabs.forEach(t => t.classList.remove('active'));
            const activeTabButton = document.querySelector(`.tab[data-tab="${tabName}"]`);
            if (activeTabButton) activeTabButton.classList.add('active');
            
            const tabIndex = Array.from(tabs).findIndex(t => t.getAttribute('data-tab') === tabName);
            if (tabIndicator) tabIndicator.style.transform = `translateX(${tabIndex * 100}%)`;

            if (savedCodesContent) savedCodesContent.style.display = tabName === 'saved' ? 'block' : 'none';
            if (settingsContent) settingsContent.style.display = tabName === 'settings' ? 'block' : 'none';

            if(tabName === 'saved' && typeof updateSavedCodesListDOM === 'function') {
                 updateSavedCodesListDOM(); 
            }
        }

        function loadCodesFromLocalStorage() {
            const savedCodesStr = localStorage.getItem('savedCodes_v2'); 
            if (savedCodesStr) {
                try {
                    savedCodes = JSON.parse(savedCodesStr);
                } catch (e) {
                    console.error('Error loading saved codes:', e);
                    savedCodes = [];
                }
            } else {
                const oldCodesStr = localStorage.getItem('savedCodes');
                if (oldCodesStr) {
                    try {
                        const oldCodes = JSON.parse(oldCodesStr);
                        savedCodes = oldCodes.map((code, index) => ({
                            id: code.id || Date.now() + index, 
                            label: code.label || `Code ${index + 1}`,
                            secret: code.secret,
                            algorithm: code.algorithm || 'SHA-1',
                            digits: code.digits || 6,
                            period: code.period || 30
                        }));
                        saveCodesToLocalStorage(); 
                        localStorage.removeItem('savedCodes'); 
                        showNotification('Migrated codes to new format.', 'success');
                    } catch (e) { savedCodes = []; }
                } else {
                    savedCodes = [];
                }
            }
            // updateSavedCodesListDOM(); // Call after DOM is fully ready or when tab is shown
            updateBackupInfo(); 
        }

        function saveCodesToLocalStorage() {
            localStorage.setItem('savedCodes_v2', JSON.stringify(savedCodes));
            createBackup(false); 
        }

        function createBackup(showMessage = true) {
            if (savedCodes.length > 0) {
                const now = new Date();
                const backupData = { codes: savedCodes, timestamp: now.getTime(), date: now.toLocaleString() };
                localStorage.setItem('savedCodes_backup_v2', JSON.stringify(backupData));
                if (showMessage) showNotification('Backup created successfully', 'success');
                updateBackupInfo();
            } else {
                if (showMessage) showNotification('No codes to backup', 'error');
            }
        }

        function restoreFromBackup() {
            const backupStr = localStorage.getItem('savedCodes_backup_v2');
            if (!backupStr) {
                showNotification('No backup found', 'error');
                return;
            }
            try {
                const backupData = JSON.parse(backupStr);
                if (!backupData.codes || !Array.isArray(backupData.codes)) {
                    showNotification('Invalid backup data', 'error');
                    return;
                }
                if (confirm(`Restore backup from ${backupData.date || new Date(backupData.timestamp).toLocaleString()}? This will overwrite current codes.`)) {
                    savedCodes = backupData.codes;
                    saveCodesToLocalStorage(); 
                    updateSavedCodesListDOM();
                    showNotification('Backup restored successfully', 'success');
                }
            } catch (e) {
                showNotification('Failed to restore backup', 'error');
            }
        }
         function updateBackupInfo() {
            const backupStr = localStorage.getItem('savedCodes_backup_v2');
            if (lastBackupInfo && backupStr) { // Check if lastBackupInfo exists
                try {
                    const backupData = JSON.parse(backupStr);
                    lastBackupInfo.textContent = `Last backup: ${backupData.date || new Date(backupData.timestamp).toLocaleString() || 'Unknown'}`;
                } catch { lastBackupInfo.textContent = 'Backup data may be corrupted.'; }
            } else if (lastBackupInfo) {
                lastBackupInfo.textContent = 'No backup available.';
            }
        }

        function exportToServer() {
            const url = serverUrl.value.trim();
            if (!url) { showNotification('Server URL is required', 'error'); return; }
            saveServerSettings(); 
            const exportData = { codes: savedCodes, timestamp: Date.now(), deviceInfo: navigator.userAgent };
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': apiKey.value ? `Bearer ${apiKey.value}` : '' },
                body: JSON.stringify(exportData)
            })
            .then(response => response.ok ? response.json() : Promise.reject(new Error('Server error: ' + response.statusText)))
            .then(() => showNotification('Exported to server', 'success'))
            .catch(error => showNotification('Export failed: ' + error.message, 'error'));
        }

        function importFromServer() {
            const url = serverUrl.value.trim();
            if (!url) { showNotification('Server URL is required', 'error'); return; }
            saveServerSettings(); 
            fetch(url, { method: 'GET', headers: { 'Authorization': apiKey.value ? `Bearer ${apiKey.value}` : '' }})
            .then(response => response.ok ? response.json() : Promise.reject(new Error('Server error: ' + response.statusText)))
            .then(data => {
                if (data && data.codes && Array.isArray(data.codes)) {
                    if (confirm('Replace current codes with data from server? (Current codes will be backed up)')) {
                        createBackup(false); 
                        savedCodes = data.codes;
                        saveCodesToLocalStorage();
                        updateSavedCodesListDOM();
                        showNotification('Imported from server', 'success');
                    }
                } else { throw new Error('Invalid data format from server'); }
            })
            .catch(error => showNotification('Import failed: ' + error.message, 'error'));
        }
        
        function loadServerSettings() {
            if(serverUrl) serverUrl.value = localStorage.getItem('2fa_server_url') || '';
            if(apiKey) apiKey.value = localStorage.getItem('2fa_api_key') || ''; 
        }

        function saveServerSettings() {
            if(serverUrl) localStorage.setItem('2fa_server_url', serverUrl.value.trim());
            if(apiKey) localStorage.setItem('2fa_api_key', apiKey.value.trim()); 
        }
        
        confirmDeleteBtn.addEventListener('click', () => {
            if (codeToDelete >= 0 && codeToDelete < savedCodes.length) {
                savedCodes.splice(codeToDelete, 1);
                saveCodesToLocalStorage();
                updateSavedCodesListDOM();
                showNotification('Code deleted', 'success');
            }
            confirmDeleteModal.classList.remove('active');
            codeToDelete = -1;
        });
        cancelDeleteBtn.addEventListener('click', () => {
            confirmDeleteModal.classList.remove('active');
            codeToDelete = -1;
        });

        if(exportBtn) exportBtn.addEventListener('click', exportToServer);
        if(importBtn) importBtn.addEventListener('click', importFromServer);
        if(backupBtn) backupBtn.addEventListener('click', () => createBackup(true));
        if(restoreBtn) restoreBtn.addEventListener('click', restoreFromBackup);

        const applySettingToAll = (settingType, value) => {
             if (savedCodes.length > 0 && confirm(`Apply this ${settingType.toLowerCase()} setting to all saved codes?`)) {
                savedCodes.forEach(code => {
                    code[settingType.toLowerCase()] = value; 
                });
                saveCodesToLocalStorage();
                updateSavedCodesListDOM(); 
                refreshLiveSavedCodes(); 
                showNotification(`Updated ${settingType.toLowerCase()} for all codes`, 'success');
            }
        };

        if(algorithmSelect) algorithmSelect.addEventListener('change', () => {
            startMainTokenUpdates();
            applySettingToAll('Algorithm', algorithmSelect.value);
        });
        if(digitsSelect) digitsSelect.addEventListener('change', () => {
            startMainTokenUpdates();
            applySettingToAll('Digits', parseInt(digitsSelect.value));
        });
        if(periodSelect) periodSelect.addEventListener('change', () => {
            startMainTokenUpdates();
            applySettingToAll('Period', parseInt(periodSelect.value));
        });

        secretInput.addEventListener('input', () => {
            clearTimeout(window.debounceTimer);
            window.debounceTimer = setTimeout(() => {
                if (secretInput.value.trim() !== lastSecretInput) startMainTokenUpdates();
            }, 300);
        });
        secretInput.addEventListener('paste', () => setTimeout(startMainTokenUpdates, 50)); 
        generateBtn.addEventListener('click', startMainTokenUpdates);
        copyBtn.addEventListener('click', copyToClipboard);
        saveBtn.addEventListener('click', saveCurrentCode);
        clearBtn.addEventListener('click', clearAll);
        tokenDisplay.addEventListener('click', copyToClipboard);
        tabs.forEach((tab) => { 
            tab.addEventListener('click', () => showTab(tab.getAttribute('data-tab')));
        });
        addNewBtn.addEventListener('click', openAddModal);
        closeModalBtn.addEventListener('click', closeAddModal);
        cancelBtn.addEventListener('click', closeAddModal);
        saveNewBtn.addEventListener('click', addNewCodeToList);
        addModal.addEventListener('click', e => { if (e.target === addModal) closeAddModal(); }); 
        
        function setupAutoBackup() {
            if (autoSaveTimer) clearInterval(autoSaveTimer);
            autoSaveTimer = setInterval(() => {
                if (savedCodes.length > 0) {
                    createBackup(false); 
                    console.log('Auto backup performed at ' + new Date().toLocaleTimeString());
                }
            }, 5 * 60 * 1000); 
        }

        window.addEventListener('beforeunload', () => {
            if (savedCodes.length > 0) createBackup(false); 
        });


        // Initialize
        loadCodesFromLocalStorage();
        loadServerSettings();
        showTab('saved'); 
        if (secretInput.value.trim()) startMainTokenUpdates();
        
        if (!savedCodesRefreshTimer) { 
            savedCodesRefreshTimer = setInterval(refreshLiveSavedCodes, 1000);
        }
        setupAutoBackup();
    </script>
</body>
</html>
