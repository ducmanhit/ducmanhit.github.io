<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Đổi Văn Bản</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            /* Màu chính - Chế độ tối (mặc định) */
            --primary-dark: #0a2a80;
            --primary: #0e5bae;
            --primary-light: #0e8bd5;
            --white: #ffffff;
            
            /* Màu nền */
            --bg: #040d2c;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
            
            /* Màu chữ */
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            
            /* Hiệu ứng */
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            
            /* Bo tròn */
            --radius-sm: 0.5rem;
            --radius: 0.75rem;
            --radius-md: 1rem;
            --radius-lg: 1.5rem;
            --radius-xl: 2rem;
            
            /* Transition */
            --transition: 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Chế độ sáng */
        body.light {
            --bg: #f5f9ff;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(14, 91, 174, 0.2);
            --text: #0a2a80;
            --text-secondary: rgba(10, 42, 128, 0.7);
            --shadow: 0 8px 32px 0 rgba(14, 91, 174, 0.15);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--bg) 0%, #0a1f4d 100%);
            position: relative;
            overflow-x: hidden;
            transition: background-color var(--transition), color var(--transition);
        }
        
        body.light {
            background: linear-gradient(135deg, var(--bg) 0%, #e1e9ff 100%);
        }
        
        /* Các hình cầu trang trí */
        .sphere {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #0e8bd5, #0a2a80);
            box-shadow: 0 0 60px rgba(14, 139, 213, 0.5);
            z-index: 0;
        }
        
        .sphere-1 {
            top: 10%;
            left: 10%;
            width: 150px;
            height: 150px;
            animation: float 8s ease-in-out infinite;
        }
        
        .sphere-2 {
            bottom: 10%;
            right: 15%;
            width: 200px;
            height: 200px;
            animation: float 10s ease-in-out infinite 1s;
        }
        
        .sphere-3 {
            top: 60%;
            left: 75%;
            width: 100px;
            height: 100px;
            animation: float 7s ease-in-out infinite 0.5s;
        }
        
        body.light .sphere {
            opacity: 0.6;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        /* Hiệu ứng ánh sáng */
        .light-beam {
            position: absolute;
            top: -10%;
            left: 30%;
            width: 40%;
            height: 300px;
            background: linear-gradient(to bottom, rgba(14, 139, 213, 0.3), transparent);
            transform: rotate(15deg);
            filter: blur(30px);
            z-index: 0;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1;
        }
        
        .navbar {
            padding: 1.5rem 0;
            position: relative;
            z-index: 10;
        }
        
        .navbar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        
        .logo {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 25%; /* Bo góc nhẹ hơn */
            overflow: hidden;
            box-shadow: 0 0 20px rgba(14, 139, 213, 0.5);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .logo-text {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text);
            transition: color var(--transition);
        }
        
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            color: var(--text);
            padding: 0.5rem;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .theme-toggle:hover {
            transform: rotate(15deg);
            box-shadow: 0 0 15px rgba(14, 139, 213, 0.3);
        }
        
        .lang-dropdown {
            position: relative;
        }
        
        .lang-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-lg);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .lang-btn:hover {
            box-shadow: 0 0 15px rgba(14, 139, 213, 0.3);
        }
        
        .lang-flag {
            width: 20px;
            height: 15px;
            object-fit: cover;
            border-radius: 2px;
        }
        
        .lang-dropdown-content {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            overflow: hidden;
            min-width: 150px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all var(--transition);
            z-index: 100;
        }
        
        .lang-dropdown.active .lang-dropdown-content {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .lang-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--text);
            text-decoration: none;
            transition: background-color var(--transition);
        }
        
        .lang-option:hover {
            background-color: rgba(14, 139, 213, 0.1);
        }
        
        .main {
            flex: 1;
            padding: 2rem 0;
            position: relative;
            z-index: 1;
        }
        
        .editor-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        
        @media (min-width: 1024px) {
            .editor-container {
                grid-template-columns: 3fr 2fr;
            }
        }
        
        .glass-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: background-color var(--transition), 
                        border-color var(--transition), 
                        box-shadow var(--transition);
        }
        
        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
            transition: border-color var(--transition);
            background: linear-gradient(135deg, #0e8bd5, #0a2a80);
            color: white;
        }
        
        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
        }
        
        .card-title i {
            color: white;
        }
        
        .card-body {
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }
        
        .textarea-wrapper {
            position: relative;
            margin-bottom: 1rem;
        }
        
        .editor-textarea {
            width: 100%;
            min-height: 300px;
            padding: 1rem;
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
            transition: all var(--transition);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        body.light .editor-textarea {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .editor-textarea:focus {
            outline: none;
            border-color: #0e8bd5;
            box-shadow: 0 0 0 3px rgba(14, 139, 213, 0.2);
        }
        
        .char-count {
            position: absolute;
            bottom: 0.75rem;
            right: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: color var(--transition), background-color var(--transition);
        }
        
        body.light .char-count {
            background: rgba(255, 255, 255, 0.7);
            color: #0a2a80;
            font-weight: 500;
        }
        
        .editor-actions {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            transform: translateY(-3px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #0e8bd5, #0a2a80);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(14, 139, 213, 0.3);
        }
        
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(14, 139, 213, 0.5);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #0e8bd5, #0a2a80);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(14, 139, 213, 0.3);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(14, 139, 213, 0.5);
        }
        
        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all var(--transition);
        }
        
        body.light .btn-outline {
            background: rgba(255, 255, 255, 0.7);
            color: #0a2a80;
            border-color: rgba(14, 91, 174, 0.3);
            font-weight: 500;
        }
        
        .btn-outline:hover {
            border-color: #0e8bd5;
            box-shadow: 0 4px 15px rgba(14, 139, 213, 0.2);
        }
        
        body.light .btn-outline:hover {
            border-color: #0e5bae;
            color: #0e5bae;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }
        
        .tool-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        body.light .tool-btn {
            background: rgba(255, 255, 255, 0.7);
            color: #0a2a80;
            border-color: rgba(14, 91, 174, 0.3);
            font-weight: 600;
        }
        
        .tool-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s ease;
        }
        
        .tool-btn:hover::before {
            left: 100%;
        }
        
        .tool-btn i {
            color: #0e8bd5;
            font-size: 1rem;
        }
        
        body.light .tool-btn i {
            color: #0a2a80;
        }
        
        .tool-btn:hover {
            border-color: #0e8bd5;
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(14, 139, 213, 0.2);
        }
        
        body.light .tool-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: #0e5bae;
            box-shadow: 0 4px 15px rgba(14, 139, 213, 0.3);
        }
        
        .tool-btn.active {
            background: linear-gradient(135deg, #0e8bd5, #0a2a80);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(14, 139, 213, 0.3);
        }
        
        .tool-btn.active i {
            color: white;
        }
        
        body.light .tool-btn.active {
            background: linear-gradient(135deg, #0e8bd5, #0a2a80);
            color: white;
        }
        
        body.light .tool-btn.active i {
            color: white;
        }
        
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
        }
        
        .toast {
            background: var(--card-bg);
            color: var(--text);
            border-left: 4px solid #0e8bd5;
            border-radius: var(--radius);
            padding: 1rem 1.5rem;
            margin-top: 0.75rem;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateX(calc(100% + 2rem));
            opacity: 0;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        .toast i {
            font-size: 1.25rem;
            /* Color is set by .toast.success i and .toast.warning i */
        }
        
        .toast.success {
            border-left-color: #0e8bd5; 
        }
         .toast.success i {
            color: #0e8bd5; /* Ensure icon color matches border */
        }
        
        .toast.warning {
            border-left-color: #f72585; 
        }
        
        .toast.warning i {
            color: #f72585; /* Ensure icon color matches border */
        }
        
        .footer {
            padding: 1.5rem 0;
            position: relative;
            z-index: 1;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .footer-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
            transition: color var(--transition);
        }
        
        .footer-links {
            display: flex;
            gap: 1.5rem;
        }
        
        .footer-link {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-decoration: none;
            transition: color var(--transition);
            cursor: pointer;
        }
        
        .footer-link:hover {
            color: #0e8bd5;
        }
        
        /* Modal Styles - Cải tiến */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition), visibility var(--transition);
            backdrop-filter: blur(5px);
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            opacity: 0;
            transition: transform var(--transition), opacity var(--transition);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
        }
        
        .modal-overlay.active .modal {
            transform: scale(1);
            opacity: 1;
        }
        
        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #0e8bd5, #0a2a80);
            color: white;
        }
        
        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
        }
        
        .modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .modal-body {
            padding: 1.5rem;
            color: var(--text);
            overflow-y: auto;
            flex: 1;
        }
        
        /* Thanh cuộn tùy chỉnh */
        .modal-body::-webkit-scrollbar {
            width: 10px;
        }
        
        .modal-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .modal-body::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #0e8bd5, #0a2a80);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        
        .modal-body::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(to bottom, #0a2a80, #0e8bd5);
            border: 2px solid transparent;
            background-clip: content-box;
        }
        
        body.light .modal-body::-webkit-scrollbar-track {
            background: rgba(14, 91, 174, 0.1);
        }
        
        .modal-body h3 {
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: #0e8bd5;
            font-weight: 600;
        }
        
        .modal-body p {
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        
        .modal-body ul {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }
        
        .modal-body li {
            margin-bottom: 0.5rem;
        }
        
        /* Contact Form Styles */
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            transition: all var(--transition);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        body.light .form-control {
            background: rgba(255, 255, 255, 0.5);
            color: #0a2a80;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #0e8bd5;
            box-shadow: 0 0 0 3px rgba(14, 139, 213, 0.2);
        }
        
        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }
        
        .form-submit {
            margin-top: 1rem;
        }
        
        @media (max-width: 768px) {
            .editor-actions {
                flex-direction: column;
            }
            
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            
            .footer-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>
<body class="light"> <div class="sphere sphere-1"></div>
    <div class="sphere sphere-2"></div>
    <div class="sphere sphere-3"></div>
    
    <div class="light-beam"></div>
    
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="#" class="logo-link">
                <div class="logo">
                    <img src="https://i.postimg.cc/CznzdZD9/logo.png" alt="Logo" class="logo-image" onerror="this.onerror=null; this.src='https://placehold.co/40x40/0e5bae/ffffff?text=L';">
                </div>
                <span class="logo-text" id="appName">Text Conversion</span>
            </a>
            
            <div class="navbar-actions">
                <div class="lang-dropdown" id="langDropdown">
                    <button class="lang-btn" id="langBtn">
                        <img src="https://flagcdn.com/w20/vn.png" alt="Tiếng Việt" class="lang-flag" id="currentFlag" onerror="this.onerror=null; this.src='https://placehold.co/20x15/cccccc/000000?text=VN';">
                        <span id="currentLang">Tiếng Việt</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="lang-dropdown-content">
                        <a href="#" class="lang-option" data-lang="vi">
                            <img src="https://flagcdn.com/w20/vn.png" alt="Tiếng Việt" class="lang-flag" onerror="this.onerror=null; this.src='https://placehold.co/20x15/cccccc/000000?text=VN';">
                            <span>Tiếng Việt</span>
                        </a>
                        <a href="#" class="lang-option" data-lang="en">
                            <img src="https://flagcdn.com/w20/gb.png" alt="English" class="lang-flag" onerror="this.onerror=null; this.src='https://placehold.co/20x15/cccccc/000000?text=EN';">
                            <span>English</span>
                        </a>
                    </div>
                </div>
                
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i> </button>
            </div>
        </div>
    </nav>
    
    <main class="main">
        <div class="container">
            <div class="editor-container">
                <div class="glass-card" id="editorCard">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fas fa-keyboard"></i>
                            <span id="editorTitle">Trình soạn thảo</span>
                        </div>
                    </div>
                    
                    <div class="card-body">
                        <div class="textarea-wrapper">
                            <textarea class="editor-textarea" id="inputText" placeholder="Nhập hoặc dán văn bản của bạn vào đây..."></textarea>
                            <div class="char-count" id="charCount">0 ký tự</div>
                        </div>
                        
                        <div class="editor-actions">
                            <button class="btn btn-primary" id="copyBtn">
                                <i class="far fa-copy"></i>
                                <span data-lang-key="buttons.copy">Sao chép</span>
                            </button>
                            
                            <button class="btn btn-secondary" id="resetBtn">
                                <i class="fas fa-history"></i>
                                <span data-lang-key="buttons.reset">Khôi phục</span>
                            </button>
                            
                            <button class="btn btn-outline" id="clearBtn">
                                <i class="far fa-trash-alt"></i>
                                <span data-lang-key="buttons.clear">Xóa</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="glass-card" id="toolsCard">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fas fa-tools"></i>
                            <span id="toolsTitle">Công cụ chuyển đổi</span>
                        </div>
                    </div>
                    
                    <div class="card-body">
                        <div class="tools-grid">
                            <button class="tool-btn" data-type="uppercase">
                                <i class="fas fa-arrow-up"></i>
                                <span data-lang-key="buttons.uppercase">CHỮ HOA</span>
                            </button>
                            
                            <button class="tool-btn" data-type="lowercase">
                                <i class="fas fa-arrow-down"></i>
                                <span data-lang-key="buttons.lowercase">chữ thường</span>
                            </button>
                            
                            <button class="tool-btn" data-type="capitalizeWords">
                                <i class="fas fa-heading"></i>
                                <span data-lang-key="buttons.capitalizeWords">Viết Hoa Đầu Từ</span>
                            </button>
                            
                            <button class="tool-btn" data-type="capitalizeSentences">
                                <i class="fas fa-paragraph"></i>
                                <span data-lang-key="buttons.capitalizeSentences">Viết hoa câu</span>
                            </button>
                            
                            <button class="tool-btn" data-type="toggleCase">
                                <i class="fas fa-random"></i>
                                <span data-lang-key="buttons.toggleCase">cHữ XeN kẼ</span>
                            </button>
                            
                            <button class="tool-btn" data-type="slug">
                                <i class="fas fa-link"></i>
                                <span data-lang-key="buttons.slug">Slug URL</span>
                            </button>
                            
                            <button class="tool-btn" data-type="removeAccents">
                                <i class="fas fa-eraser"></i>
                                <span data-lang-key="buttons.removeAccents">Xóa dấu</span>
                            </button>
                            
                            <button class="tool-btn" data-type="normal">
                                <i class="fas fa-font"></i>
                                <span data-lang-key="buttons.normal">Bình thường</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div class="toast-container">
        </div>
    
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p class="footer-text" id="footerText">Thiết kế bởi DucManh.</p>
                
                <div class="footer-links">
                    <a class="footer-link" id="contactLink" data-lang-key="contactLink">Liên hệ</a>
                </div>
            </div>
        </div>
    </footer>
    
    <div class="modal-overlay" id="contactModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" data-lang-key="contactTitle">Liên hệ với chúng tôi</h2>
                <button class="modal-close" data-modal="contactModal">&times;</button>
            </div>
            <div class="modal-body">
                <p data-lang-key="contactIntro">Vui lòng điền vào biểu mẫu dưới đây để gửi thông tin liên hệ. Chúng tôi sẽ phản hồi trong thời gian sớm nhất.</p>
                
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name" class="form-label" data-lang-key="formLabels.name">Họ và tên</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label" data-lang-key="formLabels.email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject" class="form-label" data-lang-key="formLabels.subject">Chủ đề</label>
                        <input type="text" id="subject" name="subject" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message" class="form-label" data-lang-key="formLabels.message">Nội dung</label>
                        <textarea id="message" name="message" class="form-control" required></textarea>
                    </div>
                    
                    <div class="form-submit">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i>
                            <span data-lang-key="formLabels.submit">Gửi tin nhắn</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const inputText = document.getElementById('inputText');
            const charCount = document.getElementById('charCount');
            const toastContainer = document.querySelector('.toast-container');
            const copyBtn = document.getElementById('copyBtn');
            const clearBtn = document.getElementById('clearBtn');
            const resetBtn = document.getElementById('resetBtn');
            const themeToggle = document.getElementById('themeToggle');
            const langDropdown = document.getElementById('langDropdown');
            const langBtn = document.getElementById('langBtn');
            const langOptions = document.querySelectorAll('.lang-option');
            const currentLangText = document.getElementById('currentLang');
            const currentFlag = document.getElementById('currentFlag');
            const toolButtons = document.querySelectorAll('.tool-btn');
            
            // Modal elements
            const contactLink = document.getElementById('contactLink');
            const modalOverlays = document.querySelectorAll('.modal-overlay');
            const modalCloseButtons = document.querySelectorAll('.modal-close');
            const contactForm = document.getElementById('contactForm');
            
            // State Variables
            let currentType = null; // Stores the currently active conversion type (e.g., 'uppercase')
            let originalText = inputText.value; // Text at session start or after last clear
            let currentLang = 'vi'; // Default language

            // Language Text Object
            const texts = {
                vi: {
                    appName: "Chuyển Đổi Chữ",
                    langName: "Tiếng Việt",
                    flagUrl: "https://flagcdn.com/w20/vn.png",
                    editorTitle: "Trình soạn thảo",
                    toolsTitle: "Công cụ chuyển đổi",
                    placeholder: "Nhập hoặc dán văn bản của bạn vào đây...",
                    charCount: "ký tự",
                    footerText: "Thiết kế bởi DucManh.",
                    contactTitle: "Liên hệ với chúng tôi",
                    contactIntro: "Vui lòng điền vào biểu mẫu dưới đây để gửi thông tin liên hệ. Chúng tôi sẽ phản hồi trong thời gian sớm nhất.",
                    contactLink: "Liên hệ",
                    formLabels: { name: "Họ và tên", email: "Email", subject: "Chủ đề", message: "Nội dung", submit: "Gửi tin nhắn" },
                    buttons: { uppercase: "CHỮ HOA", lowercase: "chữ thường", capitalizeWords: "Viết Hoa Đầu Từ", capitalizeSentences: "Viết hoa câu", toggleCase: "cHữ XeN kẼ", slug: "Slug URL", removeAccents: "Xóa dấu", normal: "Bình thường", copy: "Sao chép", clear: "Xóa", reset: "Khôi phục" },
                    toast: { copied: "Đã sao chép vào clipboard!", cleared: "Đã xóa văn bản!", reset: "Đã khôi phục văn bản gốc!", converted: "Đã chuyển đổi thành công!", error: "Lỗi khi chuyển đổi văn bản!", noText: "Không có văn bản!", messageSent: "Tin nhắn đã được gửi thành công!"}
                },
                en: {
                    appName: "Text Conversion",
                    langName: "English",
                    flagUrl: "https://flagcdn.com/w20/gb.png",
                    editorTitle: "Editor",
                    toolsTitle: "Conversion Tools",
                    placeholder: "Enter or paste your text here...",
                    charCount: "characters",
                    footerText: "Design by DucManh.",
                    contactTitle: "Contact Us",
                    contactIntro: "Please fill out the form below to send us a message. We will respond as soon as possible.",
                    contactLink: "Contact",
                    formLabels: { name: "Full Name", email: "Email", subject: "Subject", message: "Message", submit: "Send Message" },
                    buttons: { uppercase: "UPPERCASE", lowercase: "lowercase", capitalizeWords: "Capitalize Words", capitalizeSentences: "Capitalize Sentences", toggleCase: "tOgGlE cAsE", slug: "Slug URL", removeAccents: "Remove Accents", normal: "Normal", copy: "Copy", clear: "Clear", reset: "Reset" },
                    toast: { copied: "Copied to clipboard!", cleared: "Text cleared!", reset: "Reset to original text!", converted: "Conversion successful!", error: "Error converting text!", noText: "No text to process!", messageSent: "Message sent successfully!"}
                }
            };

            // --- Event Listeners ---

            // Text Input Area Listeners
            inputText.addEventListener('input', function() {
                if (originalText === '' && inputText.value.trim() !== '') {
                    originalText = inputText.value; 
                }
                currentType = null; 
                updateActiveToolButtonStates();
                updateCharCount();
            });

            inputText.addEventListener('paste', function() {
                setTimeout(() => { 
                    originalText = inputText.value; 
                    currentType = null;
                    updateActiveToolButtonStates();
                    updateCharCount();
                }, 0);
            });

            // Action Buttons
            copyBtn.addEventListener('click', copyText);

            clearBtn.addEventListener('click', function() {
                inputText.value = '';
                originalText = ''; 
                currentType = null;
                updateActiveToolButtonStates();
                updateCharCount();
                showToast(texts[currentLang].toast.cleared, 'success');
            });

            resetBtn.addEventListener('click', function() {
                const textBeforeReset = inputText.value;
                if (textBeforeReset !== originalText) {
                    inputText.value = originalText;
                    showToast(texts[currentLang].toast.reset, 'success');
                } else if (textBeforeReset === '' && originalText === '') {
                    showToast(texts[currentLang].toast.noText, 'warning');
                    return;
                }
                currentType = null; 
                updateActiveToolButtonStates(); 
                updateCharCount();
            });

            // Tool Buttons
            toolButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const clickedButtonType = this.getAttribute('data-type');
                    const textBeforeOperation = inputText.value;
                    let toastMessageKey = '';
                    let toastType = 'success'; // Default toast type

                    if (this.classList.contains('active') && clickedButtonType !== 'normal') {
                        // Case 1: Clicking an already active (non-Normal) button -> revert to originalText
                        inputText.value = originalText;
                        currentType = null; 
                        toastMessageKey = 'reset';
                    } else if (clickedButtonType === 'normal') {
                        // Case 2: Clicking the "Normal" button
                        inputText.value = originalText;
                        currentType = 'normal';
                        if (textBeforeOperation !== originalText) {
                            toastMessageKey = 'reset';
                        }
                    } else {
                        // Case 3: Clicking a new/different conversion, or an inactive button (that isn't "Normal")
                        convertText(clickedButtonType); 
                        currentType = clickedButtonType;
                        if (textBeforeOperation !== inputText.value) {
                            toastMessageKey = 'converted';
                        }
                    }

                    if (toastMessageKey) {
                        showToast(texts[currentLang].toast[toastMessageKey], toastType);
                    }
                    updateActiveToolButtonStates();
                    updateCharCount();
                });
            });
            
            // Theme Toggle
            themeToggle.addEventListener('click', toggleTheme);

            // Language Dropdown
            langBtn.addEventListener('click', function(e) {
                e.preventDefault();
                langDropdown.classList.toggle('active');
                e.stopPropagation(); 
            });

            document.addEventListener('click', function(e) { 
                if (!langDropdown.contains(e.target)) {
                    langDropdown.classList.remove('active');
                }
            });

            langOptions.forEach(option => {
                option.addEventListener('click', function(e) {
                    e.preventDefault();
                    const lang = this.getAttribute('data-lang');
                    updateLanguage(lang);
                    langDropdown.classList.remove('active');
                });
            });

            // Modal Handling
            contactLink.addEventListener('click', function() { openModal('contactModal'); });

            modalCloseButtons.forEach(button => {
                button.addEventListener('click', function() {
                    closeModal(this.getAttribute('data-modal'));
                });
            });

            modalOverlays.forEach(overlay => {
                overlay.addEventListener('click', function(e) {
                    if (e.target === this) closeModal(this.id);
                });
            });
             document.querySelectorAll('.modal').forEach(modal => { 
                modal.addEventListener('click', e => e.stopPropagation());
            });

            if (contactForm) {
                contactForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    setTimeout(() => {
                        showToast(texts[currentLang].toast.messageSent, 'success');
                        closeModal('contactModal');
                        contactForm.reset();
                    }, 1000);
                });
            }

            // --- Helper Functions ---

            function updateCharCount() {
                const count = inputText.value.length;
                charCount.textContent = `${count} ${texts[currentLang].charCount}`;
            }

            function convertText(type) { 
                let text = inputText.value;
                const textBeforeThisConversion = text; 
                try {
                    switch(type) {
                        case 'uppercase': 
                            inputText.value = text.toLocaleUpperCase('vi-VN'); 
                            break;
                        case 'lowercase': 
                            inputText.value = text.toLocaleLowerCase('vi-VN'); 
                            break;
                        case 'capitalizeWords': 
                            inputText.value = text.normalize('NFC').toLocaleLowerCase('vi-VN')
                                .split(/(\s+)/) // Split by spaces, keeping the spaces
                                .map(wordOrSpace => {
                                    if (wordOrSpace.match(/\s+/)) { // If it's a space, keep it
                                        return wordOrSpace;
                                    }
                                    // If it's a word, capitalize its first letter
                                    return wordOrSpace.length > 0 ? wordOrSpace.charAt(0).toLocaleUpperCase('vi-VN') + wordOrSpace.slice(1) : '';
                                })
                                .join('');
                            break;
                        case 'capitalizeSentences': 
                            inputText.value = text.normalize('NFC').toLocaleLowerCase('vi-VN').replace(/(^\s*\p{L}|[.!?]\s*\p{L})/gu, c => c.toLocaleUpperCase('vi-VN'));
                            break;
                        case 'toggleCase':
                            let toggled = '';
                            for(let i=0; i<text.length; i++) {
                                let char = text.charAt(i);
                                // Use locale-specific comparison for robustness if needed, but direct comparison often works
                                if (char === char.toLocaleUpperCase('vi-VN') && char !== char.toLocaleLowerCase('vi-VN')) { // It's an uppercase letter that has a lowercase form
                                    toggled += char.toLocaleLowerCase('vi-VN');
                                } else if (char === char.toLocaleLowerCase('vi-VN') && char !== char.toLocaleUpperCase('vi-VN')) { // It's a lowercase letter that has an uppercase form
                                    toggled += char.toLocaleUpperCase('vi-VN');
                                } else { // Not a cased letter (e.g. punctuation, number) or a letter with no case difference
                                    toggled += char;
                                }
                            }
                            inputText.value = toggled;
                            break;
                        case 'slug':
                            inputText.value = text.toLocaleLowerCase('vi-VN') // Start with locale-specific lowercase
                                .normalize('NFD').replace(/[\u0300-\u036f]/g, '') 
                                .replace(/đ/g, 'd') // Explicitly handle 'đ' after NFD
                                .replace(/[^a-z0-9\s-]/g, '').trim() 
                                .replace(/\s+/g, '-').replace(/-+/g, '-'); 
                            break;
                        case 'removeAccents':
                            inputText.value = text.normalize('NFD') 
                                .replace(/[\u0300-\u036f]/g, '') 
                                .replace(/đ/g, 'd').replace(/Đ/g, 'D'); 
                            break;
                    }
                } catch (error) {
                    console.error('Lỗi chuyển đổi:', error);
                    showToast(texts[currentLang].toast.error, 'warning'); 
                    inputText.value = textBeforeThisConversion; 
                }
            }

            function copyText() {
                if (!inputText.value) {
                    showToast(texts[currentLang].toast.noText, 'warning');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(inputText.value).then(() => {
                        showToast(texts[currentLang].toast.copied, 'success');
                    }).catch(err => {
                        console.warn("Async clipboard copy failed, using fallback:", err);
                        fallbackCopyText();
                    });
                } else {
                     console.warn("Async clipboard API not available, using fallback.");
                    fallbackCopyText();
                }
            }
            
            function fallbackCopyText() {
                try {
                    inputText.select();
                    inputText.setSelectionRange(0, 99999); 
                    document.execCommand('copy');
                    showToast(texts[currentLang].toast.copied, 'success');
                    inputText.setSelectionRange(0,0); 
                } catch (err) {
                    console.error("Fallback copy method failed:", err);
                    showToast(texts[currentLang].toast.error, 'warning'); 
                }
            }

            function toggleTheme() {
                const body = document.body;
                body.classList.toggle('light'); 
                const icon = themeToggle.querySelector('i');
                if (body.classList.contains('light')) {
                    icon.className = 'fas fa-moon'; 
                } else {
                    icon.className = 'fas fa-sun'; 
                }
            }
            
            function updateLanguage(lang) {
                currentLang = lang;
                const t = texts[lang];

                document.getElementById('appName').textContent = t.appName;
                currentLangText.textContent = t.langName;
                currentFlag.src = t.flagUrl;
                currentFlag.alt = t.langName;
                document.getElementById('editorTitle').textContent = t.editorTitle;
                document.getElementById('toolsTitle').textContent = t.toolsTitle;
                inputText.placeholder = t.placeholder;
                updateCharCount(); 

                document.querySelectorAll('[data-lang-key]').forEach(el => {
                    const keyParts = el.getAttribute('data-lang-key').split('.');
                    let textValue = t;
                    keyParts.forEach(part => {
                        if (textValue && typeof textValue === 'object') {
                            textValue = textValue[part];
                        } else {
                            textValue = undefined; 
                        }
                    });
                    if (typeof textValue === 'string') {
                        el.textContent = textValue;
                    }
                });
            }

            function showToast(message, type = 'success') {
                const toastEl = document.createElement('div');
                toastEl.className = `toast ${type}`;
                
                const iconEl = document.createElement('i');
                if (type === 'success') {
                    iconEl.className = 'fas fa-check-circle';
                } else if (type === 'warning') {
                    iconEl.className = 'fas fa-exclamation-triangle'; 
                } else { 
                     iconEl.className = 'fas fa-info-circle';
                }
                
                const messageEl = document.createElement('span');
                messageEl.textContent = message;
                
                toastEl.appendChild(iconEl);
                toastEl.appendChild(messageEl);
                toastContainer.appendChild(toastEl);
 
                toastEl.offsetHeight; 
                toastEl.classList.add('show');

                setTimeout(() => {
                    toastEl.classList.remove('show');
                    setTimeout(() => { 
                        toastEl.remove();
                    }, 500); 
                }, 3000);
            }

            function openModal(modalId) {
                const modal = document.getElementById(modalId);
                if (modal) {
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden'; 
                }
            }

            function closeModal(modalId) {
                const modal = document.getElementById(modalId);
                if (modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = ''; 
                }
            }

            function updateActiveToolButtonStates() {
                toolButtons.forEach(btn => btn.classList.remove('active'));

                if (currentType) { 
                    const activeButton = document.querySelector(`.tool-btn[data-type="${currentType}"]`);
                    if (activeButton) activeButton.classList.add('active');
                } else {
                    if (inputText.value === originalText) {
                        const normalButton = document.querySelector('.tool-btn[data-type="normal"]');
                        if (normalButton) normalButton.classList.add('active');
                    }
                }
            }

            // --- Initializations ---
            if (document.body.classList.contains('light')) {
                 themeToggle.querySelector('i').className = 'fas fa-moon';
            } else {
                 themeToggle.querySelector('i').className = 'fas fa-sun';
            }
            updateLanguage(currentLang); 
            updateCharCount();
            updateActiveToolButtonStates(); 
        });
    </script>
</body>
</html>
