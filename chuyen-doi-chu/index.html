<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Đổi Chữ - Sketch OS Pro</title>
    <link rel="icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e2e8f0;
            --primary-text: #111827;
            --secondary-text: #4b5563;
            --border-color: #111827;
            --accent: #f59e0b;
            --accent-dark: #d97706;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f59e0b;
            --info: #3b82f6;
            --border-width: 3px;
            --shadow-offset: 8px;
            --transition-speed: 0.2s;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--primary-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image:
                linear-gradient(rgba(100, 116, 139, 0.2) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(100, 116, 139, 0.2) 1.5px, transparent 1.5px);
            background-size: 25px 25px;
        }
        
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1400px;
            align-items: stretch;
        }
        
        @media (min-width: 1024px) {
            .main-layout {
                grid-template-columns: 3fr 2fr;
            }
        }

        .sketch-window {
            width: 100%;
            display: flex;
            flex-direction: column;
            border: var(--border-width) solid var(--border-color);
            background-color: white;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239ca3af' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .sketch-titlebar {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            border-bottom: var(--border-width) solid var(--border-color);
            background-color: #ffffff;
        }
        
        .titlebar-buttons {
            display: flex;
            gap: 0.5rem;
        }
        
        .titlebar-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            transition: transform var(--transition-speed);
        }
        
        .titlebar-btn:hover {
            transform: scale(1.2);
        }
        
        .titlebar-btn.close {
            background-color: #f87171;
        }
        
        .titlebar-btn.minimize {
            background-color: #fde047;
        }
        
        .titlebar-btn.maximize {
            background-color: #4ade80;
        }
        
        .titlebar-title {
            flex-grow: 1;
            text-align: center;
            font-weight: 800;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .sketch-panel {
            padding: 2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .textarea-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .editor-textarea {
            width: 100%;
            flex-grow: 1;
            padding: 1rem;
            border: var(--border-width) solid var(--border-color);
            background: white;
            color: var(--primary-text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            transition: all var(--transition-speed);
            min-height: 200px;
        }
        
        .editor-textarea:focus {
            outline: none;
            box-shadow: 0 0 0 4px var(--accent);
            transform: translateY(-2px);
        }
        
        .editor-textarea:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .char-count {
            text-align: right;
            font-size: 0.75rem;
            padding-top: 0.5rem;
            color: var(--secondary-text);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .format-indicator {
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sketch-btn {
            background: white;
            border: var(--border-width) solid var(--border-color);
            color: var(--primary-text);
            padding: 12px 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all var(--transition-speed);
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 4px 4px 0px var(--border-color);
            position: relative;
            overflow: hidden;
        }
        
        .sketch-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .sketch-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .sketch-btn:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border-color);
        }
        
        .sketch-btn:active:not(:disabled) {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border-color);
        }
        
        .sketch-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(50%);
        }
        
        .sketch-btn-primary {
            background-color: var(--accent);
            color: white;
        }
        
        .sketch-btn-primary:hover:not(:disabled) {
            background-color: var(--accent-dark);
        }
        
        .sketch-btn-danger {
            background-color: var(--danger);
            color: white;
        }
        
        .sketch-btn-success {
            background-color: var(--success);
            color: white;
        }
        
        .sketch-btn.active {
            background-color: var(--accent);
            color: white;
            box-shadow: inset 4px 4px 0px rgba(0, 0, 0, 0.2);
        }
        
        .sketch-btn.active:hover {
            transform: none;
        }
        
        .editor-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }
        
        @media (min-width: 768px) {
            .editor-actions {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }
        
        @media (max-width: 640px) {
            .tools-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Stats Section */
        .stats-section {
            margin-top: auto;
            padding-top: 1.5rem;
            border-top: var(--border-width) solid var(--border-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        .stat-card {
            background: white;
            border: var(--border-width) solid var(--border-color);
            padding: 1rem 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            transition: all var(--transition-speed);
            box-shadow: 3px 3px 0 var(--border-color);
        }

        .stat-card:hover {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 var(--border-color);
        }

        .stat-label {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary-text);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 900;
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary-text);
        }

        .stat-icon {
            font-size: 1.25rem;
        }

        .stat-card.accent .stat-value {
            color: var(--accent);
        }

        .stat-card.success .stat-value {
            color: var(--success);
        }

        .stat-card.info .stat-value {
            color: var(--info);
        }

        .stat-card.danger .stat-value {
            color: var(--danger);
        }
        
        .modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .modal.open {
            display: flex;
            animation: modalFadeIn 0.3s ease-out;
        }
        
        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            animation: backdropFadeIn 0.3s ease-out;
        }
        
        @keyframes backdropFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .modal-content {
            border: var(--border-width) solid var(--border-color);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
            background: white;
            transform: scale(0.8) translateY(30px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            z-index: 51;
        }
        
        .modal.open .modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--bg);
            margin-bottom: 1.5rem;
        }
        
        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .modal-close {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 300;
            border: var(--border-width) solid var(--border-color);
            background: white;
            cursor: pointer;
            transition: all var(--transition-speed);
            box-shadow: 2px 2px 0 var(--border-color);
        }
        
        .modal-close:hover {
            background: var(--danger);
            color: white;
            transform: rotate(90deg);
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            color: var(--primary-text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-control {
            width: 100%;
            border: var(--border-width) solid var(--border-color);
            padding: 12px 16px;
            font-size: 14px;
            background: white;
            color: var(--primary-text);
            transition: all var(--transition-speed);
            font-family: 'Inter', sans-serif;
        }
        
        .form-control:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent);
        }

        .sketch-footer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }
        
        .footer-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            background-color: white;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 6px 6px 0 var(--border-color);
            color: var(--primary-text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
        }
        
        .footer-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .footer-link:hover::before {
            left: 100%;
        }
        
        .footer-link:hover {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0 var(--border-color);
            color: var(--accent);
        }
        
        .footer-link:active {
            transform: translate(6px, 6px);
            box-shadow: 0 0 0 var(--border-color);
        }
        
        .footer-link .arrow-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border: 2px solid currentColor;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .footer-link:hover .arrow-icon {
            transform: rotate(45deg) scale(1.1);
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        
        .footer-link .arrow-icon i {
            font-size: 10px;
        }

        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: white;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 6px 6px 0 var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 280px;
            max-width: 400px;
            pointer-events: all;
            transform: translateX(450px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 14px;
            font-weight: 600;
        }
        
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        .toast.hide {
            transform: translateX(450px);
            opacity: 0;
        }
        
        .toast-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
            font-size: 14px;
        }
        
        .toast.success {
            border-color: var(--success);
        }
        
        .toast.success .toast-icon {
            background-color: var(--success);
            color: white;
        }
        
        .toast.error {
            border-color: var(--danger);
        }
        
        .toast.error .toast-icon {
            background-color: var(--danger);
            color: white;
        }
        
        .toast.warning {
            border-color: var(--warning);
        }
        
        .toast.warning .toast-icon {
            background-color: var(--warning);
            color: white;
        }
        
        .toast-message {
            flex: 1;
            color: var(--primary-text);
        }

        .loading {
            pointer-events: none;
            opacity: 0.6;
            position: relative;
        }
        
        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border-color);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            transform: translate(-50%, -50%);
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }
            
            .sketch-panel {
                padding: 1.25rem;
            }
            
            .main-layout {
                gap: 1rem;
            }
            
            .sketch-footer {
                bottom: 10px;
                right: 10px;
            }
            
            .footer-link {
                padding: 12px 18px;
                font-size: 11px;
            }
            
            #toastContainer {
                right: 10px;
                top: 10px;
                left: 10px;
            }
            
            .toast {
                min-width: auto;
                max-width: 100%;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <!-- Editor Panel -->
        <div class="sketch-window">
            <header class="sketch-titlebar">
                <div class="titlebar-buttons">
                    <div class="titlebar-btn close"></div>
                    <div class="titlebar-btn minimize"></div>
                    <div class="titlebar-btn maximize"></div>
                </div>
                <div class="titlebar-title">Trình soạn thảo</div>
            </header>
            <main class="sketch-panel">
                <div class="textarea-wrapper">
                    <textarea 
                        class="editor-textarea" 
                        id="inputText" 
                        placeholder="Nhập hoặc dán văn bản của bạn vào đây..."
                        spellcheck="false"
                    ></textarea>
                    <div class="char-count">
                        <span class="format-indicator" id="formatIndicator">
                            <i class="fas fa-font"></i>
                            <span id="formatText">Chưa định dạng</span>
                        </span>
                        <span id="charCount">0 ký tự</span>
                    </div>
                </div>
                <div class="editor-actions">
                    <button class="sketch-btn sketch-btn-primary" id="copyBtn">
                        <i class="far fa-copy"></i>
                        <span>Sao chép</span>
                    </button>
                    <button class="sketch-btn" id="resetBtn">
                        <i class="fas fa-undo"></i>
                        <span>Khôi phục</span>
                    </button>
                    <button class="sketch-btn" id="lockBtn" title="Khóa/Mở khóa định dạng">
                        <i class="fas fa-lock-open"></i>
                        <span>Khóa</span>
                    </button>
                    <button class="sketch-btn sketch-btn-danger" id="clearBtn">
                        <i class="far fa-trash-alt"></i>
                        <span>Xóa</span>
                    </button>
                </div>
            </main>
        </div>

        <!-- Tools Panel -->
        <div class="sketch-window">
            <header class="sketch-titlebar">
                <div class="titlebar-buttons">
                    <div class="titlebar-btn close"></div>
                    <div class="titlebar-btn minimize"></div>
                    <div class="titlebar-btn maximize"></div>
                </div>
                <div class="titlebar-title">Công cụ</div>
            </header>
            <main class="sketch-panel">
                <div class="tools-grid">
                    <button class="sketch-btn tool-btn" data-type="uppercase" data-label="CHỮ HOA">
                        <i class="fas fa-arrow-up"></i>
                        <span>CHỮ HOA</span>
                    </button>
                    <button class="sketch-btn tool-btn" data-type="lowercase" data-label="chữ thường">
                        <i class="fas fa-arrow-down"></i>
                        <span>chữ thường</span>
                    </button>
                    <button class="sketch-btn tool-btn" data-type="capitalizeWords" data-label="Viết Hoa Đầu Từ">
                        <i class="fas fa-heading"></i>
                        <span>Viết Hoa Đầu Từ</span>
                    </button>
                    <button class="sketch-btn tool-btn" data-type="capitalizeSentences" data-label="Viết hoa câu">
                        <i class="fas fa-paragraph"></i>
                        <span>Viết hoa câu</span>
                    </button>
                    <button class="sketch-btn tool-btn" data-type="toggleCase" data-label="cHữ XeN kẼ">
                        <i class="fas fa-random"></i>
                        <span>cHữ XeN kẼ</span>
                    </button>
                    <button class="sketch-btn tool-btn" data-type="slug" data-label="Slug URL">
                        <i class="fas fa-link"></i>
                        <span>Slug URL</span>
                    </button>
                    <button class="sketch-btn tool-btn" data-type="removeAccents" data-label="Xóa dấu">
                        <i class="fas fa-eraser"></i>
                        <span>Xóa dấu</span>
                    </button>
                    <button class="sketch-btn tool-btn" data-type="normal" data-label="Bình thường">
                        <i class="fas fa-font"></i>
                        <span>Bình thường</span>
                    </button>
                </div>

                <!-- Stats Section -->
                <div class="stats-section">
                    <div class="stats-grid">
                        <div class="stat-card accent">
                            <div class="stat-icon">📝</div>
                            <div class="stat-value" id="wordCount">0</div>
                            <div class="stat-label">Từ</div>
                        </div>
                        <div class="stat-card success">
                            <div class="stat-icon">📄</div>
                            <div class="stat-value" id="lineCount">0</div>
                            <div class="stat-label">Dòng</div>
                        </div>
                        <div class="stat-card info">
                            <div class="stat-icon">⏱️</div>
                            <div class="stat-value" id="readTime">0p</div>
                            <div class="stat-label">Đọc</div>
                        </div>
                        <div class="stat-card danger">
                            <div class="stat-icon">🎯</div>
                            <div class="stat-value" id="sentenceCount">0</div>
                            <div class="stat-label">Câu</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div id="toastContainer"></div>
    
    <!-- Contact Modal -->
    <div id="contactModal" class="modal">
        <div class="modal-backdrop" onclick="closeModal('contactModal')"></div>
        <div class="modal-content relative m-4 w-full max-w-md p-7">
            <div class="modal-header">
                <h2>Liên hệ</h2>
                <button class="modal-close" onclick="closeModal('contactModal')">&times;</button>
            </div>
            <div class="modal-body">
                <p class="mb-4 text-sm text-secondary-text">Vui lòng điền vào biểu mẫu dưới đây để liên hệ với chúng tôi.</p>
                <form id="contactForm" class="space-y-4">
                    <div>
                        <label for="name" class="form-label">Họ và tên</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    <div>
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div>
                        <label for="subject" class="form-label">Chủ đề</label>
                        <input type="text" id="subject" name="subject" class="form-control" required>
                    </div>
                    <div>
                        <label for="message" class="form-label">Nội dung</label>
                        <textarea id="message" name="message" class="form-control" required rows="4"></textarea>
                    </div>
                    <button type="submit" class="sketch-btn sketch-btn-primary w-full">
                        <i class="fas fa-paper-plane"></i>
                        <span>Gửi tin nhắn</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="sketch-footer">
        <a href="https://ducmanh.blog" target="_blank" rel="noopener noreferrer" class="footer-link">
            <span>Thiết kế bởi</span>
            <strong>DUCMANH</strong>
            <span class="arrow-icon">
                <i class="fas fa-arrow-right"></i>
            </span>
        </a>
    </footer>
    
    <script>
        // Text Converter Application
        class TextConverter {
            constructor() {
                this.initElements();
                this.initState();
                this.initEventListeners();
                this.updateUI();
            }

            initElements() {
                this.inputText = document.getElementById('inputText');
                this.charCount = document.getElementById('charCount');
                this.formatIndicator = document.getElementById('formatIndicator');
                this.formatText = document.getElementById('formatText');
                this.copyBtn = document.getElementById('copyBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.lockBtn = document.getElementById('lockBtn');
                this.toolButtons = document.querySelectorAll('.tool-btn');
                this.contactForm = document.getElementById('contactForm');
                
                // Stats elements
                this.wordCount = document.getElementById('wordCount');
                this.lineCount = document.getElementById('lineCount');
                this.readTime = document.getElementById('readTime');
                this.sentenceCount = document.getElementById('sentenceCount');
            }

            initState() {
                this.currentType = null;
                this.originalText = '';
                this.isFormatLocked = false;
            }

            initEventListeners() {
                this.inputText.addEventListener('input', () => this.handleInput());
                this.inputText.addEventListener('paste', () => setTimeout(() => this.handlePaste(), 0));
                this.copyBtn.addEventListener('click', () => this.copyText());
                this.clearBtn.addEventListener('click', () => this.clearText());
                this.resetBtn.addEventListener('click', () => this.resetText());
                this.lockBtn.addEventListener('click', () => this.toggleLock());
                this.toolButtons.forEach(btn => {
                    btn.addEventListener('click', (e) => this.handleToolClick(e.currentTarget));
                });
                this.contactForm.addEventListener('submit', (e) => this.handleContactSubmit(e));
                document.addEventListener('keydown', (e) => this.handleKeyboard(e));
            }

            handleInput() {
                if (this.isFormatLocked && this.currentType && this.currentType !== 'normal') {
                    this.convertText(this.currentType, false);
                } else if (!this.isFormatLocked) {
                    this.currentType = null;
                    this.originalText = this.inputText.value;
                }
                this.updateUI();
            }

            handlePaste() {
                if (this.isFormatLocked && this.currentType && this.currentType !== 'normal') {
                    this.convertText(this.currentType, false);
                } else {
                    this.originalText = this.inputText.value;
                    if (!this.isFormatLocked) {
                        this.currentType = null;
                    }
                }
                this.updateUI();
            }

            handleToolClick(button) {
                const type = button.getAttribute('data-type');
                const label = button.getAttribute('data-label');

                if (button.classList.contains('active') && type !== 'normal') {
                    this.inputText.value = this.originalText;
                    this.currentType = null;
                    this.showToast('Đã khôi phục văn bản gốc!', 'success');
                } else if (type === 'normal') {
                    if (this.inputText.value !== this.originalText) {
                        this.inputText.value = this.originalText;
                        this.showToast('Đã khôi phục văn bản gốc!', 'success');
                    }
                    this.currentType = 'normal';
                } else {
                    this.convertText(type, true, label);
                    this.currentType = type;
                }

                this.updateUI();
            }

            convertText(type, showToast = true, label = '') {
                if (!this.inputText.value) {
                    if (showToast) this.showToast('Không có văn bản để chuyển đổi!', 'warning');
                    return;
                }

                if ((this.currentType === null || this.currentType === 'normal') && !this.isFormatLocked) {
                    this.originalText = this.inputText.value;
                }

                const textBefore = this.inputText.value;
                let text = this.inputText.value;

                try {
                    switch(type) {
                        case 'uppercase':
                            text = text.toLocaleUpperCase('vi-VN');
                            break;
                        case 'lowercase':
                            text = text.toLocaleLowerCase('vi-VN');
                            break;
                        case 'capitalizeWords':
                            text = text.normalize('NFC')
                                .toLocaleLowerCase('vi-VN')
                                .split(/(\s+)/)
                                .map(w => w.match(/\s+/) ? w : (w.length > 0 ? w.charAt(0).toLocaleUpperCase('vi-VN') + w.slice(1) : ''))
                                .join('');
                            break;
                        case 'capitalizeSentences':
                            text = text.normalize('NFC')
                                .toLocaleLowerCase('vi-VN')
                                .replace(/(^\s*\p{L}|[.!?]\s*\p{L})/gu, c => c.toLocaleUpperCase('vi-VN'));
                            break;
                        case 'toggleCase':
                            text = [...text].map(char => {
                                const upper = char.toLocaleUpperCase('vi-VN');
                                const lower = char.toLocaleLowerCase('vi-VN');
                                if (char === upper && char !== lower) return lower;
                                if (char === lower && char !== upper) return upper;
                                return char;
                            }).join('');
                            break;
                        case 'slug':
                            text = text.toLocaleLowerCase('vi-VN')
                                .normalize('NFD')
                                .replace(/[\u0300-\u036f]/g, '')
                                .replace(/đ/g, 'd')
                                .replace(/[^a-z0-9\s-]/g, '')
                                .trim()
                                .replace(/\s+/g, '-')
                                .replace(/-+/g, '-');
                            break;
                        case 'removeAccents':
                            text = text.normalize('NFD')
                                .replace(/[\u0300-\u036f]/g, '')
                                .replace(/đ/g, 'd')
                                .replace(/Đ/g, 'D');
                            break;
                    }

                    this.inputText.value = text;
                    
                    if (showToast && textBefore !== text) {
                        this.showToast(`Đã chuyển đổi: ${label}`, 'success');
                    }
                } catch (error) {
                    console.error('Lỗi chuyển đổi:', error);
                    if (showToast) this.showToast('Lỗi khi chuyển đổi văn bản!', 'error');
                    this.inputText.value = textBefore;
                }
            }

            copyText() {
                if (!this.inputText.value) {
                    this.showToast('Không có văn bản để sao chép!', 'warning');
                    return;
                }

                navigator.clipboard.writeText(this.inputText.value)
                    .then(() => {
                        this.showToast('Đã sao chép vào clipboard!', 'success');
                        this.copyBtn.classList.add('sketch-btn-success');
                        setTimeout(() => {
                            this.copyBtn.classList.remove('sketch-btn-success');
                        }, 2000);
                    })
                    .catch(() => this.fallbackCopyText());
            }

            fallbackCopyText() {
                try {
                    this.inputText.select();
                    document.execCommand('copy');
                    this.showToast('Đã sao chép vào clipboard!', 'success');
                    window.getSelection().removeAllRanges();
                } catch (err) {
                    this.showToast('Lỗi khi sao chép!', 'error');
                }
            }

            clearText() {
                if (!this.inputText.value) {
                    this.showToast('Không có văn bản để xóa!', 'warning');
                    return;
                }

                this.inputText.value = '';
                if (!this.isFormatLocked) {
                    this.originalText = '';
                    this.currentType = null;
                }
                this.updateUI();
                this.showToast('Đã xóa văn bản!', 'success');
            }

            resetText() {
                const textBefore = this.inputText.value;
                
                if (textBefore === this.originalText && textBefore === '') {
                    this.showToast('Không có gì để khôi phục!', 'warning');
                    return;
                }

                if (textBefore !== this.originalText) {
                    this.inputText.value = this.originalText;
                    this.showToast('Đã khôi phục văn bản gốc!', 'success');
                }

                if (this.isFormatLocked) {
                    this.toggleLock();
                }

                this.currentType = null;
                this.updateUI();
            }

            toggleLock() {
                this.isFormatLocked = !this.isFormatLocked;
                
                const icon = this.lockBtn.querySelector('i');
                const text = this.lockBtn.querySelector('span');
                
                if (this.isFormatLocked) {
                    this.lockBtn.classList.add('active');
                    icon.className = 'fas fa-lock';
                    text.textContent = 'Mở khóa';
                    this.showToast('Đã khóa định dạng!', 'success');
                } else {
                    this.lockBtn.classList.remove('active');
                    icon.className = 'fas fa-lock-open';
                    text.textContent = 'Khóa';
                    this.showToast('Đã mở khóa định dạng!', 'success');
                }
            }

            updateStats() {
                const text = this.inputText.value;
                
                // Word count
                const words = text.trim().split(/\s+/).filter(w => w.length > 0);
                this.wordCount.textContent = words.length;
                
                // Line count
                const lines = text.split('\n').length;
                this.lineCount.textContent = lines;
                
                // Reading time (average 200 words per minute)
                const minutes = Math.ceil(words.length / 200);
                this.readTime.textContent = `${minutes}p`;
                
                // Sentence count
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
                this.sentenceCount.textContent = sentences.length;
            }

            updateUI() {
                const count = this.inputText.value.length;
                this.charCount.textContent = `${count.toLocaleString('vi-VN')} ký tự`;
                this.updateStats();

                if (this.currentType && this.currentType !== 'normal') {
                    const activeBtn = document.querySelector(`.tool-btn[data-type="${this.currentType}"]`);
                    const label = activeBtn ? activeBtn.getAttribute('data-label') : 'Đã định dạng';
                    this.formatText.textContent = label;
                    this.formatIndicator.style.display = 'flex';
                } else {
                    this.formatText.textContent = 'Chưa định dạng';
                }

                this.toolButtons.forEach(btn => {
                    const type = btn.getAttribute('data-type');
                    if (type === this.currentType) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });

                const hasText = this.inputText.value.length > 0;
                this.copyBtn.disabled = !hasText;
                this.clearBtn.disabled = !hasText;
                this.resetBtn.disabled = !hasText && !this.currentType;
            }

            handleKeyboard(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    this.clearText();
                }
                
                if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
                    e.preventDefault();
                    this.resetText();
                }
                
                if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
                    e.preventDefault();
                    this.toggleLock();
                }
            }

            handleContactSubmit(e) {
                e.preventDefault();
                
                const submitBtn = this.contactForm.querySelector('button[type="submit"]');
                submitBtn.classList.add('loading');
                
                setTimeout(() => {
                    submitBtn.classList.remove('loading');
                    this.showToast('Tin nhắn đã được gửi thành công!', 'success');
                    closeModal('contactModal');
                    this.contactForm.reset();
                }, 1500);
            }

            showToast(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                
                const iconClass = type === 'success' ? 'fa-check-circle' : 
                                 type === 'error' ? 'fa-times-circle' : 
                                 'fa-exclamation-circle';
                
                toast.innerHTML = `
                    <div class="toast-icon">
                        <i class="fas ${iconClass}"></i>
                    </div>
                    <div class="toast-message">${message}</div>
                `;
                
                container.appendChild(toast);
                
                setTimeout(() => toast.classList.add('show'), 10);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                    toast.classList.add('hide');
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }
        }

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('open');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('open');
                document.body.style.overflow = '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new TextConverter();
        });
    </script>
</body>
</html>
