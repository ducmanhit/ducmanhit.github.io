<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f4f4">
    <title>Chuyển Đổi Tiền Tệ — Square</title>
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.11.0/css/flag-icons.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --page: #f3f3f3;
            --surface: #ffffff;
            --surface-soft: #f7f7f7;
            --ink: #0a0a0a;
            --muted: #686868;
            --line: #d7d7d7;
            --line-strong: #161616;
            --danger: #b42318;
            --radius: 0;
            --shadow: 0 20px 55px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html {
            font-family: "Inter", sans-serif;
            color-scheme: light;
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            background: var(--page);
            color: var(--ink);
            font-family: "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input {
            font: inherit;
        }

        button,
        a,
        .custom-select-trigger,
        .custom-option {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        .custom-select-trigger:focus-visible {
            outline: 3px solid rgba(0, 0, 0, 0.16);
            outline-offset: 2px;
        }

        .page {
            width: min(1120px, calc(100% - 48px));
            margin: 0 auto;
            padding: 32px 0 52px;
        }

        .topbar {
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 28px;
        }

        .home-link {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
            border: 1px solid var(--line-strong);
            border-radius: 0;
            color: var(--ink);
            background: var(--surface);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 160ms ease, color 160ms ease, transform 160ms ease;
        }

        .home-link:hover {
            color: #fff;
            background: #111;
            transform: translateY(-1px);
        }

        .brand-mark {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .intro {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(260px, 420px);
            align-items: end;
            gap: 28px;
            margin-bottom: 28px;
        }

        .eyebrow {
            margin: 0 0 10px;
            font-size: 12px;
            line-height: 1.4;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        h1 {
            margin: 0;
            max-width: 760px;
            font-size: clamp(34px, 5vw, 58px);
            line-height: 1.02;
            letter-spacing: -0.055em;
            font-weight: 700;
        }

        .intro-copy {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        .converter {
            position: relative;
            overflow: visible;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .converter-head {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--line-strong);
        }

        .converter-title {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .converter-icon {
            width: 38px;
            height: 38px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border: 1px solid var(--line-strong);
            border-radius: 0;
            background: #16a34a;
            color: #fff;
        }

        .converter-title h2 {
            margin: 0;
            font-size: 17px;
            line-height: 1.3;
            font-weight: 700;
        }

        .converter-title span {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.3;
        }

        .utility-btn {
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 0;
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: border-color 160ms ease, background-color 160ms ease;
        }

        .utility-btn:hover {
            border-color: var(--line-strong);
            background: var(--surface-soft);
        }

        .utility-btn svg {
            color: #2563eb;
        }

        .converter-body {
            padding: 28px;
        }

        .field-label {
            display: block;
            margin-bottom: 9px;
            color: #333;
            font-size: 11px;
            line-height: 1.4;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .currency-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 52px minmax(0, 1fr);
            gap: 14px;
            align-items: end;
        }

        .field {
            min-width: 0;
        }

        .custom-select-wrapper {
            position: relative;
            user-select: none;
        }

        .custom-select-trigger {
            width: 100%;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 0;
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
        }

        .custom-select-trigger:hover {
            border-color: #8c8c8c;
            background: #fcfcfc;
        }

        .custom-select-trigger.open {
            border-color: var(--line-strong);
            border-radius: 0;
            box-shadow: 0 0 0 1px var(--line-strong);
        }

        .currency-value {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .currency-text {
            min-width: 0;
        }

        .currency-code {
            display: block;
            font-size: 14px;
            line-height: 1.3;
            font-weight: 700;
        }

        .currency-name {
            display: block;
            max-width: 100%;
            margin-top: 2px;
            overflow: hidden;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.3;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fi {
            width: 25px;
            height: 18px;
            flex: 0 0 auto;
            border: 1px solid #cfcfcf;
            border-radius: 0;
            filter: none;
            box-shadow: none;
        }

        .custom-options {
            position: absolute;
            z-index: 60;
            top: calc(100% - 1px);
            left: 0;
            right: 0;
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid var(--line-strong);
            border-top: 0;
            border-radius: 0;
            background: var(--surface);
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.13);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-5px);
            transition: opacity 130ms ease, transform 130ms ease, visibility 130ms ease;
        }

        .custom-select-wrapper.open .custom-options {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
        }

        .custom-option {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 13px;
            border-bottom: 1px solid #ededed;
            background: #fff;
            color: #111;
            cursor: pointer;
            transition: background-color 130ms ease, color 130ms ease;
        }

        .custom-option:last-child {
            border-bottom: 0;
        }

        .custom-option:hover {
            background: #f2f2f2;
        }

        .custom-option.selected {
            background: #111;
            color: #fff;
        }

        .custom-option.selected .option-name {
            color: #cfcfcf;
        }

        .option-main {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-code {
            font-size: 13px;
            font-weight: 700;
        }

        .option-name {
            max-width: 180px;
            overflow: hidden;
            color: var(--muted);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .custom-options::-webkit-scrollbar {
            width: 8px;
        }

        .custom-options::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .custom-options::-webkit-scrollbar-thumb {
            border: 2px solid #f1f1f1;
            border-radius: 0;
            background: #888;
        }

        .swap-wrap {
            display: flex;
            justify-content: center;
            padding-bottom: 3px;
        }

        .swap-btn {
            width: 52px;
            height: 58px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line-strong);
            border-radius: 0;
            background: #111;
            color: #fff;
            cursor: pointer;
            transition: transform 170ms ease, background-color 170ms ease;
        }

        .swap-btn:hover {
            background: #2a2a2a;
            transform: translateY(-1px);
        }

        .swap-btn:active {
            transform: scale(0.96);
        }

        .amount-block {
            margin-top: 22px;
        }

        .amount-input {
            width: 100%;
            height: 66px;
            padding: 0 17px;
            border: 1px solid var(--line);
            border-radius: 0;
            background: #fff;
            color: var(--ink);
            font-size: clamp(21px, 3vw, 27px);
            font-weight: 700;
            letter-spacing: -0.025em;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        .amount-input::placeholder {
            color: #a1a1a1;
            font-weight: 500;
        }

        .amount-input:focus {
            border-color: var(--line-strong);
            outline: none;
            box-shadow: 0 0 0 1px var(--line-strong);
        }

        .amount-input::-webkit-outer-spin-button,
        .amount-input::-webkit-inner-spin-button {
            margin: 0;
            appearance: none;
        }

        .result-panel {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: stretch;
            gap: 22px;
            margin-top: 22px;
            padding: 24px;
            border: 1px solid #111;
            border-radius: 0;
            background: #111;
            color: #fff;
        }

        .result-main {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .result-kicker {
            margin-bottom: 10px;
            color: #a8a8a8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .final-result {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 9px;
            min-width: 0;
            font-size: clamp(34px, 6vw, 60px);
            line-height: 1.06;
            font-weight: 700;
            letter-spacing: -0.05em;
            overflow-wrap: anywhere;
        }

        .result-currency {
            color: #a9a9a9;
            font-size: 0.46em;
            letter-spacing: 0;
            font-weight: 600;
        }

        .result-subtext {
            margin-top: 9px;
            color: #aaa;
            font-size: 13px;
            font-weight: 500;
        }

        .rate-side {
            min-width: 220px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: space-between;
            gap: 12px;
            padding-left: 22px;
            border-left: 1px solid #3d3d3d;
        }

        .copy-btn {
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 13px;
            border: 1px solid #707070;
            border-radius: 0;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
        }

        .copy-btn:hover {
            border-color: #fff;
            background: #fff;
            color: #111;
        }

        .rate-box {
            padding: 13px;
            border: 1px solid #3d3d3d;
            border-radius: 0;
            background: #191919;
            text-align: left;
        }

        .rate-one-unit {
            color: #fff;
            font-size: 13px;
            line-height: 1.5;
            font-weight: 600;
        }

        .rate-date {
            margin-top: 3px;
            color: #949494;
            font-size: 11px;
            line-height: 1.4;
        }

        .converter-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        .note {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .clear-btn {
            min-height: 40px;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 0;
            background: #fff;
            color: #3e3e3e;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: color 160ms ease, border-color 160ms ease, background-color 160ms ease;
        }

        .clear-btn:hover {
            border-color: var(--danger);
            background: #fffafa;
            color: var(--danger);
        }

        .loading-overlay {
            position: absolute;
            z-index: 80;
            inset: 0;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(3px);
        }

        .loading-overlay.hidden {
            display: none;
        }

        .loader {
            width: 32px;
            height: 32px;
            border: 3px solid #d1d1d1;
            border-top-color: #111;
            border-radius: 50%;
            animation: spin 700ms linear infinite;
        }

        .toast {
            position: fixed;
            z-index: 100;
            top: 20px;
            right: 20px;
            min-height: 46px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid #111;
            border-radius: 0;
            background: #111;
            color: #fff;
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.18);
            transform: translateX(calc(100% + 32px));
            opacity: 0;
            transition: transform 220ms ease, opacity 220ms ease;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast > svg {
            color: #22c55e;
        }

        .toast span {
            font-size: 13px;
            font-weight: 600;
        }

        .error-result {
            color: #fff;
            font-size: 22px;
            letter-spacing: -0.02em;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 820px) {
            .page {
                width: min(100% - 32px, 720px);
                padding-top: 22px;
            }

            .topbar {
                padding-bottom: 24px;
            }

            .intro {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .intro-copy {
                max-width: 620px;
            }

            .converter-body {
                padding: 22px;
            }

            .currency-row {
                grid-template-columns: 1fr;
                gap: 13px;
            }

            .swap-wrap {
                padding: 0;
            }

            .swap-btn {
                width: 100%;
                height: 46px;
            }

            .swap-btn svg {
                transform: rotate(90deg);
            }

            .result-panel {
                grid-template-columns: 1fr;
            }

            .rate-side {
                min-width: 0;
                padding: 18px 0 0;
                border-top: 1px solid #3d3d3d;
                border-left: 0;
            }
        }

        @media (max-width: 560px) {
            .page {
                width: calc(100% - 24px);
                padding: 14px 0 28px;
            }

            .topbar {
                min-height: 44px;
                padding-bottom: 20px;
            }

            .brand-mark {
                display: none;
            }

            .home-link {
                min-height: 40px;
            }

            h1 {
                font-size: 37px;
            }

            .intro {
                margin-bottom: 20px;
            }

            .intro-copy {
                font-size: 14px;
            }

            .converter-head {
                min-height: auto;
                align-items: flex-start;
                padding: 14px;
            }

            .converter-icon {
                width: 36px;
                height: 36px;
            }

            .converter-title span {
                display: none;
            }

            .utility-btn {
                width: 40px;
                min-width: 40px;
                padding: 0;
            }

            .utility-btn .btn-label {
                display: none;
            }

            .converter-body {
                padding: 16px;
            }

            .custom-select-trigger {
                min-height: 56px;
            }

            .amount-input {
                height: 60px;
            }

            .result-panel {
                gap: 18px;
                padding: 19px;
            }

            .final-result {
                font-size: clamp(34px, 11.5vw, 48px);
            }

            .converter-foot {
                align-items: stretch;
                flex-direction: column;
            }

            .clear-btn {
                width: 100%;
            }

            .toast {
                top: 12px;
                right: 12px;
                left: 12px;
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    

        /* SEARCH INSIDE CURRENCY DROPDOWNS */
        .custom-options {
            overflow: hidden !important;
        }

        .currency-search-wrap {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            padding: 9px;
            border-bottom: 1px solid var(--line);
            background: #fff;
        }

        .currency-search-icon {
            position: absolute;
            left: 20px;
            width: 16px;
            height: 16px;
            color: #737373;
            pointer-events: none;
        }

        .currency-search-input {
            width: 100%;
            height: 40px;
            padding: 0 38px 0 34px;
            border: 1px solid #bdbdbd;
            border-radius: 0;
            outline: none;
            background: #fff;
            color: #111;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            transition: border-color 140ms ease, box-shadow 140ms ease;
        }

        .currency-search-input::placeholder {
            color: #8b8b8b;
        }

        .currency-search-input:focus {
            border-color: #111;
            box-shadow: inset 0 0 0 1px #111;
        }

        .currency-search-input::-webkit-search-cancel-button {
            display: none;
        }

        .currency-search-clear {
            position: absolute;
            right: 13px;
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: #666;
            cursor: pointer;
        }

        .currency-search-clear:hover {
            background: #ededed;
            color: #111;
        }

        .currency-search-clear.hidden {
            display: none;
        }

        .currency-options-list {
            max-height: min(270px, calc(100dvh - 260px));
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
        }

        .currency-options-list::-webkit-scrollbar {
            width: 8px;
        }

        .currency-options-list::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .currency-options-list::-webkit-scrollbar-thumb {
            border: 2px solid #f1f1f1;
            border-radius: 0;
            background: #888;
        }

        .currency-empty {
            min-height: 74px;
            display: grid;
            place-items: center;
            padding: 16px;
            color: #777;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
        }

        @media (max-width: 680px) {
            .currency-search-wrap {
                padding: 8px;
            }

            .currency-search-icon {
                left: 18px;
            }

            .currency-search-input {
                height: 38px;
                font-size: 12px;
            }

            .currency-options-list {
                max-height: min(220px, 34dvh);
            }
        }

    </style>

    <style>
        /* Compact one-screen layout */
        body {
            min-height: 100dvh;
        }

        .page {
            width: min(1080px, calc(100% - 32px));
            padding: clamp(10px, 2vh, 20px) 0;
        }

        .topbar {
            min-height: 38px;
            padding-bottom: 10px;
        }

        .home-link {
            min-height: 36px;
            padding: 0 12px;
            font-size: 13px;
        }

        .brand-mark {
            font-size: 11px;
        }

        .intro {
            grid-template-columns: minmax(0, 1fr) minmax(250px, 390px);
            gap: 20px;
            margin-bottom: 12px;
        }

        .eyebrow {
            margin-bottom: 5px;
            font-size: 10px;
        }

        h1 {
            font-size: clamp(29px, 4.2vw, 44px);
            line-height: 1;
        }

        .intro-copy {
            font-size: 13px;
            line-height: 1.45;
        }

        .converter-head {
            min-height: 52px;
            padding: 8px 14px;
        }

        .converter-icon {
            width: 34px;
            height: 34px;

    <script>
        lucide.createIcons();

        const currencies = [
            { code: 'USD', name: 'Đô la Mỹ', flag: 'us' },
            { code: 'VND', name: 'Việt Nam Đồng', flag: 'vn' },
            { code: 'EUR', name: 'Euro', flag: 'eu' },
            { code: 'JPY', name: 'Yên Nhật', flag: 'jp' },
            { code: 'KRW', name: 'Won Hàn Quốc', flag: 'kr' },
            { code: 'GBP', name: 'Bảng Anh', flag: 'gb' },
            { code: 'CNY', name: 'Nhân dân tệ', flag: 'cn' },
            { code: 'AUD', name: 'Đô la Úc', flag: 'au' },
            { code: 'CAD', name: 'Đô la Canada', flag: 'ca' },
            { code: 'SGD', name: 'Đô la Singapore', flag: 'sg' },
            { code: 'THB', name: 'Baht Thái', flag: 'th' },
            { code: 'RUB', name: 'Rúp Nga', flag: 'ru' },
            { code: 'HKD', name: 'Đô la Hồng Kông', flag: 'hk' },
            { code: 'TWD', name: 'Đài tệ', flag: 'tw' }
        ];

        let currentExchangeRate = 0;
        let toastTimer;

        function getCurrency(code) {
            return currencies.find(currency => currency.code === code) || currencies[0];
        }

        function createTriggerContent(currency) {
            return `
                <span class="currency-value">
                    <span class="fi fi-${currency.flag}"></span>
                    <span class="currency-text">
                        <span class="currency-code">${currency.code}</span>
                        <span class="currency-name">${currency.name}</span>
                    </span>
                </span>
                <i data-lucide="chevron-down" width="17" height="17" aria-hidden="true"></i>
            `;
        }

        function initDropdowns() {
            renderOptions('from');
            renderOptions('to');

            document.addEventListener('click', event => {
                if (!event.target.closest('.custom-select-wrapper')) {
                    closeAllDropdowns();
                }
            });

            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') closeAllDropdowns();
            });
        }

        function normalizeCurrencySearch(value) {
            return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd')
                .replace(/Đ/g, 'D')
                .toLowerCase()
                .trim();
        }

        function renderOptions(type) {
            const container = document.getElementById(`${type}-options`);
            const currentValue = document.getElementById(`${type}-value`).value;

            container.innerHTML = `
                <div class="currency-search-wrap">
                    <i data-lucide="search" class="currency-search-icon" aria-hidden="true"></i>
                    <input
                        type="search"
                        id="${type}-search"
                        class="currency-search-input"
                        placeholder="Tìm USD, VND hoặc tên tiền tệ"
                        autocomplete="off"
                        autocapitalize="characters"
                        spellcheck="false"
                        inputmode="search"
                        aria-label="Tìm kiếm tiền tệ"
                    >
                    <button type="button" class="currency-search-clear hidden" aria-label="Xóa tìm kiếm">
                        <i data-lucide="x" width="15" height="15" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="currency-options-list" id="${type}-options-list"></div>
            `;

            const input = container.querySelector('.currency-search-input');
            const clearButton = container.querySelector('.currency-search-clear');
            const list = container.querySelector('.currency-options-list');

            const updateFilteredOptions = () => {
                const query = normalizeCurrencySearch(input.value);
                const filteredCurrencies = currencies.filter(currency => {
                    const searchText = normalizeCurrencySearch(`${currency.code} ${currency.name}`);
                    return searchText.includes(query);
                });

                list.innerHTML = '';

                if (!filteredCurrencies.length) {
                    list.innerHTML = '<div class="currency-empty">Không tìm thấy loại tiền tệ phù hợp</div>';
                } else {
                    filteredCurrencies.forEach(currency => {
                        const option = document.createElement('div');
                        const selected = currency.code === currentValue;
                        option.className = `custom-option${selected ? ' selected' : ''}`;
                        option.setAttribute('role', 'option');
                        option.setAttribute('aria-selected', String(selected));
                        option.dataset.currencyCode = currency.code;
                        option.innerHTML = `
                            <span class="option-main">
                                <span class="fi fi-${currency.flag}"></span>
                                <span class="option-code">${currency.code}</span>
                            </span>
                            <span class="option-name">${currency.name}</span>
                        `;
                        option.onclick = () => selectOption(type, currency.code);
                        list.appendChild(option);
                    });
                }

                clearButton.classList.toggle('hidden', input.value.length === 0);
            };

            input.addEventListener('input', updateFilteredOptions);
            input.addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    const firstOption = list.querySelector('.custom-option');
                    if (firstOption) {
                        event.preventDefault();
                        firstOption.click();
                    }
                }
            });

            clearButton.addEventListener('click', event => {
                event.stopPropagation();
                input.value = '';
                updateFilteredOptions();
                input.focus();
            });

            updateFilteredOptions();
            lucide.createIcons();
        }

        function toggleDropdown(type) {
            const wrapper = document.getElementById(`${type}-wrapper`);
            const trigger = wrapper.querySelector('.custom-select-trigger');
            const wasOpen = wrapper.classList.contains('open');

            closeAllDropdowns();

            if (!wasOpen) {
                wrapper.classList.add('open');
                trigger.classList.add('open');
                trigger.setAttribute('aria-expanded', 'true');

                const searchInput = wrapper.querySelector('.currency-search-input');
                if (searchInput) {
                    searchInput.value = '';
                    searchInput.dispatchEvent(new Event('input'));
                    window.setTimeout(() => searchInput.focus(), 0);
                }
            }
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.custom-select-wrapper').forEach(wrapper => wrapper.classList.remove('open'));
            document.querySelectorAll('.custom-select-trigger').forEach(trigger => {
                trigger.classList.remove('open');
                trigger.setAttribute('aria-expanded', 'false');
            });
        }

        function selectOption(type, code) {
            const currency = getCurrency(code);
            document.getElementById(`${type}-value`).value = currency.code;
            document.querySelector(`#${type}-wrapper .custom-select-trigger`).innerHTML = createTriggerContent(currency);
            lucide.createIcons();
            renderOptions(type);
            closeAllDropdowns();
            updateRate();
        }

        async function updateRate() {
            const from = document.getElementById('from-value').value;
            const to = document.getElementById('to-value').value;
            const loadingOverlay = document.getElementById('loading-overlay');

            loadingOverlay.classList.remove('hidden');

            if (from === to) {
                currentExchangeRate = 1;
                updateRateInfo(from, to, 1, new Date());
                calculate();
                loadingOverlay.classList.add('hidden');
                return;
            }

            try {
                const url = `https://hexarate.paikama.co/api/rates/latest/${from}?target=${to}`;
                const response = await fetch(url);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const json = await response.json();
                if (json.status_code !== 200 || !json.data || typeof json.data.mid !== 'number') {
                    throw new Error('Invalid API response');
                }

                currentExchangeRate = json.data.mid;
                updateRateInfo(from, to, currentExchangeRate, json.data.timestamp ? new Date(json.data.timestamp) : new Date());
                calculate();
            } catch (error) {
                console.error(error);
                document.getElementById('final-result').innerHTML = '<span class="error-result">Không thể tải tỷ giá</span>';
                document.getElementById('result-subtext').textContent = 'Vui lòng kiểm tra kết nối và thử cập nhật lại.';
                document.getElementById('rate-one-unit').textContent = 'Chưa có dữ liệu';
                document.getElementById('rate-date').textContent = '—';
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        }

        function updateRateInfo(from, to, rate, date) {
            const precision = rate < 0.01 ? 6 : rate < 1 ? 4 : 2;
            const formattedRate = new Intl.NumberFormat('vi-VN', {
                maximumFractionDigits: precision
            }).format(rate);

            document.getElementById('rate-one-unit').textContent = `1 ${from} = ${formattedRate} ${to}`;
            document.getElementById('rate-date').textContent = `Cập nhật: ${new Intl.DateTimeFormat('vi-VN', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            }).format(date)}`;
        }

        const currencyWordNames = {
            USD: 'đô la Mỹ',
            VND: 'đồng',
            EUR: 'euro',
            JPY: 'yên Nhật',
            KRW: 'won Hàn Quốc',
            GBP: 'bảng Anh',
            CNY: 'nhân dân tệ',
            AUD: 'đô la Úc',
            CAD: 'đô la Canada',
            SGD: 'đô la Singapore',
            THB: 'baht Thái',
            RUB: 'rúp Nga',
            HKD: 'đô la Hồng Kông',
            TWD: 'đài tệ'
        };

        const vietnameseDigits = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];

        function readThreeDigitGroup(value, forceHundreds = false) {
            const hundreds = Math.floor(value / 100);
            const tens = Math.floor((value % 100) / 10);
            const units = value % 10;
            const words = [];

            if (hundreds > 0 || forceHundreds) {
                words.push(`${vietnameseDigits[hundreds]} trăm`);
            }

            if (tens === 0) {
                if (units > 0) {
                    if (hundreds > 0 || forceHundreds) words.push('lẻ');
                    words.push(vietnameseDigits[units]);
                }
            } else if (tens === 1) {
                words.push('mười');
                if (units === 5) words.push('lăm');
                else if (units > 0) words.push(vietnameseDigits[units]);
            } else {
                words.push(`${vietnameseDigits[tens]} mươi`);
                if (units === 1) words.push('mốt');
                else if (units === 5) words.push('lăm');
                else if (units > 0) words.push(vietnameseDigits[units]);
            }

            return words.join(' ');
        }

        function getScaleName(groupIndex) {
            if (groupIndex === 0) return '';

            const position = groupIndex % 3;
            const billionLevel = Math.floor(groupIndex / 3);
            const parts = [];

            if (position === 1) parts.push('nghìn');
            if (position === 2) parts.push('triệu');
            for (let index = 0; index < billionLevel; index += 1) parts.push('tỷ');

            return parts.join(' ');
        }

        function integerToVietnameseWords(integerText) {
            const normalized = integerText.replace(/^0+(?=\d)/, '');
            if (!normalized || /^0+$/.test(normalized)) return 'không';

            const groups = [];
            for (let end = normalized.length; end > 0; end -= 3) {
                groups.push(Number(normalized.slice(Math.max(0, end - 3), end)));
            }

            const words = [];
            const highestNonZeroIndex = groups.reduce((highest, group, index) => group > 0 ? index : highest, 0);

            for (let index = groups.length - 1; index >= 0; index -= 1) {
                const group = groups[index];
                if (group === 0) continue;

                const forceHundreds = index === 0 && highestNonZeroIndex > 0 && group < 100;
                const groupWords = readThreeDigitGroup(group, forceHundreds);
                const scale = getScaleName(index);
                words.push(scale ? `${groupWords} ${scale}` : groupWords);
            }

            return words.join(' ').replace(/\s+/g, ' ').trim();
        }

        function numberToVietnameseCurrencyWords(value, currencyCode, maximumFractionDigits) {
            if (!Number.isFinite(value) || value < 0) return '';

            const fixedValue = value.toFixed(maximumFractionDigits);
            const [integerPart, rawDecimalPart = ''] = fixedValue.split('.');
            const decimalPart = rawDecimalPart.replace(/0+$/, '');
            let words = integerToVietnameseWords(integerPart);

            if (decimalPart) {
                const decimalWords = decimalPart
                    .split('')
                    .map(digit => vietnameseDigits[Number(digit)])
                    .join(' ');
                words += ` phẩy ${decimalWords}`;
            }

            const currencyName = currencyWordNames[currencyCode] || currencyCode;
            const fullText = `${words} ${currencyName}`.replace(/\s+/g, ' ').trim();
            return fullText.charAt(0).toUpperCase() + fullText.slice(1);
        }

        function calculate() {
            const amount = Number.parseFloat(document.getElementById('amount').value);
            const from = document.getElementById('from-value').value;
            const to = document.getElementById('to-value').value;
            const resultElement = document.getElementById('final-result');
            const subtextElement = document.getElementById('result-subtext');

            if (!Number.isFinite(amount) || amount <= 0) {
                resultElement.innerHTML = `0 <span class="result-currency">${to}</span>`;
                subtextElement.textContent = `Nhập số tiền ${from} để bắt đầu quy đổi.`;
                return;
            }

            if (!Number.isFinite(currentExchangeRate) || currentExchangeRate <= 0) {
                resultElement.innerHTML = `... <span class="result-currency">${to}</span>`;
                subtextElement.textContent = 'Đang lấy tỷ giá mới nhất.';
                return;
            }

            const result = amount * currentExchangeRate;
            const maximumFractionDigits = result >= 100 ? 2 : result >= 1 ? 4 : 6;
            const formattedResult = new Intl.NumberFormat('vi-VN', {
                maximumFractionDigits
            }).format(result);
            const resultInWords = numberToVietnameseCurrencyWords(result, to, maximumFractionDigits);

            resultElement.innerHTML = `${formattedResult} <span class="result-currency">${to}</span>`;
            subtextElement.textContent = resultInWords;
        }

        function swapCurrencies() {
            const fromValue = document.getElementById('from-value').value;
            const toValue = document.getElementById('to-value').value;

            document.getElementById('from-value').value = toValue;
            document.getElementById('to-value').value = fromValue;

            document.querySelector('#from-wrapper .custom-select-trigger').innerHTML = createTriggerContent(getCurrency(toValue));
            document.querySelector('#to-wrapper .custom-select-trigger').innerHTML = createTriggerContent(getCurrency(fromValue));

            lucide.createIcons();
            renderOptions('from');
            renderOptions('to');
            closeAllDropdowns();
            updateRate();
        }

        function clearInput() {
            const amountInput = document.getElementById('amount');
            amountInput.value = '';
            calculate();
            amountInput.focus();
        }

        async function copyRate() {
            const from = document.getElementById('from-value').value;
            const to = document.getElementById('to-value').value;
            const text = `1 ${from} = ${currentExchangeRate} ${to}`;

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    textarea.remove();
                }
                showToast('Đã sao chép tỷ giá');
            } catch (error) {
                console.error('Copy failed', error);
                showToast('Không thể sao chép');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        initDropdowns();
        updateRate();
    </script>
</body>
</html>
