=================================================================
TẬP CŨ: 25 CÂU ĐÃ GỬI TRƯỚC ĐÂY
=================================================================

25 CÂU THƠ, CA DAO GIAO DUYÊN NGÀY XƯA
Sưu tầm để đăng ảnh, làm video và dùng dần 🌸

Lưu ý: Đây là tuyển tập ca dao, dị bản truyền miệng và một số câu mang phong cách dân gian.
Không phải tất cả đều đã được xác minh là nguyên văn ca dao cổ.

========================================
I. THẢ THÍNH KHÉO LÉO, ĐẦY Ý TỨ
========================================

01. MẬN HỎI ĐÀO
Bây giờ mận mới hỏi đào,
Vườn hồng đã có ai vào hay chưa?
Mận hỏi thì đào xin thưa,
Vườn hồng có lối nhưng chưa ai vào.

02. CẮT CỎ LÀM QUEN
Cô kia cắt cỏ một mình,
Cho anh cắt với chung tình làm đôi.
Cô còn cắt nữa hay thôi?
Cho anh cắt với làm đôi vợ chồng.

03. MƯỢN MÌNH LÀM MỐI
Đường xa thì thật là xa,
Mượn mình làm mối cho ta một người.
Một người mười tám đôi mươi,
Một người vừa đẹp vừa tươi như mình.

04. ĐÊM TRĂNG HỎI NÀNG
Đêm trăng thanh anh mới hỏi nàng,
Tre non đủ lá đan sàng nên chăng?
Đan sàng thiếp cũng xin vâng,
Tre vừa đủ lá, non chăng hỡi chàng?

05. CHO NÀNG BÉN ANH
Đôi ta ăn một quả cau,
Cùng mặc áo vá nhuộm nâu một hàng.
Bao giờ cho gạo bén sàng,
Cho trăng bén gió, cho nàng bén anh.

06. CẦU DẢI YẾM
Ước gì sông rộng một gang,
Bắc cầu dải yếm để chàng sang chơi.

07. QUA ĐÌNH TRÔNG ĐÌNH
Qua đình ngả nón trông đình,
Đình bao nhiêu ngói, thương mình bấy nhiêu.

08. KHÁT KHAO DUYÊN NÀNG
Anh qua bờ giếng, anh lượn bờ ao,
Nước thì không khát, khát khao duyên nàng.

09. LÀM QUEN ÍT NGÀY
Chiều chiều vịt lội bàu sen,
Để anh lên xuống làm quen ít ngày.

10. THEN KHÔNG CÀI
Chửa quen đi lại cho quen,
Tuy rằng đóng cửa nhưng then không cài.

========================================
II. THẢ THÍNH NGỌT NGÀO, TÁO BẠO
========================================

11. ĐÃ ĂN TRẦU AI CHƯA?
Trăng lên có chiếc sao chầu,
Hỏi thăm đào liễu đã ăn trầu ai chưa?

12. NGẢ CÀNH HỒNG
Cô kia đứng ở bên sông,
Muốn sang anh ngả cành hồng cho sang.

13. ÁO BỎ QUÊN
Hôm qua tát nước đầu đình,
Bỏ quên chiếc áo trên cành hoa sen.
Em được thì cho anh xin,
Hay là em để làm tin trong nhà?

14. HỎI LÀM RỂ
Anh về hỏi mẹ cùng thầy,
Có cho làm rể bên này hay không?

15. BẾ BỒNG TRÊN TAY
Lấy ai thì cũng một chồng,
Lấy ta, ta bế ta bồng trên tay.

16. LÁ ĐA ĐẦY ĐÌNH
Cây đa rụng lá đầy đình,
Bao nhiêu lá rụng thương mình bấy nhiêu.

17. GẶP TIÊN
Vì em nên anh mới say,
Khi xưa ai biết cõi này có tiên.

18. DẪU CHẲNG BÉN DUYÊN
Dẫu rằng chẳng đặng bén duyên,
Cũng hun má lúm đồng tiền của em.

19. NÓN QUAI THAO
Ai làm chiếc nón quai thao,
Để anh thương nhớ ra vào khôn nguôi.

20. CAU XANH TRẦU VÀNG
Đêm khuya thiếp mới hỏi chàng,
Cau xanh ăn với trầu vàng xứng chăng?

========================================
III. TƯƠNG TƯ, TIẾC NUỐI VÀ LỠ DUYÊN
========================================

21. TRẦU CAY – CHẬM MỘT BƯỚC
Ba đồng một mớ trầu cay,
Sao anh không hỏi những ngày còn không?

22. NGÀY ĐI, NGÀY VỀ
Ngày đi em chửa có chồng,
Ngày về em đã tay bồng tay mang.

23. ĐÊM QUA CHỚP BỂ
Đêm qua chớp bể mưa nguồn,
Hỏi người tri kỷ có buồn hay chăng?
Cá buồn cá lội tung tăng,
Em buồn em biết đãi đằng cùng ai?

24. GỬI VÀI ĐIỀU THƯƠNG
Ai về đường ấy hôm mai,
Gửi dăm điều nhớ, gửi vài điều thương.
Gửi cho đến chiếu đến giường,
Gửi cho đến chốn buồng hương em nằm.

25. GẶP NHAU GIỮA ĐÔNG NGƯỜI
Đi qua nghiêng nón cúi lưng,
Anh không chào, em không hỏi vì chưng đông người.

========================================
TẶNG THÊM: ĐOẠN CA DAO TRONG ẢNH MẪU
========================================

TRÈO LÊN CÂY BƯỞI HÁI HOA
Trèo lên cây bưởi hái hoa,
Bước xuống vườn cà hái nụ tầm xuân.
Nụ tầm xuân nở ra xanh biếc,
Em lấy chồng rồi, anh tiếc lắm thay.

--- HẾT ---

=================================================================
TẬP MỞ RỘNG: 200 BÀI MỚI
=================================================================

[001] THẤY HOA MUỐN NÂNG NIU
Hoa thơm ai chả muốn chiều,
Thấy hoa ai chẳng nâng niu vịn cành.
Hoa sao hoa khéo mần thinh,
Người yêu hoa chẳng đoái tình với ta.

[002] THƯƠNG MÀ MUỐN LÀM QUEN
Hỡi cô cắt cỏ bên đê,
Có nghe anh hò đứng dậy mà nghe.
Nghe xong thì nói quê nhà,
Có nhiều anh chị hay là mình em.

[003] BÓNG NGƯỜI BÊN GIẾNG
Thấy em thấp bé mà xinh,
Anh thuận nhân tình, anh nắm cổ tay.
Nắm rồi anh hỏi cổ tay,
Ai nặn nên trắng, ai xây nên tròn.

[004] HOA XANH HOA TRẮNG
Bông xanh, bông trắng, bông vàng,
Bông lê, bông lựu, đố nàng mấy bông?

[005] SAY NGƯỜI QUÊ
Muốn ăn cơm trắng chả giò,
Thì về Bến Cốc đẩy xe bò với anh.

[006] GẶP TRÊN ĐƯỜNG ĐÊ
Trời mưa xăn ống cao quần,
Hỡi cô bán thuốc nhà gần hay xa?

[007] NÉT DUYÊN NGƯỜI QUA
Nhác trông thấy bóng một người,
Răng đen nhưng nhức, miệng cười như hoa.
Hai bên còn cả mẹ cha,
Có ai gánh đỡ hay là còn không?

[008] GIẾNG MỚI ĐÀO
Nghe đây có giếng mới đào,
Có chợ mới họp, anh tạt vào bán mua.
Còn không ta đợi ta chờ,
Hay là như ruộng có bờ thì thôi.

[009] NHƯ THẤY MẶT TRỜI
Thấy anh như thấy mặt trời,
Chói chang khó ngó, trao lời khó trao.

[010] XỨNG ĐÔI
Con cò trắng tợ như vôi,
Tình tôi với bậu xứng đôi quá chừng.

[011] NGỎ LỜI LÀM RỂ
Anh đây là con nhà tử tế,
Muốn ra vào làm rể, nên chăng?
Số em vất vả long đong,
Để anh thu xếp vào trong gia đình.

[012] RĂNG ĐEN MÌNH CƯỜI
Mình về mình nhớ ta chăng,
Ta về ta nhớ hàm răng mình cười.
Trăm quan mua lấy miệng cười,
Mười quan chẳng tiếc, tiếc người răng đen.

[013] HỎI CHUYỆN XUÂN THU
- Tới đây trước hỏi sau han,
Xuân thu anh đáng mấy,
Bạn hồng nhan anh thế nào?
- Tuổi hai mươi chẵn, chốn phòng đào còn lẻ đôi.

[014] ĐỢI ANH VỀ CƯỚI
Em về thưa mẹ cùng thầy,
Có cho anh cưới, tháng này anh ra.
Anh về thưa mẹ cùng cha,
Bắt lợn sang cưới bắt gà sang sêu.

[015] HỎI MAI
Trúc xa mai thì hoài lứa trúc,
Anh hỏi mai rằng đã có nơi mô nương tựa hay chưa?
Có nơi mô nương tựa khi nắng khi mưa,
Hay còn ôm duyên đi sớm về trưa một mình?

[016] GẶP EM HỚN HỞ
Gặp em hớn hở miệng cười,
Cũng bằng ăn chín uống mười lạng sâm.

[017] SANG SÔNG CÙNG ANH
Tay mang khăn gói sang sông,
Có sang anh đợi, ta cùng sang luôn.

[018] THƯƠNG CÔ CHĂN BÒ
- Trời mưa cá sặc lên gò,
Thấy em chăn bò anh để ý anh thương.
- Trời mưa ướt cọng rau mương,
Bò em em giữ anh thương giống gì?

[019] GIÃ GẠO GẦY DUYÊN
Tới đây cối gạo đã đầy,
Trước là giã gạo, sau gầy lương duyên.

[020] GÁNH NẶNG ĐƯỜNG VÒNG
Gánh nặng mà đi đường vòng,
Tuy rằng không gánh nhưng lòng cũng thương.

[021] HỎI THIỆT CÓ CHỒNG CHƯA
Ngó lên mây bạc trời hồng,
Thương em, hỏi thiệt có chồng hay chưa?

[022] DUYÊN EM BÁN MẤY
Trèo lên cây bưởi ngắt quả thanh yên,
Duyên em bán mấy, anh kiếm tiền anh mua.
- Duyên em bán thiệt ba trăm,
Anh mua chi nổi mà hỏi thăm rộn ràng.

[023] NÓN LÁ ÁO NÂU
Ớ này cô mặc áo nâu,
Đầu đội nón lá, đi đâu vội vàng?

[024] MỘT CHUYẾN ĐÒ CHUNG
Hai ta sang một chuyến đò,
Trông cho rảnh khách trao cho miếng trầu.

[025] TUỔI NÀNG HỢP ANH
Tay cầm quyển sách bìa xanh,
Xem trong số mệnh, tuổi anh hợp nàng.
Tay cầm quyển sách bìa vàng,
Xem trong số mệnh, tuổi nàng hợp anh.

[026] HỎI GẦY NHÂN DUYÊN
Tay bưng hộp thiếc cau đầy,
Hỏi em mấy tuổi anh gầy nhân duyên.

[027] KHĂN ĐÀO BÉN TÚI
Bao giờ cho hương bén hoa,
Khăn đào bén túi, cho ta bén mình.
Thuyền không đậu bến Giang Đình,
Ta không, ta quyết lấy mình làm đôi.

[028] NGƯỜI TA CÂU SÔNG
Người ta câu bể câu sông,
Tôi đây câu lấy con ông cháu bà.
Có chồng thì nhả mồi ra,
Không chồng, em cắn, em tha lấy mồi.

[029] VƯỜN EM TRỒNG CHANH
Vườn em có đất trồng chanh,
Cho anh bứng gốc cam sành trồng bên.

[030] THƯƠNG NHAU NÊN HỎI
Hỡi chàng da trắng tóc dài,
Em đã chờ đợi một hai năm trời.
Cho nên mặt ủ chẳng tươi,
Sợ chúng bạn cười chẳng dám nói ra.

[031] THEO ANH CHO ẤM
Theo anh cho ấm tấm thân,
Khỏi qua non nọ, khỏi lần núi kia.

[032] CÁ THÁC LÁC
Bần che bóng mát, cá thác lác quẫy đục ngầu,
Anh hỏi em đã có nơi nào hay chưa?

[033] CÓ LẤY NHAU CHĂNG
Mình chả lấy ta rồi ra mình thiệt,
Ta chả lấy mình ta biết lấy ai.
Răng đen còn có khi phai,
Má hồng khi nhạt, tóc dài khi thưa.

[034] HỌA BA CÁI HÌNH
Mình ơi mình có thương ta,
Ta ra kẻ chợ họa ba cái hình.
Phòng khi ta nhớ tới mình,
Thì ta lại giở cái hình ra xem.

[035] NGHE TIN EM HAY HÒ
Nghe tin em hay hát hay hò,
Qua mấy sông anh cũng lội, qua mấy đò anh cũng sang.

[036] THƯƠNG TRỘM NHỚ THẦM
Hỡi người bạn cũ tri âm,
Đôi ta thương trộm nhớ thầm đã lâu.

[037] NGƯỜI BẠN CŨ
Hỡi người bạn cũ quen ta,
Có ai như bạn giúp cho ta một người.
Một người mười tám cho xinh,
Lời ăn tiếng nói như mình mình ơi.

[038] GÁNH CỎ MỘT VAI
Hỡi cô gánh cỏ đường vòng,
Cho anh gánh hộ làm chồng một vai.
Hỡi cô gánh cỏ đường dài,
Cho anh gánh hộ một vai nên chồng.

[039] VAI ANH KHÔNG GÁNH
Hỡi cô gánh cỏ đường vòng,
Vai anh không gánh nhưng lòng anh thương.

[040] MIẾNG TRẦU XANH
Gặp nhau đây ăn miếng trầu xanh,
Chả ăn cầm lấy cho anh bằng lòng.

[041] HỎI LÀNG HỎI TỔNG
Gặp anh đây bụng mừng phơi phới,
Cẳng bước tới miệng nọ liền chào.
Anh ở tổng chi, làng chi, nói cho em hiểu,
Đặng em vào làm quen.

[042] THUYỀN GÃY MỘT NAN
- Thuyền em có gãy một nan,
Không tin anh đội về làng mà xem.
- Vườn anh có gốc tre già,
Thuyền em có gãy, anh chẻ nan gài lại cho.

[043] QUẠ KÊU BA TIẾNG
Quạ kêu ba tiếng quạ sà,
Khi nào qua rảnh qua nhà bậu chơi.

[044] CẦM CHÈO ĐỢI NÀNG
Gió đập cành tre, gió đánh cành tre,
Chiếc thuyền anh vẫn le te đợi nàng.
Gió đập cành bàng, gió đánh cành bàng,
Dừng chèo anh hát, cô nàng hãy nghe.

[045] MỘT MÌNH ĐI VỀ
Người ta con trước con sau,
Thân anh không vợ như cau không buồng.
Người ta đi đón về đôi,
Thân anh đi lẻ về loi một mình.

[046] GỬI GIẤY GỬI VIẾT
Sáng mai xách dĩa mua tương,
Gặp anh trong trường cầm viết ngó ra.
Em về mua lụa mười ba,
Cắt áo cổ giữa mà tra nút vào.

[047] THƯƠNG CHẲNG BIẾT ĐỂ ĐÂU
Thương em chẳng biết để đâu,
Để quán quán đổ, để cầu cầu xiêu.

[048] NHẠN MANG THƯ
Thư trên anh thảo mấy lời,
Nhạn ơi xin gởi tới người tri âm.
Xa xôi anh có lời thăm,
Thăm em đôi chữ Châu Trần định chưa.

[049] GẶP NƯỜNG NHƯ GẶP VÀNG
Vừa ra khỏi ngõ gặp nường,
Cũng thể ra đường gặp được vàng thoi.

[050] THƯƠNG EM CŨNG MUỐN
Thương em cũng muốn thương đời,
Sợ cha sợ mẹ chẳng rời em ra.

--- CA DAO NHỚ NHUNG, HẸN HÒ, TƯƠNG TƯ ---

[051] NHƯ TRĂNG NHỚ TRỜI
Bạn ơi có nhớ ta chăng,
Ta thì nhớ bạn như trăng nhớ trời.

[052] NGÀY NÀO GẦN MÌNH
Ngày nào mà đặng gần mình,
Mới là hết bệnh tư tình cùng em.

[053] BẤY LÂU MƠ MÀNG
Bấy lâu thức nhắp mơ màng,
Bên rèm tiếng gió, đầu giường bóng trăng.

[054] CƠM ĂN CHẲNG ĐẶNG
Rắn đứt đầu, rắn hãy còn bò,
Chim đứt cánh, chim hãy còn bay.
Từ ngày xa bạn tới nay,
Cơm ăn chẳng đặng, nằm hoài tương tư.

[055] CHIỀU NAY TỰA CỬA
Dòng sông mặt nước lờ đờ,
Chiều nay tựa cửa em chờ đợi anh.
Ngó ra đồng cỏ xanh xanh,
Ai đương cấy ruộng giống anh quá chừng.

[056] ĐÊM NĂM CANH
Đêm năm canh trông nam nhớ bắc,
Ngày sáu khắc trông quế nhớ trầm.
Nào ai nhắc tới tri âm,
Ruột em đau từng chặng, gan em bầm từng khi.

[057] ÁO BÀ BA ĐEN
Em mặc áo bà ba đen,
Nước da em trắng, đôi má ngấn đồng tiền.
Đêm nằm anh thao thức,
Năm canh liền nhớ em.

[058] TƯƠNG TƯ CHẲNG ỐM
Tương tư chẳng ốm cũng sầu,
Con ruồi đậu mép, chẳng đau cũng buồn.

[059] BÓNG QUANH NHÀ NÀNG
Tuy rằng anh ở nhà anh,
Hồn hoa vất vưởng xung quanh nhà nàng.

[060] ĐÊM QUA VUI THÚ
Đêm qua vui thú nơi đâu,
Đấy vui có nhớ chốn sầu này chăng?
Một tháng có đôi tuần trăng,
Sao đấy chẳng ở cho bằng lòng đây?

[061] ĐÊM KHÔNG NGỦ
Thiếp xa chàng quên ăn quên ngủ,
Chàng xa thiếp thức đủ năm canh.

[062] KHĂN XÉO LAU LỆ
Bạn về dưới nớ lâu lên,
Để em úp mặt vô phên khóc thầm.
Bạn ở dưới nớ về luôn,
Để khăn xéo lại, lụy tuôn em chùi.

[063] CHẲNG DÁM CHÀO NHAU
Ra đường chẳng dám chào nhau,
Con mắt liếc thấy dạ đau quằn quằn.
Về nhà cơm chẳng muốn ăn,
Chân chẳng muốn bước vì chưng nhớ người.

[064] NHỚ NƠI HẸN HÒ
Trăng thanh vằng vặc giữa trời,
Nhớ tình nhớ nghĩa nhớ nơi hẹn hò.

[065] NGÀY NGÀY BỜ SÔNG
Ngày ngày ra đứng bờ sông,
Sông xa xa tít cho lòng em đau.
Nhớ ai đứng tủi, ngồi sầu,
Mình ve sương tuyết bao lâu mà mòn.

[066] RA VỀ BẺ LÁ
Ra về bẻ lá cắm đây,
Hôm sau ta cứ chốn này ta lên.

[067] ĐỢI CHA MẸ NGỦ
Gió đưa cành mận, gió lận cành đào,
Vì em anh phải ra vào tối tăm.
Tối tăm thì mặc tối tăm,
Chờ cho bác mẹ đi nằm sẽ hay.

[068] MƯA SA CŨNG ĐI
Đã say lời hẹn khi chiều,
Mưa sa gió thổi cũng liều mà đi.

[069] NGUỒN ÂN BỂ ÁI
Nguồn ân bể ái hẹn hò,
Mấy sông cũng lội, mấy đò cũng đi.
Gặp em tên họ là chi?
Ngược thuyền mấy buổi sao nỡ ngoảnh đi chẳng nhìn?

[070] MIẾNG TRẦU ĐỢI CHỜ
Trông cho trời sáng trăng rằm,
Mẹ ngồi kéo vải, cha nằm đọc thơ.
Còn em ra đứng đầu bờ,
Miếng trầu gói sẵn đợi chờ anh sang.

[071] KẾT ĐÔI CHỐN VẮNG
Bờ sông khúc lở khúc bồi,
Kiếm nơi quạnh vắng trao lời với anh.

[072] THƯƠNG NHỚ ĐẦU CẦU
Em thương nhớ ai ngơ ngẩn bên đầu cầu,
Lược thưa biếng chải, gương tàu biếng soi.
Em thương nhớ ai ra ngẩn vào ngơ,
Đêm quên giấc ngủ ngày mơ trận cười.

[073] THƯƠNG MỘT MÌNH MÌNH
Thiếu chi người đẹp bốn phương,
Tôi không có nhớ mà chỉ nhớ thương một mình mình.

[074] NHỚ NHAU LỤY ỨA
Nhớ nhau lụy ứa hai hàng,
Thương nhau luống những đoạn tràng thiết tha.

[075] CHÍN NHỚ MƯỜI THƯƠNG
Ra về chín nhớ mười thương,
Bước chân lên ngựa cầm cương dùng dằng.

[076] KIỂNG XA BỒN
Kiểng xa bồn, kiểng không xanh,
Anh rầu người nghĩa, cơm canh bỏ liều.

[077] GAN VÀNG CHẲNG CẮT
Gan vàng chẳng cắt mà đau,
Cách em một chút một rầu như dưa.

[078] NƯỚC MẮT THAY CANH
Anh xa em anh ăn cơm với cá,
Em xa anh, em chan nước mắt thay canh.

[079] KHĂN ĐÀO CÀNH MƠ
Khăn đào vắt ngọn cành mơ,
Mình xuôi đằng ấy, bao giờ mình lên?
- Em xuôi, em lại ngược ngay,
Sầu riêng em để trên này cho anh.

[080] ANH ĐI PHƯƠNG XA
Anh đi biệt tích phương xa,
Để em ôm bóng trăng tà năm canh.
Hai vai một gánh chung tình,
Nhớ ai, ai có nhớ mình hay không?

--- CA DAO LỠ DUYÊN, CHUNG TÌNH ---

[081] CHẬM BƯỚC CÓ CHỒNG
Khăn rằn nhúng nước ướt mem,
Tại anh chậm bước nên em có chồng.

[082] ĐẾN TÌM HOA MUỘN
- Anh đến tìm hoa thì hoa đã nở,
Anh đến tìm đò, đò đã sang sông.
Anh đến tìm em, em đã lấy chồng,
Em yêu anh như rứa có mặn nồng chi mô?

[083] TRAO LỜI CHẲNG TRAO DUYÊN
Đêm nằm lưng chẳng bén giường,
Cũng vì một nỗi người thương trao lời.
Trao lời mà chẳng trao duyên,
Để thương để thảm, để phiền cho nhau.

[084] LỠ DUYÊN ĐỢI ANH
Ngó lên trời thấy mây trong lại trắng,
Ngó xuống nước thấy nước trắng lại trong.
Nhỏ nhỏ như em chắc dạ bền lòng,
Lỡ duyên chịu lỡ, đóng cửa loan phòng đợi anh.

[085] NỬA VƯỜN NỬA CHỪNG
Chè non em hái nửa vườn,
Cau non nửa chục, người thương nửa chừng.
Đắng cay như bát nước gừng,
Biết ra dang dở thì đừng quen nhau.

[086] THƯƠNG MÀ LỠ BƯỚC
Ao hồ cá lội trông sao,
Em có chồng rồi, anh biết liệu sao bây giờ.

[087] TRÁCH ÔNG MAI
Đón ngăn đường tắt, tui hỏi gắt bạn chung tình,
Điểu xa mai, mai xa điểu, tui xa mình tại ai?
Cây oằn vì bởi trái sai,
Tui xa mình bởi ông mai ít lời.

[088] GIỮ MỘT DẠ MỘT LÒNG
Từ khi gặp mặt giữa đàng,
Thiếp quyết thương chàng cha mẹ nào hay!
Có hay nhất đánh nhì đày,
Thủy chung em giữ trọn mấy lời.

[089] CẦU CAO VÁN YẾU
Cầu cao ván yếu gập ghình,
Chân lần tay dắt bạn chung tình đi qua.

[090] THƯƠNG CHO TRÓT
Anh thương em phải thương cho trót,
Anh đừng bỏ sót cái nghĩa chung tình.

[091] TRÁCH GÀ GÁY TAN
Trách gà sao vội gáy tan,
Chung tình chưa mãn chuông vàng vội rung.

[092] ĂN CƠM QUÁN NGỦ ĐÌNH
Ngó lên trời, trời cao lồng lộng,
Ngó dưới đất, đất rộng mênh mông.
Anh với em gá nghĩa chung tình,
Dù ăn cơm quán, ngủ đình cũng ưng.

[093] TRĂM NĂM CHỈ MÀNH
Giữa trời cây cả bóng cao,
Nhân duyên đã định xe vào cho anh.
Trăm năm kết sợi chỉ mành,
Ái ân gắn bó chung tình keo sơn.

[094] YÊU NHAU CHẲNG LỌ
Yêu nhau chẳng lọ chiếu giường,
Dẫu rằng tàu lá che sương cũng tình.

[095] THƯƠNG EM VÌ TÌNH
Cây oằn nhờ bởi tại hoa,
Qua thương nhớ bậu chẳng qua vì tình.
Thương em thương dạng, thương hình,
Thương bàn tay em rẽ mạ cắm xuống sình, anh cũng thương.

[096] ĐẾN NGÀY HOA NỞ
Lúa xanh lúa trổ bông nhanh,
Em xanh em cũng muốn anh hẹn hò.

[097] ĐÊM NẰM THỨC GIẤC
Gió mùa đông trăng lồng lạnh lẽo,
Năm canh chầy thắt thẻo ruột gan.

[098] CHIM XA LIỄU
Liễu xa đào, đào khô liễu héo,
Lựu xa đào, lựu ngã đèo nghiêng.
Xa cách ai đêm thảm ngày phiền,
Chim trên rừng sầu rũ cá dưới miền khóc than.

[099] MƯỜI HAI CỬA BIỂN
Mười hai cửa biển chàng ơi,
Chàng ở trong ấy thiếp tôi ngoài này.
Nhạn ơi trăm sự nhờ mày,
Ngậm thư đưa tới lầu tây cho chàng.

[100] ĐÂU CÓ MÀNG CUỘC CHƠI
Sài Gòn thiên hạ rộn ràng,
Qua đây nhớ bậu không màng cuộc chơi.

--- THƠ MỚI — THẢ THÍNH DUYÊN DÁNG ---

[101] NGÕ NHỎ CHIỀU XƯA
Chiều nghiêng qua ngõ nhà ai,
Anh đi mấy lượt, bóng dài theo chân.
Gặp em chỉ dám hỏi gần,
Rằng cây cau ấy đã lần trổ buồng?

[102] MỘT NHÀ HAI HIÊN
Nhà em có bụi hoa ngâu,
Nhà anh có chiếc sân sau đợi người.
Ước gì chung một tiếng cười,
Sáng nghe em gọi, tối người gọi anh.

[103] CHỢ SỚM
Chợ đông người bán người mua,
Riêng anh chỉ hỏi trầu vừa têm chưa.
Em cười như nắng ban trưa,
Thế là anh bỏ cả mùa chợ đông.

[104] NẮNG TRÊN VAI
Nắng lên hong chiếc áo nâu,
Làm sao hong hết nỗi sầu chưa thưa.
Anh mong một sớm trời mưa,
Được đem chiếc nón đón đưa em về.

[105] DÒNG SÔNG HỎI THẦM
Sông kia nước chảy đôi bờ,
Anh đây một dạ vẫn chờ tiếng em.
Thuyền ai thắp ngọn đèn đêm,
Cho anh sang hỏi có thêm một người?

[106] VƯỜN CAU CHỜ NỤ
Cau nhà vừa mới ra hoa,
Mẹ anh đã hỏi người ta nơi nào.
Anh thưa chẳng ở đâu cao,
Chỉ bên hàng giậu có đào nhà bên.

[107] ĐẦU XÓM CUỐI LÀNG
Đầu làng em gánh rau xanh,
Cuối làng anh đợi để dành lời thương.
Một câu chưa kịp hỏi đường,
Em đi mất hút, vấn vương cả chiều.

[108] HỎI NÀNG MỘT CÂU
Trăng treo đầu ngọn trúc già,
Cho anh hỏi nhỏ nhà ta mấy người?
Nếu còn một chỗ bên đời,
Anh xin gửi trọn một lời chân tâm.

[109] CHIẾC KHĂN TAY
Khăn điều em buộc bên vai,
Anh nhìn một thoáng nhớ hoài màu khăn.
Mong sao qua mấy mùa trăng,
Được em tự buộc khăn rằng có đôi.

[110] VẾT CHÂN TRÊN CÁT
Bên sông in dấu chân người,
Anh qua còn thấy một trời hương cau.
Hỏi em mai có qua cầu,
Cho anh theo với, trước sau một đường.

[111] GIỌT SƯƠNG ĐẦU NGÕ
Sương mai còn đọng lá dâu,
Thương em anh đứng qua cầu ngóng trông.
Nếu em chưa hẹn với ai,
Cho anh gửi lại một vài mùa xuân.

[112] MIẾNG TRẦU CHƯA TÊM
Trầu xanh còn đợi tay têm,
Lòng anh còn đợi một đêm em cười.
Người ta lựa chọn khắp nơi,
Anh xin lựa lấy một người là em.

[113] MƯA NGOÀI HIÊN
Mưa rơi ướt mái tranh nghèo,
Anh nghe tiếng guốc em theo lối về.
Giá mà được dắt em đi,
Đường xa cũng hóa lối về gần thôi.

[114] GIỮ LẠI MÙA XUÂN
Mận vừa đỏ má trên cành,
Anh vừa thấy mặt đã thành tương tư.
Em ơi, nếu chẳng chối từ,
Cho anh xin giữ một mùa xuân chung.

[115] BÊN LŨY TRE
Tre làng gió thổi lao xao,
Anh thương em tự thuở nào chẳng hay.
Ngày mai em có qua đây,
Cho anh được hỏi bàn tay còn không?

[116] LỬA BẾP
Bếp nhà em khói lên cao,
Nhà anh đun nước mà sao nhớ người.
Mong một ngày ấm tiếng cười,
Hai căn bếp nhỏ thành nơi chung nhà.

[117] ĐÒ CHƯA QUA BẾN
Con đò còn đợi nước lên,
Anh còn đợi một cái tên gọi mình.
Em mà có chút hữu tình,
Xin đừng để bến một mình đợi trăng.

[118] HOA BÊN HÀNG RÀO
Hoa rơi trước cửa nhà nàng,
Anh đem nhặt lấy, dịu dàng cất đi.
Chờ ngày em hỏi làm chi,
Anh thưa nhặt hộ xuân thì của em.

[119] MỘT CÂU CHÀO
Gặp em dưới bóng cây đa,
Anh chào một tiếng, hóa ra nhớ đời.
Từ hôm nghe giọng em cười,
Đường xa cũng muốn ngược xuôi ghé về.

[120] THƯA MẸ
Mẹ ơi con chẳng cần vàng,
Chỉ mong được đón một nàng về thưa.
Rằng người qua ngõ hôm mưa,
Là người con đã đợi chờ bấy lâu.

--- THƯƠNG THẦM CHƯA NÓI ---

[121] NGHE GIÓ GỌI TÊN
Gió qua chiếc lá sân đình,
Anh nghe như có ai rình gọi tên.
Ngỡ em đứng tựa bên thềm,
Hóa ra chỉ gió đưa đêm ngang nhà.

[122] MƯỢN ÁNH TRĂNG
Đêm nay trăng sáng đầu sông,
Anh mượn vầng sáng gửi lòng sang em.
Sáng mai trăng khuất qua rèm,
Liệu em còn nhớ người xem trăng cùng?

[123] BỜ VAI BỎ TRỐNG
Áo nâu phơi giữa sân nhà,
Bờ vai anh vẫn chừa ra một phần.
Chẳng mong gấm vóc xa gần,
Chỉ mong ai đó một lần tựa vai.

[124] NGƯỜI CHƯA HẸN
Nắng chiều vàng cả triền đê,
Anh về bên ấy chẳng nghe tiếng chào.
Có người chưa hẹn lần nào,
Mà sao nỗi nhớ cứ vào trong tim.

[125] GIẤU TRONG ÁO
Một câu thương giấu trong tay,
Một câu nhớ cất những ngày không mưa.
Sợ em nghe được lại thưa,
Rằng tình anh đến chẳng vừa lòng em.

[126] BƯỚC CHÂN QUA ĐỒNG
Đồng xa lúa đã lên xanh,
Em đi phía trước, còn anh phía sau.
Đường làng chẳng rộng bao lâu,
Mà câu muốn nói ngập ngừng chưa xong.

[127] CỬA SỔ NHÀ NÀNG
Đèn nhà em sáng canh ba,
Anh ngồi đếm gió qua nhà hồi lâu.
Thương người chẳng dám hỏi câu,
Sợ lời vừa nói hóa sầu đôi bên.

[128] MÀU ÁO QUEN
Mỗi lần áo biếc qua sân,
Anh như cây lúa vừa gần cơn mưa.
Màu áo ấy chẳng mới xưa,
Sao đi một chuyến cũng vừa nhớ thương.

[129] VẾT MỰC
Viết tên lên mảnh giấy nâu,
Anh đem xóa vội vì sầu ai hay.
Mực tan còn một nét gầy,
Như điều anh muốn nói ngày gặp em.

[130] CHUYỆN KHÓ NÓI
Người ta hỏi đã thương chưa,
Anh cười bảo gió mới vừa sang sông.
Nào ai biết được trong lòng,
Một lời em nói nhớ mong mấy ngày.

[131] THIẾU MỘT NGƯỜI
Chợ tan còn bóng hàng cau,
Đường làng còn dấu chân sau gót người.
Năm canh nghe thiếu tiếng cười,
Mới hay thương nhớ chẳng mời cũng sang.

[132] LỜI GIỮA MÙA THU
Thu về lá rụng sân sau,
Lá rơi thì dễ, quên nhau khó lòng.
Một lần ánh mắt chia ly,
Đem theo cả buổi xuân thì trong anh.

[133] TƯƠNG TƯ NHẸ
Nhớ người đâu phải vì xa,
Ở chung một xóm cũng là nhớ nhung.
Ngày nào chẳng gặp cuối cùng,
Đêm về vẫn thấy thiếu cùng một ai.

[134] CƠM CHƯA NGUỘI
Bữa cơm mẹ gọi ba lần,
Anh còn ngồi ngó ngoài sân đợi người.
Mẹ cười: 'Lòng đã có đôi?'
Anh cười chẳng đáp, chỉ ngồi nhìn trăng.

[135] PHIÊN CHỢ KHÔNG EM
Chợ phiên hôm ấy mưa dầm,
Không nghe giọng nói quen thầm bên tai.
Hoa cau vẫn trắng trên vai,
Thiếu người mua trầu nên dài buổi trưa.

[136] MÙA HOA GẠO
Hoa gạo đỏ rực ven sông,
Anh ngồi chờ một tiếng cười xa xôi.
Tưởng gần chỉ một quãng trời,
Hóa ra xa tự lòng người chưa thương.

[137] NGƯỜI TRONG MẮT
Sông sâu còn có đáy sông,
Mắt em nhìn thoáng, lòng không thấy bờ.
Anh về giữ một câu thơ,
Đến nay chưa dám đưa nhờ gió sang.

[138] CHIẾC NÓN ÚP NGHIÊNG
Nón em úp cạnh bờ ao,
Anh đi qua ngõ, nao nao trong lòng.
Nón kia che nắng che dông,
Có che giùm được nỗi mong trong anh?

[139] SAU MÙA GẶT
Gặt xong ruộng vẫn thơm rơm,
Anh về thấy thiếu mùi thơm tóc người.
Vườn cau còn đón nắng tươi,
Sao căn nhà nhỏ thiếu cười như xưa.

[140] CÂU HÁT QUA SÔNG
Ai hò một khúc qua sông,
Cho anh nghe sóng thành lòng nhớ ai.
Hò xong tiếng đã nhạt phai,
Riêng câu cuối ấy theo hoài bước chân.

--- LỠ DUYÊN, CHẬM MỘT BƯỚC ---

[141] BẾN NƯỚC MỚI
Ngày xưa chung một bến đò,
Bây giờ em bước sang bờ khác xa.
Anh không trách một lời qua,
Chỉ thương con nước còn ra ngóng vào.

[142] HOA ĐÃ CÓ NGƯỜI
Anh về qua ngõ đào phai,
Nghe tin em cưới vào ngày cuối đông.
Ngày xưa một khúc sông chung,
Bây giờ đôi bến, một dòng chia đôi.

[143] TRỄ MỘT MÙA
Cau vừa kết trái sân sau,
Anh vừa dám hỏi, người ta sang nhà.
Trầu em đã gửi người ta,
Đành đem lời hẹn thả ra cuối vườn.

[144] BÔNG LÚA CUỐI ĐỒNG
Lúa vàng ai gặt trước anh,
Cánh đồng vẫn đẹp mà thành quạnh hiu.
Câu thương đến muộn buổi chiều,
Gió mang đi mất bao điều chưa thưa.

[145] CẦU ĐÃ CÓ ĐÒ
Bờ sông em đứng chiều nao,
Anh đi chậm bước để bao người chờ.
Ngày về chiếc bến còn trơ,
Con đò em chọn đã đưa sang bờ.

[146] NGÀY CƯỚI NGƯỜI
Pháo hồng không đốt ngoài sân,
Mà nghe trong dạ bao lần vỡ tan.
Em đi một chuyến sang ngang,
Anh về nhặt lại mùa vàng đã rơi.

[147] MỘT TIẾNG CHÚC MỪNG
Gặp em trong áo vu quy,
Anh chào thật khẽ, lòng thì rất đau.
Chúc em yên ấm về sau,
Còn anh tập sống những ngày không em.

[148] NỤ TẦM XUÂN KHÁC
Hoa xuân vừa nở trước nhà,
Chưa kịp đưa hái, người ta hái rồi.
Anh đành giữ một tiếng 'thôi',
Để mùa xuân ấy xa xôi với mình.

[149] TRẦU CAU ĐÃ ĐỊNH
Trầu xanh đã có người têm,
Cau non đã hẹn bên thềm nhà ai.
Anh về đếm bóng chiều dài,
Đếm sao cho hết những ngày nhớ em.

[150] ĐỨNG BÊN BỜ CŨ
Một bờ sông, một bờ xa,
Một người đã cưới, một ta đứng nhìn.
Nước trôi chẳng giữ được hình,
Lòng còn giữ mãi cuộc tình chưa nên.

[151] CHIẾC KHĂN EM TẶNG
Khăn tay ngày ấy trao rồi,
Người trao đã bước sang đời khác xa.
Khăn còn thơm chút hương hoa,
Anh đem cất kín như là cất xuân.

[152] LỜI CHƯA KỊP NÓI
Trăng tàn qua ngọn cau cao,
Câu thương chưa nói biết trao ai giờ.
Em đi để lại câu thơ,
Vần đầu là nhớ, vần chờ là đau.

[153] NGƯỜI QUA BẾN CŨ
Đò sang còn tiếng chèo khua,
Anh về lặng lẽ giữa mùa mưa rơi.
Bến xưa không thiếu bóng người,
Chỉ không còn một nụ cười đợi anh.

[154] CHẬM MỘT CÂU HỎI
Giá ngày ấy hỏi sớm hơn,
Có khi chẳng phải cô đơn thế này.
Một lời nén giữa bàn tay,
Đến khi mở được, người nay xa rồi.

[155] TIỄN EM
Em về làm dâu xứ xa,
Đường quê vẫn nở ngàn hoa đón người.
Anh xin giữ lại nụ cười,
Không xin giữ bước chân người nữa đâu.

[156] CÂY BƯỞI SAU NHÀ
Cây bưởi đã mấy mùa hoa,
Mà người năm cũ vẫn là người xa.
Quả sai kín cả vườn nhà,
Riêng anh vẫn thiếu một mùa có em.

[157] SỢ GẶP LẠI
Nếu mai đi giữa chợ đông,
Vô tình trông thấy má hồng năm nao,
Anh xin nghiêng nón cúi chào,
Kẻo câu chuyện cũ nghẹn vào lòng nhau.

[158] MÙA CƯỚI CUỐI THU
Ngoài sân xao xác lá vàng,
Ngày em xuất giá là ngày thu sang.
Ai cười trong tiếng chuông vang,
Anh nghe lá rụng ngổn ngang lối về.

[159] ĐỢI QUÁ MỘT NGƯỜI
Hẹn nhau khi lúa còn xanh,
Lúa vàng chưa gặt, em thành người ta.
Anh về đứng giữa sân nhà,
Chỉ nghe ngọn gió đi qua tiếng mình.

[160] KHÔNG TRÁCH
Em đi đâu phải lỗi em,
Duyên không buộc được thì đành thả thôi.
Trách chi chiếc lá xa cành,
Khi mùa đã đổi, khi mình lỡ nhau.

--- XA CÁCH, NHỚ MONG ---

[161] THƯ TỪ BẾN XA
Viết thư theo cánh chim trời,
Chim bay qua núi, chẳng lời hồi âm.
Anh đem gửi cả trăng rằm,
Mong bên cửa sổ em thầm nhớ quê.

[162] CON ĐÒ MÙA CẠN
Sông cạn còn lối qua ngang,
Lòng xa muôn dặm chẳng sang được gần.
Anh đong nỗi nhớ từng lần,
Đong rồi mới biết chẳng cân nổi tình.

[163] NGÀY MƯA XA BẠN
Mưa chiều rả rích mái tranh,
Bếp than đỏ lửa mà anh lạnh lòng.
Bên kia em có nhớ không,
Một người còn thức đợi dòng thư sang.

[164] SAU NGÀY CHIA TAY
Cửa nhà còn chiếc đèn dầu,
Chờ ai thắp sáng qua cầu đêm sương.
Đèn soi một nửa con đường,
Nửa kia là nỗi nhớ thương chẳng cùng.

[165] TRĂNG HAI MIỀN
Trăng non bên ấy có tròn,
Hay như bên nọ khuyết mòn vì ai?
Đôi nơi chung một đêm dài,
Mà sao hai kẻ chẳng hoài gặp nhau.

[166] ĐỢI GIỮA MÙA ĐÔNG
Gió mùa về lạnh bàn tay,
Anh đan lời nhớ gửi ngày phương xa.
Áo dày có ấm được da,
Làm sao ấm nổi mái nhà thiếu em.

[167] CÁNH NHẠN KHÔNG THƯ
Nhạn về lướt giữa trời thu,
Anh nhìn theo mãi lời ru cuối mùa.
Nhạn không mang mảnh thư xưa,
Chỉ mang một thoáng gió lùa bờ vai.

[168] TIẾNG SÁO NGOÀI ĐỒNG
Sáo diều ai thả chiều nay,
Nghe như tiếng nhớ theo mây đi tìm.
Bóng em qua núi lặng im,
Anh còn gửi gió một niềm chưa nguôi.

[169] MỘT MÙA VẮNG
Sáng nay hoa nở sân đình,
Không ai ngắt hộ nên mình ngẩn ngơ.
Trời xanh vẫn giống ngày xưa,
Chỉ người bên cạnh chưa vừa trở về.

[170] NHỚ NGƯỜI KHÔNG HẸN
Em đi chẳng hẹn ngày về,
Anh không dám hỏi khi nào gặp nhau.
Ngày qua hoa trắng vườn cau,
Đêm qua trăng đọng nỗi sầu trên hiên.

[171] THUYỀN KHÔNG BẾN
Thuyền kia neo giữa sông sâu,
Chẳng ai cầm lái, chẳng đâu là nhà.
Lòng anh sau buổi tiễn xa,
Như con thuyền nhỏ chưa qua được buồn.

[172] CHIỀU THÁNG GIÊNG
Tháng giêng còn mỏng sương bay,
Anh đi qua bến nhớ ngày chung đôi.
Tiếng chào gửi lại xa xôi,
Cả năm chẳng hết một lời chưa quên.

[173] ĐƯỜNG VỀ THIẾU BẠN
Con đường ngày trước chung chân,
Bây giờ cây cỏ như gần như xa.
Quen đường mà lạ bước qua,
Vì người đi cạnh hóa ra chẳng còn.

[174] CÂY CẦU MÙA GIÓ
Cầu tre lắc lẻo đôi bờ,
Em đi đầu ấy, anh chờ đầu đây.
Gió qua cây lá hao gầy,
Bao giờ đôi ngả trở về một phương?

[175] CANH KHUYA
Canh khuya ngọn nến chập chờn,
Đèn còn có bạn, anh còn có ai?
Ngoài sân gió trở heo may,
Ngỡ nghe tiếng bước, hóa ngày xưa thôi.

[176] NẾU CÒN NHỚ
Nếu người còn nhớ câu xưa,
Xin đừng gửi hết vào mưa cuối trời.
Một câu đủ ấm lòng người,
Một lời đủ để nụ cười nở ra.

--- HẸN ƯỚC, NÊN ĐÔI ---

[177] HẸN ĐẦU XUÂN
Đào vừa hé một cánh hồng,
Anh đem câu hát đặt trong lá mềm.
Hẹn em phiên chợ ngày thêm,
Cùng mua chút nắng mang về chung sân.

[178] SẮC HỒNG TRÊN MÁ
Hoa đào đỏ một khoảng trời,
Mà anh chỉ thấy nụ cười của em.
Nếu em thuận một tiếng 'ừ',
Anh xin đợi đến xuân sau cũng đành.

[179] CÙNG NGẮM TRĂNG
Trăng tròn qua mái đình cao,
Em ngồi bên ấy, anh vào bên đây.
Chẳng cần hẹn ước thật đầy,
Chỉ cần trăng sáng có ngày chung đôi.

[180] NHÀ CÓ HAI NGƯỜI
Nhà anh chẳng có vàng son,
Có sân phơi lúa, có con mèo nằm.
Nếu em cùng đón trăng rằm,
Chắc hiên nhà nhỏ ấm dần từ đây.

[181] HÁI HOA ĐẦU NGÕ
Hái hoa anh chẳng hái nhiều,
Chừa cho ong bướm những chiều tìm hương.
Chỉ xin em một chữ thương,
Để anh ghi nhớ dặm đường về sau.

[182] HẸN NGÀY XUỐNG CHỢ
Mùng năm em xuống chợ phiên,
Cho anh theo gánh muối miền bên sông.
Mua gì chẳng phải mua bông,
Anh mua một nụ cười hồng của em.

[183] NẮNG MỚI
Nắng mai lách qua vườn cà,
Anh nghe chim hót như là gọi xuân.
Nếu em có bước qua sân,
Cho anh xin hỏi một lần có thương?

[184] MÀU TRẦU CÁNH PHƯỢNG
Trầu têm cánh phượng vừa xong,
Anh mang sang hỏi trong lòng em sao.
Nếu duyên hai ngả gặp nhau,
Xin đem chung một giàn cau trước nhà.

[185] NÉT CHỮ ĐẦU XUÂN
Viết tên em cạnh tên mình,
Mực chưa ráo giấy, lòng thành đã sâu.
Trăm năm xin hẹn cùng nhau,
Chỉ mong một buổi bạc đầu bên nhau.

[186] QUA MÙA GIÓ NỔI
Gió sang em có lạnh không,
Anh đem lời hát gửi trong mây chiều.
Ngày mai nếu thấy gió nhiều,
Thì nghe trong gió có điều anh thương.

[187] BÔNG SEN SÂN ĐÌNH
Sen trong hồ mới nở hoa,
Người đi qua ngõ khiến ta mải nhìn.
Thấy em đứng dưới sân đình,
Tự nhiên câu hát vô tình hóa duyên.

[188] CHIẾC CHIẾU HOA
Mẹ anh dệt chiếc chiếu hoa,
Bảo rằng để sẵn ngày ta đón nàng.
Anh cười giấu một mơ màng,
Đợi em gật nhẹ, trải rồi chiếu đôi.

[189] CHƯA MUỘN ĐÂU EM
Trời chiều mà nắng còn tươi,
Tình chưa ngỏ hết, sao người vội xa.
Nếu em chưa hẹn người ta,
Thì anh xin nói thật thà: thương em.

[190] NHỜ ÔNG TƠ
Ông Tơ se sợi chỉ hồng,
Sao không se giúp đôi lòng gần nhau.
Em bên giàn mướp, anh cau,
Một hàng rào nhỏ cách nhau mấy mùa.

[191] GÓI TÌNH TRONG LÁ
Lá trầu xanh mướt đầu giàn,
Anh xin một lá đem sang hỏi nàng.
Lá còn xanh, nghĩa còn vàng,
Có thương xin chớ để chàng đợi lâu.

[192] MÙA CHIM VỀ
Chim về đậu ngọn cau cao,
Báo mùa ấm áp tràn vào làng quê.
Em mà hẹn một đường về,
Anh xin dựng sẵn mái che trước thềm.

[193] ĐỢI MỘT TIẾNG VÂNG
Anh không xin bạc xin vàng,
Chỉ xin em một dịu dàng gật đầu.
Sông sâu rồi cũng có cầu,
Lòng thương gặp nghĩa, trước sau vẹn tròn.

[194] CÂU HÁT MÙA GẶT
Vụ mùa lúa chín đầy sân,
Anh đem câu hát ra gần bờ đê.
Em nghe xin chớ vội về,
Để anh còn hát một lời nên duyên.

[195] BẾN ĐỖ BÌNH YÊN
Thuyền dong muôn dặm xa khơi,
Cuối cùng vẫn muốn một nơi quay về.
Anh qua hết mấy mùa quê,
Vẫn mong bến đỗ có em đứng chờ.

[196] GẠO TRẮNG MUỐI TRẮNG
Gạo trắng nấu bữa cơm chiều,
Muối thêm chút mặn, thương nhiều thêm vui.
Nhà nghèo chẳng có ngọt bùi,
Nhưng anh có cả một đời vì em.

[197] LỜI HỨA BÊN HIÊN
Em ơi, mái rạ đơn sơ,
Có anh che nắng, có chờ cùng em.
Dẫu mai giông nổi trong đêm,
Hai người chung một mái thềm vẫn vui.

[198] SỚM MAI
Sớm mai giếng nước trong veo,
Anh ra gánh nước, em theo lối nhà.
Ước gì năm tháng trôi qua,
Vẫn cùng gánh nước, cùng pha ấm trà.

[199] MỘT CHỮ DUYÊN
Duyên đâu chẳng ở xa xôi,
Có khi là buổi chung ngồi trú mưa.
Có khi là một câu thưa,
Thành câu hẹn đến sau mùa tóc phai.

[200] TRĂM NĂM
Trăm năm là mấy mùa trăng,
Mà anh chỉ ước được bằng lòng em.
Một đời qua những nổi chìm,
Vẫn mong cuối bến con thuyền có đôi.
    </script>

    <script>
        let poems = [];
        let currentIndex = 0;
        let isDarkMode = false;
        let fontSizes = ['text-base sm:text-lg', 'text-lg sm:text-xl', 'text-xl sm:text-2xl'];
        let currentFontSizeIndex = 1; // Default to middle size
        let autoPlayInterval = null;
        let isAutoPlaying = false;

        // Trình phân tích văn bản tự động (Extract 226 poems from Raw Text)
        function extractData() {
            const rawText = document.getElementById('raw-data').textContent;
            const lines = rawText.split('\n');
            let currentCategory = "Thơ Giao Duyên";
            let currentPoem = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                // Giữ lại các khoảng ngắt đoạn (stanza breaks)
                if (line === '') {
                    if (currentPoem && currentPoem.content !== '' && !currentPoem.content.endsWith('\n\n')) {
                        currentPoem.content += '\n\n';
                    }
                    continue;
                }

                // Bỏ qua các dòng không liên quan
                if (line.startsWith('===') || line.match(/^[0-9]{2}–[0-9]{3}:/) || 
                    line.includes('MỤC LỤC') || line.includes('Biên soạn') || line.startsWith('LƯU Ý') || 
                    line.startsWith('PHẦN I') || line.startsWith('PHẦN II') || line.includes('Tổng hợp') || 
                    line.includes('- Tuyển tập') || line.includes('QUAN TRỌNG') || line.includes('TUYỂN TẬP') || 
                    line.includes('HẾT TUYỂN TẬP') || line.includes('--- HẾT ---') || 
                    line.includes('CÂU THƠ, CA DAO') || line.includes('Sưu tầm để đăng')) {
                    continue;
                }

                // Nhận dạng Category (Thư mục)
                let romanMatch = line.match(/^[IVX]+\.\s+(.+)$/);
                if (romanMatch) {
                    currentCategory = romanMatch[1]; continue;
                }
                let dashMatch = line.match(/^---\s*(.+?)\s*---$/);
                if (dashMatch) {
                    let cat = dashMatch[1].replace(/\s*\(\d+–\d+\)/g, '').replace(/\s*\(\d+-\d+\)/g, '').trim();
                    if (!cat.includes('HẾT')) currentCategory = cat;
                    continue;
                }
                if (line.startsWith('TẶNG THÊM:')) {
                    currentCategory = "TẶNG THÊM"; continue;
                }

                // Nhận dạng tiêu đề bài thơ (VD: "01. MẬN HỎI ĐÀO" hoặc "[001] THẤY HOA...")
                let oldMatch = line.match(/^(\d{2})\.\s*(.+)$/);
                let newMatch = line.match(/^\[(\d{3})\]\s*(.+)$/);
                let bonusMatch = (line === "TRÈO LÊN CÂY BƯỞI HÁI HOA" && currentCategory === "TẶNG THÊM") ? {1: "Bonus", 2: line} : null;
                
                let titleMatch = oldMatch || newMatch || (bonusMatch ? [null, bonusMatch[1], bonusMatch[2]] : null);

                if (titleMatch) {
                    // Lưu bài cũ trước khi mở bài mới
                    if (currentPoem) {
                        currentPoem.content = currentPoem.content.trim();
                        poems.push({...currentPoem});
                    }
                    currentPoem = {
                        id: titleMatch[1],
                        title: titleMatch[2],
                        category: currentCategory,
                        content: ""
                    };
                } else if (currentPoem) {
                    // Thêm dòng thơ
                    currentPoem.content += line + '\n';
                }
            }
            
            // Lưu bài cuối cùng
            if (currentPoem) {
                currentPoem.content = currentPoem.content.trim();
                poems.push({...currentPoem});
            }
        }

        // Khởi tạo
        function init() {
            // Chạy phân tích văn bản
            extractData();
            document.getElementById('poem-counter').textContent = `1/${poems.length}`;

            // Cấu hình Theme
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                isDarkMode = true;
                updateThemeIcon();
            }
            
            buildSidebar();
            renderPoem(currentIndex, true);
        }

        // Render bài thơ có animation mượt
        function renderPoem(index, skipAnim = false) {
            const container = document.getElementById('poem-container');
            const poem = poems[index];
            
            const updateContent = () => {
                document.getElementById('p-category').textContent = poem.category;
                
                // Tiền tố "Bài" chỉ áp dụng cho ID có số
                let idText = isNaN(poem.id) ? poem.id : `Bài ${poem.id}`;
                document.getElementById('p-id').textContent = idText;
                
                document.getElementById('p-title').textContent = poem.title;
                document.getElementById('poem-counter').textContent = `${index + 1}/${poems.length}`;
                
                // Xử lý xuống dòng: Giữ nguyên khoảng trống giữa các khổ
                const formatted = poem.content.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
                document.getElementById('p-content').innerHTML = formatted;
                
                updateSidebarActive();
                
                requestAnimationFrame(() => {
                    container.classList.remove('poem-hidden');
                    container.classList.add('poem-visible');
                });
            };

            if (skipAnim) {
                updateContent();
            } else {
                container.classList.remove('poem-visible');
                container.classList.add('poem-hidden');
                // Chờ CSS chuyển cảnh (0.3s)
                setTimeout(updateContent, 300);
            }
        }

        function nextPoem() {
            currentIndex = (currentIndex + 1) % poems.length;
            renderPoem(currentIndex);
            resetAutoPlayIfNeeded();
        }

        function prevPoem() {
            currentIndex = (currentIndex - 1 + poems.length) % poems.length;
            renderPoem(currentIndex);
            resetAutoPlayIfNeeded();
        }

        function randomPoem() {
            let newIndex;
            do { newIndex = Math.floor(Math.random() * poems.length); } 
            while (newIndex === currentIndex && poems.length > 1);
            currentIndex = newIndex;
            renderPoem(currentIndex);
            resetAutoPlayIfNeeded();
        }

        function goToPoem(index) {
            if(currentIndex === index) return;
            currentIndex = index;
            renderPoem(currentIndex);
            if(window.innerWidth < 640) toggleSidebar(); // Chỉ đóng ở mobile
            resetAutoPlayIfNeeded();
        }

        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            const btn = document.getElementById('btn-autoplay');
            const icon = document.getElementById('icon-autoplay');
            const indicator = document.getElementById('autoplay-indicator');

            if (isAutoPlaying) {
                btn.classList.add('text-l_accent', 'dark:text-d_accent', 'bg-black/5', 'dark:bg-white/10');
                icon.classList.remove('fa-clock');
                icon.classList.add('fa-pause');
                indicator.classList.remove('hidden');
                indicator.classList.add('flex');
                
                // Đổi bài mỗi 8 giây
                autoPlayInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % poems.length;
                    renderPoem(currentIndex);
                }, 8000);
                showToast("Tự động: BẬT");
            } else {
                btn.classList.remove('text-l_accent', 'dark:text-d_accent', 'bg-black/5', 'dark:bg-white/10');
                icon.classList.remove('fa-pause');
                icon.classList.add('fa-clock');
                indicator.classList.add('hidden');
                indicator.classList.remove('flex');
                
                clearInterval(autoPlayInterval);
                showToast("Tự động: TẮT");
            }
        }

        function resetAutoPlayIfNeeded() {
            if (isAutoPlaying) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % poems.length;
                    renderPoem(currentIndex);
                }, 8000);
            }
        }

        function copyPoem() {
            const poem = poems[currentIndex];
            const textToCopy = `${poem.title}\n\n${poem.content}\n\n---\nNguồn: ${poem.category} - ${isNaN(poem.id) ? '' : 'Bài '}${poem.id}`;
            
            const el = document.createElement('textarea');
            el.value = textToCopy;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            showToast("Đã chép vào khay nhớ tạm!");
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            }
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const btn = document.getElementById('theme-btn');
            if (isDarkMode) {
                btn.innerHTML = '<i class="fa-solid fa-sun text-sm"></i>';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-moon text-sm"></i>';
            }
        }

        function toggleFontSize() {
            const pContent = document.getElementById('p-content');
            const currentClasses = fontSizes[currentFontSizeIndex].split(' ');
            pContent.classList.remove(...currentClasses);
            
            currentFontSizeIndex = (currentFontSizeIndex + 1) % fontSizes.length;
            
            const newClasses = fontSizes[currentFontSizeIndex].split(' ');
            pContent.classList.add(...newClasses);
            
            let sizeName = currentFontSizeIndex === 0 ? 'Nhỏ' : (currentFontSizeIndex === 1 ? 'Vừa' : 'Lớn');
            showToast(`Cỡ chữ: ${sizeName}`);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.classList.add('toast-show');
            setTimeout(() => {
                toast.classList.remove('toast-show');
            }, 2000);
        }

        // Tạo mục lục DOM một lần để chống giật
        function buildSidebar() {
            const container = document.getElementById('poem-list-container');
            const frag = document.createDocumentFragment();
            
            poems.forEach((poem, index) => {
                const btn = document.createElement('button');
                btn.id = `sb-item-${index}`;
                btn.className = `w-full text-left p-3 mb-1.5 rounded-lg transition-colors flex items-start gap-3 
                                hover:bg-black/5 dark:hover:bg-white/5 border border-transparent`;
                btn.onclick = () => goToPoem(index);
                btn.setAttribute('data-search', `${poem.title.toLowerCase()} ${poem.id} ${poem.category.toLowerCase()}`);
                
                let idText = isNaN(poem.id) ? '*' : `#${poem.id}`;

                btn.innerHTML = `
                    <div class="text-xs font-bold text-l_subtext dark:text-d_subtext mt-1 opacity-60 w-8 text-center">${idText}</div>
                    <div class="flex-1">
                        <div class="font-sans font-medium text-l_text dark:text-d_text sb-title leading-snug">${poem.title}</div>
                        <div class="text-[0.65rem] text-l_subtext dark:text-d_subtext uppercase tracking-wider mt-1 opacity-80">${poem.category}</div>
                    </div>
                `;
                frag.appendChild(btn);
            });
            container.appendChild(frag);
        }

        function updateSidebarActive() {
            poems.forEach((_, index) => {
                const item = document.getElementById(`sb-item-${index}`);
                if(!item) return;
                
                const title = item.querySelector('.sb-title');
                
                if (index === currentIndex) {
                    item.classList.add('bg-black/5', 'dark:bg-white/10');
                    title.classList.add('text-l_accent', 'dark:text-d_accent', 'font-bold');
                    
                    // Cuộn nhẹ nhàng đến item active trong sidebar
                    if(item.scrollIntoViewIfNeeded) {
                         item.scrollIntoViewIfNeeded();
                    } else {
                         item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                } else {
                    item.classList.remove('bg-black/5', 'dark:bg-white/10');
                    title.classList.remove('text-l_accent', 'dark:text-d_accent', 'font-bold');
                }
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function filterPoems() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            poems.forEach((_, index) => {
                const item = document.getElementById(`sb-item-${index}`);
                if(!item) return;
                const searchData = item.getAttribute('data-search');
                item.style.display = searchData.includes(term) ? 'flex' : 'none';
            });
        }

        // Hỗ trợ dùng bàn phím máy tính để sang bài
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPoem();
            if (e.key === 'ArrowLeft') prevPoem();
            if (e.key === 'Escape') {
                const sidebar = document.getElementById('sidebar');
                if (!sidebar.classList.contains('translate-x-full')) toggleSidebar();
            }
        });

        // Bắt đầu
        window.onload = init;

    </script>
</body>
</html>
