<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMO Download</title>
    <style>
        :root {
            --bg: #eeeeeb;
            --surface: #f8f8f5;
            --surface-2: #ffffff;
            --ink: #111111;
            --muted: #64645f;
            --line: #c7c7c0;
            --line-dark: #1f1f1f;
            --accent: #ff6a1a;
            --accent-hover: #f05c0c;
            --danger: #c8321c;
            --success: #176b44;
            --shadow: 8px 8px 0 rgba(17, 17, 17, 0.08);
            --mono: "SFMono-Regular", Consolas, "Liberation Mono", "Courier New", monospace;
            --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        html {
            min-height: 100%;
            background:
                linear-gradient(to right, rgba(17, 17, 17, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(17, 17, 17, 0.06) 1px, transparent 1px),
                var(--bg);
            background-size: 72px 72px;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: var(--sans);
            text-rendering: geometricPrecision;
        }

        button,
        textarea,
        select {
            font: inherit;
            color: inherit;
        }

        button,
        select {
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.62;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .app {
            width: min(940px, calc(100vw - 28px));
            margin: 0 auto;
            padding: 32px 0 48px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 54px;
            border-bottom: 1px solid var(--line-dark);
            margin-bottom: 32px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border: 2px solid var(--line-dark);
            background: var(--accent);
            color: var(--ink);
        }

        .brand-text {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-text {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: right;
        }

        .hero {
            display: grid;
            gap: 14px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: clamp(44px, 10vw, 112px);
            line-height: 0.9;
            font-weight: 950;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .subtitle {
            max-width: 600px;
            margin: 0;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.5;
            font-weight: 800;
            text-transform: uppercase;
        }

        .download-box {
            border: 2px solid var(--line-dark);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .box-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 46px;
            padding: 0 14px;
            border-bottom: 1px solid var(--line-dark);
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .box-body {
            padding: 14px;
            display: grid;
            gap: 12px;
        }

        .input-shell {
            border: 1px solid var(--line-dark);
            background: var(--surface-2);
        }

        textarea {
            width: 100%;
            min-height: 130px;
            resize: vertical;
            border: 0;
            outline: 0;
            background: transparent;
            padding: 14px;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.55;
            font-weight: 800;
        }

        textarea::placeholder {
            color: #8d8d87;
        }

        .input-shell:focus-within,
        .select-shell:focus-within,
        .btn:focus-visible {
            outline: 0;
            box-shadow: 0 0 0 3px rgba(255, 106, 26, 0.24);
        }

        .detected {
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 9px;
            border: 1px solid var(--line);
            background: var(--surface-2);
            padding: 9px 11px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 900;
            overflow: hidden;
        }

        .detected.is-ready {
            color: var(--success);
            border-color: var(--success);
            background: #eff6ef;
        }

        .detected span:last-child {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .controls {
            display: grid;
            grid-template-columns: minmax(150px, 220px) 1fr;
            gap: 10px;
            align-items: stretch;
        }

        .select-shell {
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line-dark);
            background: var(--surface-2);
            padding: 0 10px;
        }

        select {
            width: 100%;
            height: 42px;
            border: 0;
            outline: 0;
            background: transparent;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .side-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--line-dark);
            background: var(--surface-2);
            padding: 0 14px;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            background: #ffffff;
            box-shadow: 4px 4px 0 rgba(17, 17, 17, 0.08);
        }

        .btn-primary {
            width: 100%;
            min-height: 54px;
            background: var(--accent);
            border-color: var(--line-dark);
            color: var(--ink);
            font-size: 13px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .notice {
            display: none;
            align-items: center;
            gap: 9px;
            min-height: 42px;
            border: 1px solid var(--danger);
            background: #fff4ed;
            color: var(--danger);
            padding: 10px 12px;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .notice.is-visible {
            display: flex;
        }

        .notice.is-success {
            border-color: var(--success);
            color: var(--success);
            background: #eff6ef;
        }

        .loader {
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            animation: spin 760ms linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 20px;
            border: 2px solid var(--line-dark);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .results.is-visible {
            display: block;
            animation: show 170ms ease both;
        }

        @keyframes show {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .video-info {
            display: grid;
            grid-template-columns: 170px minmax(0, 1fr);
            border-bottom: 1px solid var(--line-dark);
        }

        .thumb {
            min-height: 150px;
            border-right: 1px solid var(--line-dark);
            background: #e4e4df;
            display: grid;
            place-items: center;
            color: var(--muted);
            overflow: hidden;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .thumb img.has-image {
            display: block;
        }

        .video-meta {
            padding: 14px;
            min-width: 0;
        }

        .tag {
            display: inline-flex;
            min-height: 24px;
            align-items: center;
            border: 1px solid var(--line);
            background: var(--surface-2);
            padding: 0 7px;
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .video-title {
            margin: 12px 0 0;
            font-size: clamp(18px, 3vw, 28px);
            line-height: 1.12;
            font-weight: 900;
            overflow-wrap: anywhere;
        }

        .meta-line {
            margin: 8px 0 0;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.45;
            font-weight: 800;
        }

        .result-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 48px;
            padding: 0 14px;
            border-bottom: 1px solid var(--line-dark);
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .format-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            padding: 14px;
        }

        .format-card {
            display: grid;
            border: 1px solid var(--line-dark);
            background: var(--surface-2);
            min-height: 124px;
            transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
        }

        .format-card:hover {
            transform: translateY(-2px);
            background: #ffffff;
            box-shadow: 5px 5px 0 rgba(17, 17, 17, 0.09);
        }

        .format-label {
            display: grid;
            place-items: center;
            padding: 16px 12px;
            border-bottom: 1px solid var(--line-dark);
            text-align: center;
            font-size: 22px;
            line-height: 1;
            font-weight: 950;
            text-transform: uppercase;
        }

        .format-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr 44px;
        }

        .format-stat {
            min-width: 0;
            padding: 8px;
            border-right: 1px solid var(--line-dark);
            font-family: var(--mono);
        }

        .format-stat:last-child {
            border-right: 0;
            display: grid;
            place-items: center;
            font-size: 18px;
            font-weight: 900;
        }

        .format-stat b {
            display: block;
            font-size: 13px;
            font-weight: 900;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .format-stat span {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .empty {
            margin-top: 20px;
            border: 1px dashed var(--line-dark);
            background: var(--surface);
            padding: 28px 16px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
        }

        .icon {
            width: 17px;
            height: 17px;
            display: inline-grid;
            place-items: center;
            flex: 0 0 auto;
        }

        .icon svg {
            width: 100%;
            height: 100%;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 760px) {
            .app {
                width: min(100vw - 20px, 940px);
                padding: 20px 0 34px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
                padding-bottom: 12px;
                margin-bottom: 22px;
            }

            .status-text {
                text-align: left;
            }

            .controls,
            .video-info {
                grid-template-columns: 1fr;
            }

            .thumb {
                border-right: 0;
                border-bottom: 1px solid var(--line-dark);
            }

            .format-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .side-buttons {
                grid-template-columns: 1fr 1fr;
            }

            h1 {
                font-size: clamp(42px, 16vw, 72px);
            }

            .box-head,
            .result-head {
                align-items: flex-start;
                flex-direction: column;
                justify-content: center;
                padding: 10px 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 3v12"></path>
                            <path d="m7 10 5 5 5-5"></path>
                            <path d="M5 21h14"></path>
                        </svg>
                    </span>
                </div>
                <span class="brand-text">Video Downloader</span>
            </div>
            <div class="status-text" id="statusText">Sẵn sàng tải video</div>
        </header>

        <section class="hero">
            <h1>MMO DOWNLOAD</h1>
            <p class="subtitle">Dán link video, hệ thống tự nhận dạng, chọn chất lượng và tải xuống.</p>
        </section>

        <section class="download-box">
            <div class="box-head">
                <span>Nhập link video</span>
                <span id="modeLabel">Auto detect URL</span>
            </div>
            <form id="downloadForm" class="box-body">
                <div class="input-shell">
                    <textarea id="videoUrl" rows="5" placeholder="Dán link video hoặc đoạn văn có chứa link..."></textarea>
                </div>

                <div id="detectedBox" class="detected">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                    </span>
                    <span>Chưa nhận dạng link</span>
                </div>

                <div class="controls">
                    <label class="select-shell" for="qualitySelect">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 5h18"></path>
                                <path d="M7 12h10"></path>
                                <path d="M10 19h4"></path>
                            </svg>
                        </span>
                        <select id="qualitySelect">
                            <option value="all">Tất cả</option>
                            <option value="best">Tốt nhất</option>
                            <option value="1080">1080p</option>
                            <option value="720">720p</option>
                            <option value="480">480p</option>
                            <option value="audio">Audio</option>
                        </select>
                    </label>

                    <div class="side-buttons">
                        <button id="pasteBtn" class="btn" type="button">
                            <span class="icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M8 4h8"></path>
                                    <path d="M9 2h6v4H9z"></path>
                                    <path d="M16 4h2a2 2 0 0 1 2 2v4"></path>
                                    <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5"></path>
                                    <path d="M16 14v6"></path>
                                    <path d="M13 17h6"></path>
                                </svg>
                            </span>
                            Dán
                        </button>
                        <button id="clearBtn" class="btn" type="button">
                            <span class="icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 6h18"></path>
                                    <path d="M8 6V4h8v2"></path>
                                    <path d="M19 6l-1 14H6L5 6"></path>
                                    <path d="M10 11v5"></path>
                                    <path d="M14 11v5"></path>
                                </svg>
                            </span>
                            Xóa
                        </button>
                    </div>
                </div>

                <button id="downloadBtn" class="btn btn-primary" type="submit">
                    <span id="downloadIcon" class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M12 3v12"></path>
                            <path d="m7 10 5 5 5-5"></path>
                            <path d="M5 21h14"></path>
                        </svg>
                    </span>
                    <span id="downloadText">Tải video</span>
                    <span id="downloadLoader" class="loader" hidden></span>
                </button>

                <div id="notice" class="notice"></div>
            </form>
        </section>

        <section id="emptyState" class="empty">Kết quả tải sẽ hiện ở đây</section>

        <section id="results" class="results">
            <div class="video-info">
                <div class="thumb">
                    <img id="videoThumb" alt="">
                    <span class="icon" aria-hidden="true">
                        <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                            <rect width="18" height="14" x="3" y="5" rx="1"></rect>
                            <path d="m10 9 5 3-5 3z"></path>
                        </svg>
                    </span>
                </div>
                <div class="video-meta">
                    <span id="videoSource" class="tag">Source</span>
                    <h2 id="videoTitle" class="video-title line-clamp-2">Video</h2>
                    <p id="videoMeta" class="meta-line">Metadata</p>
                </div>
            </div>

            <div class="result-head">
                <span>Link tải</span>
                <span id="formatCount">0 định dạng</span>
            </div>

            <div id="formatGrid" class="format-grid"></div>
        </section>
    </main>

    <script>
        const API_BASE = 'https://gendownload.com';
        const REQUEST_TIMEOUT = 90000;

        const GenDownloadAPI = {
            async request(path, options = {}, timeoutMs = REQUEST_TIMEOUT) {
                const controller = new AbortController();
                const timer = window.setTimeout(() => controller.abort(), timeoutMs);

                try {
                    const response = await fetch(`${API_BASE}${path}`, {
                        method: options.method || 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(options.headers || {})
                        },
                        body: options.body ? JSON.stringify(options.body) : undefined,
                        signal: controller.signal
                    });

                    const contentType = response.headers.get('content-type') || '';
                    const payload = contentType.includes('application/json')
                        ? await response.json()
                        : await response.text();

                    if (!response.ok) {
                        const message = typeof payload === 'string'
                            ? payload
                            : payload.error || payload.message || `API lỗi ${response.status}`;
                        throw new Error(message);
                    }

                    return payload;
                } catch (error) {
                    if (error.name === 'AbortError') {
                        throw new Error('API phản hồi quá lâu. Thử lại sau vài giây.');
                    }
                    throw error;
                } finally {
                    window.clearTimeout(timer);
                }
            },

            extract(url) {
                return this.request('/api/extract', {
                    method: 'POST',
                    body: { url }
                });
            }
        };

        window.GenDownloadAPI = GenDownloadAPI;
        globalThis.GenDownloadAPI = GenDownloadAPI;

        const dom = {
            form: document.getElementById('downloadForm'),
            videoUrl: document.getElementById('videoUrl'),
            detectedBox: document.getElementById('detectedBox'),
            qualitySelect: document.getElementById('qualitySelect'),
            pasteBtn: document.getElementById('pasteBtn'),
            clearBtn: document.getElementById('clearBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
            downloadIcon: document.getElementById('downloadIcon'),
            downloadText: document.getElementById('downloadText'),
            downloadLoader: document.getElementById('downloadLoader'),
            notice: document.getElementById('notice'),
            statusText: document.getElementById('statusText'),
            emptyState: document.getElementById('emptyState'),
            results: document.getElementById('results'),
            videoThumb: document.getElementById('videoThumb'),
            videoSource: document.getElementById('videoSource'),
            videoTitle: document.getElementById('videoTitle'),
            videoMeta: document.getElementById('videoMeta'),
            formatCount: document.getElementById('formatCount'),
            formatGrid: document.getElementById('formatGrid')
        };

        const state = {
            detectedUrl: '',
            currentVideoData: null,
            busy: false
        };

        function init() {
            bindEvents();
            updateDetectedUrl();
        }

        function bindEvents() {
            dom.videoUrl.addEventListener('input', () => {
                clearNotice();
                updateDetectedUrl();
            });

            dom.videoUrl.addEventListener('paste', () => {
                window.setTimeout(updateDetectedUrl, 30);
            });

            dom.qualitySelect.addEventListener('change', () => {
                if (state.currentVideoData) renderVideo(state.currentVideoData);
            });

            dom.pasteBtn.addEventListener('click', pasteText);
            dom.clearBtn.addEventListener('click', clearAll);

            dom.form.addEventListener('submit', event => {
                event.preventDefault();
                downloadVideo();
            });
        }

        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                if (!text) return;
                dom.videoUrl.value = text;
                updateDetectedUrl(true);
                dom.videoUrl.focus();
            } catch (error) {
                showNotice('Trình duyệt chặn dán tự động. Hãy nhấn Ctrl+V vào ô nhập.', 'error');
                dom.videoUrl.focus();
            }
        }

        function clearAll() {
            dom.videoUrl.value = '';
            state.detectedUrl = '';
            state.currentVideoData = null;
            dom.results.classList.remove('is-visible');
            dom.emptyState.style.display = 'block';
            dom.emptyState.textContent = 'Kết quả tải sẽ hiện ở đây';
            dom.statusText.textContent = 'Sẵn sàng tải video';
            clearNotice();
            updateDetectedUrl();
            dom.videoUrl.focus();
        }

        function updateDetectedUrl(normalizeField = false) {
            const url = extractUrlFromText(dom.videoUrl.value);
            state.detectedUrl = isProbablyUrl(url) ? url : '';

            if (state.detectedUrl) {
                if (normalizeField) dom.videoUrl.value = state.detectedUrl;
                dom.detectedBox.classList.add('is-ready');
                dom.detectedBox.innerHTML = `${linkIcon()}<span>${escapeHtml(compactUrl(state.detectedUrl))}</span>`;
                dom.statusText.textContent = 'Đã nhận dạng link';
            } else {
                dom.detectedBox.classList.remove('is-ready');
                dom.detectedBox.innerHTML = `${linkIcon()}<span>Chưa nhận dạng link</span>`;
                dom.statusText.textContent = 'Sẵn sàng tải video';
            }
        }

        function extractUrlFromText(text) {
            const matches = String(text || '').match(/https?:\/\/[^\s"'<>]+/gi);
            return matches ? matches[0].replace(/[),.;]+$/, '') : String(text || '').trim();
        }

        async function downloadVideo() {
            if (state.busy) return;
            updateDetectedUrl(true);

            if (!state.detectedUrl) {
                showNotice('Chưa có link video hợp lệ.', 'error');
                return;
            }

            setBusy(true);
            clearNotice();
            dom.emptyState.style.display = 'none';
            dom.results.classList.remove('is-visible');
            dom.statusText.textContent = 'Đang lấy link tải...';

            try {
                const data = await GenDownloadAPI.extract(state.detectedUrl);
                if (!Array.isArray(data.formats) || data.formats.length === 0) {
                    throw new Error('Không có định dạng tải xuống cho link này.');
                }

                state.currentVideoData = data;
                renderVideo(data);
                dom.results.classList.add('is-visible');
                dom.statusText.textContent = 'Đã sẵn sàng tải';
            } catch (error) {
                dom.emptyState.style.display = 'block';
                dom.emptyState.textContent = 'Không tải được dữ liệu video';
                dom.statusText.textContent = 'Có lỗi khi tải';
                showNotice(error.message || 'Không tải được dữ liệu video.', 'error');
            } finally {
                setBusy(false);
            }
        }

        function renderVideo(data) {
            const formats = filterAndSortFormats(data.formats || [], dom.qualitySelect.value);
            dom.videoTitle.textContent = data.title || 'Video không xác định';
            dom.videoSource.textContent = data.source || 'Nguồn';
            dom.videoMeta.textContent = [data.author, formatViews(data.views), formatDuration(data.duration)].filter(Boolean).join(' • ') || 'Không có thông tin thêm';
            dom.formatCount.textContent = `${formats.length} định dạng`;

            if (data.thumbnail) {
                dom.videoThumb.src = data.thumbnail;
                dom.videoThumb.classList.add('has-image');
            } else {
                dom.videoThumb.removeAttribute('src');
                dom.videoThumb.classList.remove('has-image');
            }

            dom.formatGrid.innerHTML = formats.length
                ? formats.map(format => createFormatCard(format)).join('')
                : '<div class="empty">Không có định dạng phù hợp</div>';
        }

        function createFormatCard(format) {
            const isAudio = isAudioFormat(format);
            const label = escapeHtml(format.label || (isAudio ? 'Audio' : 'Video'));
            const ext = escapeHtml(String(format.ext || (isAudio ? 'm4a' : 'mp4')).toUpperCase());
            const size = escapeHtml(format.filesize ? formatBytes(format.filesize) : 'AUTO');
            const type = escapeHtml(format.type || (isAudio ? 'audio' : 'video'));
            const url = escapeAttribute(format.url || '#');

            return `
                <a class="format-card" href="${url}" target="_blank" rel="noopener" download>
                    <div class="format-label">${label}</div>
                    <div class="format-bottom">
                        <div class="format-stat"><b>${ext}</b><span>File</span></div>
                        <div class="format-stat"><b>${size}</b><span>${type}</span></div>
                        <div class="format-stat">↓</div>
                    </div>
                </a>
            `;
        }

        function filterAndSortFormats(formats, quality) {
            const sortedFormats = formats
                .filter(format => Boolean(format && format.url))
                .filter(format => qualityMatches(format, quality))
                .sort((a, b) => {
                    const audioDiff = Number(isAudioFormat(a)) - Number(isAudioFormat(b));
                    if (audioDiff !== 0) return audioDiff;
                    return getHeight(b) - getHeight(a);
                });

            if (quality === 'best') {
                const bestVideo = sortedFormats.find(format => !isAudioFormat(format));
                return bestVideo ? [bestVideo] : sortedFormats.slice(0, 1);
            }

            return sortedFormats;
        }

        function qualityMatches(format, quality) {
            if (!quality || quality === 'all' || quality === 'best') return true;
            if (quality === 'audio') return isAudioFormat(format);
            if (isAudioFormat(format)) return false;

            const maxHeight = Number(quality);
            const height = getHeight(format);
            return !height || height <= maxHeight;
        }

        function getHeight(format) {
            const haystack = `${format.label || ''} ${format.quality || ''} ${format.height || ''}`;
            const match = haystack.match(/(\d{3,4})\s*p?/i);
            return match ? Number(match[1]) : Number(format.height || 0);
        }

        function isAudioFormat(format) {
            const ext = String(format.ext || '').toLowerCase();
            const type = String(format.type || '').toLowerCase();
            const label = String(format.label || '').toLowerCase();
            return type.includes('audio') || ['mp3', 'm4a', 'aac', 'opus', 'wav'].includes(ext) || label.includes('audio');
        }

        function setBusy(busy) {
            state.busy = busy;
            dom.downloadBtn.disabled = busy;
            dom.pasteBtn.disabled = busy;
            dom.clearBtn.disabled = busy;
            dom.downloadIcon.hidden = busy;
            dom.downloadLoader.hidden = !busy;
            dom.downloadText.textContent = busy ? 'Đang tải link' : 'Tải video';
        }

        function showNotice(message, type) {
            dom.notice.className = type === 'success' ? 'notice is-visible is-success' : 'notice is-visible';
            dom.notice.innerHTML = `${type === 'success' ? checkIcon() : alertIcon()}<span>${escapeHtml(message)}</span>`;
        }

        function clearNotice() {
            dom.notice.className = 'notice';
            dom.notice.innerHTML = '';
        }

        function compactUrl(value) {
            try {
                const url = new URL(value);
                return `${url.hostname}${url.pathname}`.replace(/\/$/, '');
            } catch {
                return value;
            }
        }

        function isProbablyUrl(value) {
            try {
                const url = new URL(value);
                return ['http:', 'https:'].includes(url.protocol);
            } catch {
                return false;
            }
        }

        function formatBytes(bytes) {
            const value = Number(bytes);
            if (!Number.isFinite(value) || value <= 0) return 'AUTO';
            const units = ['B', 'KB', 'MB', 'GB'];
            let size = value;
            let index = 0;
            while (size >= 1024 && index < units.length - 1) {
                size /= 1024;
                index += 1;
            }
            return `${size.toFixed(size >= 10 || index === 0 ? 0 : 1)} ${units[index]}`;
        }

        function formatDuration(seconds) {
            const value = Number(seconds);
            if (!Number.isFinite(value) || value <= 0) return '';
            const hours = Math.floor(value / 3600);
            const minutes = Math.floor((value % 3600) / 60);
            const secs = Math.floor(value % 60);
            return hours > 0
                ? `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`
                : `${minutes}:${String(secs).padStart(2, '0')}`;
        }

        function formatViews(views) {
            const value = Number(views);
            if (!Number.isFinite(value) || value <= 0) return '';
            return `${new Intl.NumberFormat('vi-VN', { notation: 'compact', maximumFractionDigits: 1 }).format(value)} lượt xem`;
        }

        function linkIcon() {
            return '<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></span>';
        }

        function alertIcon() {
            return '<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg></span>';
        }

        function checkIcon() {
            return '<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"></path></svg></span>';
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeAttribute(value) {
            return escapeHtml(value).replace(/`/g, '&#096;');
        }

        init();
    </script>
</body>
</html>
