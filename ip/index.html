<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Premium Diary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100;0,200;0,300;0,400;1,100;1,200&display=swap');

        :root {
            --bg-pure: #020202;
            --bg-surface: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #666666;
            --border-light: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-pure); color: var(--text-main);
            font-family: 'Futura', 'Jost', sans-serif;
            margin: 0; height: 100dvh; /* Dùng dvh tối ưu cho Safari Mobile */
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* Lớp hạt Noise - Sang trọng */
        .noise-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 1; opacity: 0.035; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- Nút Menu --- */
        .top-nav {
            display: flex; justify-content: flex-end; align-items: center;
            padding: env(safe-area-inset-top, 1rem) 1.5rem 0.5rem 1.5rem; 
            position: relative; z-index: 10;
        }
        .menu-btn {
            background: none; border: none; display: flex; flex-direction: column; gap: 6px;
            cursor: pointer; padding: 10px 0 10px 20px;
        }
        .menu-btn span {
            display: block; width: 30px; height: 1px; background-color: var(--text-main);
            transition: width 0.4s var(--ease-out-expo);
        }
        .menu-btn span:nth-child(2) { width: 18px; align-self: flex-end; }
        .menu-btn:active span:nth-child(2) { width: 30px; }

        /* --- Bộ Đếm Ngược --- */
        #countdown-section {
            display: flex; flex-direction: column; justify-content: center;
            flex: 0 0 42%; padding: 0 1.5rem; position: relative; z-index: 5;
            animation: fadeUp 1.5s var(--ease-out-expo) forwards;
        }
        .time-row { display: flex; justify-content: space-between; width: 100%; margin-bottom: 1.5rem; position: relative; }
        .time-row::after {
            content: ''; position: absolute; bottom: -0.75rem; left: 5%; right: 5%; height: 1px;
            background: var(--border-light);
        }
        .time-row:last-child::after { display: none; }
        .time-box { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .time-val { font-size: clamp(4rem, 16vw, 7rem); line-height: 0.9; font-weight: 100; letter-spacing: -0.02em; }
        .time-label { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.4em; color: var(--text-muted); margin-top: 0.5rem; }

        /* --- Khu vực Nhập liệu --- */
        #input-section {
            flex: 1; display: flex; flex-direction: column; padding: 1.5rem;
            background: linear-gradient(to top, rgba(8,8,8,1) 0%, transparent 100%);
            border-top: 1px solid var(--border-light); position: relative; z-index: 5;
            animation: fadeUp 1.5s var(--ease-out-expo) 0.2s forwards; opacity: 0;
        }

        .weather-tags { display: flex; gap: 0.8rem; justify-content: center; margin-bottom: 1.5rem; }
        .weather-tag {
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.2em;
            color: var(--text-muted); padding: 0.6rem 1rem;
            border: 1px solid transparent; border-radius: 99px;
            transition: all 0.4s var(--ease-out-expo); cursor: pointer;
        }
        .weather-tag svg { width: 14px; height: 14px; opacity: 0.4; transition: 0.4s; }
        .weather-tag.active { color: var(--bg-pure); background: var(--text-main); transform: translateY(-2px); }
        .weather-tag.active svg { opacity: 1; stroke: var(--bg-pure); }

        .note-area { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        textarea {
            width: 100%; flex: 1; background: transparent; border: none;
            color: var(--text-main); font-family: 'Futura', 'Jost', sans-serif;
            font-size: 1.1rem; font-weight: 200; line-height: 1.7;
            outline: none; resize: none; text-align: center; padding: 0.5rem 0;
        }
        textarea::placeholder { color: #3a3a3a; font-weight: 200; font-style: italic; transition: color 0.3s; }
        textarea:focus::placeholder { color: transparent; }

        .action-row { display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 1rem); }
        .save-btn {
            display: inline-flex; align-items: center; gap: 8px; background: none; border: none;
            color: var(--text-main); font-family: 'Futura', 'Jost', sans-serif;
            font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.3em;
            cursor: pointer; padding: 15px; opacity: 0.7; transition: all 0.3s ease;
        }
        .save-btn svg { width: 15px; height: 15px; transition: transform 0.4s var(--ease-spring); }
        .save-btn:active { opacity: 1; }
        .save-btn:active svg { transform: translateX(6px); }

        /* --- SIDEBAR LỊCH SỬ --- */
        #sidebar-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        #sidebar-overlay.open { opacity: 1; pointer-events: auto; }

        #sidebar {
            position: fixed; top: 0; right: 0; bottom: 0; width: 88%; max-width: 400px;
            background: rgba(12, 12, 12, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border-light); z-index: 50;
            transform: translateX(100%); transition: transform 0.6s var(--ease-out-expo);
            display: flex; flex-direction: column;
        }
        #sidebar.open { transform: translateX(0); }

        .sidebar-header {
            padding: env(safe-area-inset-top, 2rem) 1.5rem 1.5rem 1.5rem;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light);
        }
        .close-btn {
            background: none; border: none; color: var(--text-muted); font-size: 0.55rem;
            text-transform: uppercase; letter-spacing: 0.25em; cursor: pointer; padding: 10px;
        }

        .history-list { flex: 1; overflow-y: auto; padding: 0 1.5rem calc(env(safe-area-inset-bottom, 0px) + 2rem) 1.5rem; }
        .history-list::-webkit-scrollbar { display: none; }

        .history-item {
            padding: 2rem 0; border-bottom: 1px solid var(--border-light);
            opacity: 0; transform: translateY(15px); transition: all 0.5s var(--ease-out-expo);
        }
        #sidebar.open .history-item { opacity: 1; transform: translateY(0); }

        .history-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .history-date { font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
        .history-tag-display {
            display: flex; align-items: center; gap: 6px; font-size: 0.5rem; letter-spacing: 0.15em; text-transform: uppercase;
            color: var(--text-muted); border: 1px solid var(--border-light); padding: 0.2rem 0.6rem; border-radius: 99px;
        }
        .history-tag-display svg { width: 10px; height: 10px; }

        /* Rút gọn chữ thông minh */
        .text-content { font-size: 1rem; font-weight: 200; line-height: 1.7; color: rgba(255, 255, 255, 0.9); white-space: pre-wrap; }
        .text-content.clamped { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .toggle-more-btn {
            background: none; border: none; padding: 0; margin-top: 8px; color: var(--text-muted);
            font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.2em; cursor: pointer; text-decoration: underline; text-underline-offset: 4px;
        }

        .empty-history { text-align: center; margin-top: 5rem; font-size: 0.7rem; letter-spacing: 0.15em; color: var(--text-muted); font-style: italic; }

        /* --- CUSTOM CONFIRM MODAL (Ghi đè) --- */
        #confirm-modal-wrapper {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #confirm-modal-wrapper.show { opacity: 1; pointer-events: auto; }
        
        .confirm-box {
            background: var(--bg-surface); border: 1px solid var(--border-light);
            padding: 2.5rem 2rem; width: 85%; max-width: 340px; text-align: center;
            transform: scale(0.95) translateY(10px); transition: transform 0.4s var(--ease-spring);
        }
        #confirm-modal-wrapper.show .confirm-box { transform: scale(1) translateY(0); }
        
        .confirm-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.25em; color: var(--text-muted); margin-bottom: 1.5rem; }
        .confirm-desc { font-size: 1.05rem; font-weight: 200; line-height: 1.6; margin-bottom: 2rem; color: #ddd; }
        
        .confirm-actions { display: flex; gap: 1rem; }
        .confirm-btn {
            flex: 1; padding: 0.8rem; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.2em;
            background: transparent; border: 1px solid var(--border-light); color: var(--text-main); cursor: pointer; transition: 0.3s;
        }
        .confirm-btn.primary { background: var(--text-main); color: var(--bg-pure); border-color: var(--text-main); }
        .confirm-btn:active { transform: scale(0.95); }

        /* --- TOAST --- */
        #toast {
            position: fixed; bottom: calc(env(safe-area-inset-bottom, 2rem) + 4rem); left: 50%;
            transform: translate(-50%, 20px) scale(0.9);
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text-main);
            padding: 0.6rem 1.5rem; border-radius: 99px; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.2em;
            display: flex; align-items: center; gap: 8px; opacity: 0; pointer-events: none; transition: all 0.5s var(--ease-spring); z-index: 100;
        }
        #toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
        #toast svg { width: 12px; height: 12px; stroke: #fff; }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <div class="top-nav">
        <button class="menu-btn" onclick="toggleSidebar()">
            <span></span>
            <span></span>
        </button>
    </div>

    <!-- Countdown -->
    <div id="countdown-section">
        <div class="time-row">
            <div class="time-box"><span id="days" class="time-val">00</span><span class="time-label">Ngày</span></div>
            <div class="time-box"><span id="hours" class="time-val">00</span><span class="time-label">Giờ</span></div>
        </div>
        <div class="time-row">
            <div class="time-box"><span id="mins" class="time-val">00</span><span class="time-label">Phút</span></div>
            <div class="time-box"><span id="secs" class="time-val">00</span><span class="time-label">Giây</span></div>
        </div>
    </div>

    <!-- Input Section -->
    <div id="input-section">
        <div class="weather-tags">
            <div class="weather-tag active" onclick="selectWeather('Nắng', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                Nắng
            </div>
            <div class="weather-tag" onclick="selectWeather('Mưa', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>

            </div>
            <div class="weather-tag" onclick="selectWeather('Mây', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                Mây
            </div>
        </div>

        <div class="note-area">
            <textarea id="note-input" placeholder="Lưu lại cảm xúc lúc này..."></textarea>
            
            <div class="action-row">
                <button class="save-btn" onclick="requestSave()">
                    <span>Lưu Ký Ức</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Sidebar Lịch sử -->
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar">
        <div class="sidebar-header">
            <span class="text-[0.55rem] tracking-widest uppercase text-muted">Lịch sử</span>
            <button class="close-btn" onclick="toggleSidebar()">Đóng</button>
        </div>
        <div id="history-list" class="history-list"></div>
    </div>

    <!-- Custom Confirm Modal (Cảnh báo ghi đè) -->
    <div id="confirm-modal-wrapper">
        <div class="confirm-box">
            <div class="confirm-title">Cập nhật Ký ức</div>
            <div class="confirm-desc">Sếp đã lưu lại một khoảnh khắc trong ngày hôm nay rồi.<br><br>Sếp có muốn ghi đè lên bản cũ không?</div>
            <div class="confirm-actions">
                <button class="confirm-btn" onclick="closeConfirmModal()">Hủy bỏ</button>
                <button class="confirm-btn primary" onclick="executeSave(true)">Cập nhật</button>
            </div>
        </div>
    </div>

    <!-- Toast Thông báo -->
    <div id="toast">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toast-text">Đã lưu</span>
    </div>

    <script>
        const icons = {
            'Nắng': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>',
            'Mưa': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>',
            'Mây': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>'
        };

        const STORAGE_KEY = 'lv_smart_diary';
        let appData = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const TARGET_DATE = new Date(2026, 10, 10, 0, 0, 0).getTime(); 

        if (!appData) { appData = { history: [] }; saveData(); }

        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }

        // Logic check ngày (Tránh 1 ngày lưu nhiều lần)
        function isSameDay(date1, date2) {
            const d1 = new Date(date1);
            const d2 = new Date(date2);
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        // --- KHỞI TẠO (Check xem hôm nay đã viết chưa) ---
        function checkTodayStatus() {
            const now = new Date().getTime();
            const todayIndex = appData.history.findIndex(item => isSameDay(item.timestamp, now));
            
            const textarea = document.getElementById('note-input');
            if (todayIndex !== -1) {
                // Đã có bản ghi -> đổi câu chào
                textarea.placeholder = "Sếp đã ghi chép hôm nay. Viết để cập nhật lại...";
            } else {
                textarea.placeholder = "Lưu lại cảm xúc lúc này...";
            }
        }
        checkTodayStatus(); // Gọi lúc mở app

        // --- ĐẾM NGƯỢC ---
        function updateCountdown() {
            const now = new Date().getTime();
            const diff = TARGET_DATE - now;

            if (diff <= 0) {
                document.getElementById('days').innerText = "00"; document.getElementById('hours').innerText = "00";
                document.getElementById('mins').innerText = "00"; document.getElementById('secs').innerText = "00";
                return;
            }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days.toString().padStart(2, '0');
            document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('mins').innerText = mins.toString().padStart(2, '0');
            document.getElementById('secs').innerText = secs.toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000); updateCountdown();

        // --- THỜI TIẾT ---
        let currentWeather = 'Nắng'; 
        function selectWeather(weather, element) {
            currentWeather = weather;
            document.querySelectorAll('.weather-tag').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
        }

        // --- LOGIC LƯU THÔNG MINH (OVERWRITE) ---
        let pendingSaveIndex = -1;
        let pendingSaveData = null;

        function requestSave() {
            const input = document.getElementById('note-input');
            const text = input.value.trim();
            const now = new Date().getTime();

            // Tìm xem trong lịch sử có bài nào của "Hôm nay" không
            pendingSaveIndex = appData.history.findIndex(item => isSameDay(item.timestamp, now));

            pendingSaveData = { timestamp: now, text: text, weather: currentWeather };

            if (pendingSaveIndex !== -1) {
                // Nếu CÓ bản ghi hôm nay -> Bật Modal hỏi
                document.getElementById('confirm-modal-wrapper').classList.add('show');
            } else {
                // Nếu CHƯA CÓ -> Lưu luôn (Thêm mới)
                executeSave(false);
            }
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal-wrapper').classList.remove('show');
            pendingSaveIndex = -1;
            pendingSaveData = null;
        }

        function executeSave(isOverwrite) {
            if (isOverwrite && pendingSaveIndex !== -1) {
                // Ghi đè lên bản cũ (cập nhật text, thời tiết, lấy giờ mới nhất)
                appData.history[pendingSaveIndex] = pendingSaveData;
                showToast("Đã cập nhật bản ghi");
            } else {
                // Thêm mới vào đầu mảng
                appData.history.unshift(pendingSaveData);
                showToast("Đã lưu Ký ức mới");
            }
            
            saveData();
            renderHistory();
            checkTodayStatus(); // Cập nhật lại placeholder
            
            document.getElementById('note-input').value = '';
            
            // Nếu có mở modal thì đóng lại
            closeConfirmModal();
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = message;
            
            clearTimeout(toastTimeout);
            toast.classList.remove('show');
            void toast.offsetWidth; 
            toast.classList.add('show');
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // --- SIDEBAR LỊCH SỬ ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const historyList = document.getElementById('history-list');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function formatDate(timestamp) {
            const d = new Date(timestamp);
            const day = d.getDate().toString().padStart(2, '0');
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        window.toggleText = function(index, btnElement) {
            const textElement = document.getElementById(`text-content-${index}`);
            if (textElement.classList.contains('clamped')) {
                textElement.classList.remove('clamped');
                btnElement.innerText = "Ẩn bớt";
            } else {
                textElement.classList.add('clamped');
                btnElement.innerText = "Hiện thêm";
            }
        };

        function renderHistory() {
            historyList.innerHTML = '';
            if (!appData.history || appData.history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">Chưa có bản ghi nào.</div>';
                return;
            }

            appData.history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.style.transitionDelay = `${index * 0.05}s`; 
                
                let textHTML = '';
                if (item.text) {
                    const isLong = item.text.length > 100 || item.text.split('\n').length > 3;
                    if (isLong) {
                        textHTML = `
                            <div id="text-content-${index}" class="text-content clamped">${item.text}</div>
                            <button class="toggle-more-btn" onclick="toggleText(${index}, this)">Đọc thêm</button>
                        `;
                    } else {
                        textHTML = `<div class="text-content">${item.text}</div>`;
                    }
                }

                div.innerHTML = `
                    <div class="history-meta">
                        <span class="history-date">${formatDate(item.timestamp)}</span>
                        <div class="history-tag-display">
                            ${icons[item.weather]}
                            <span>${item.weather}</span>
                        </div>
                    </div>
                    ${textHTML}
                `;
                historyList.appendChild(div);
            });
        }
        renderHistory();
    </script>
</body>
</html>
