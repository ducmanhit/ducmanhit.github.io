<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ sửa Link</title>
    <link rel="icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            /* Subtle Mesh Gradient Background */
            background-image:
                radial-gradient(at 0% 0%, hsla(212, 45%, 98%, 1) 0px, transparent 50%),
                radial-gradient(at 98% 99%, hsla(289, 60%, 98%, 1) 0px, transparent 50%);
        }
        .gradient-text {
            background: linear-gradient(to right, #c026d3, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
        #result-container {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        #toast {
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Main Card -->
    <div class="bg-white/80 backdrop-blur-3xl border border-gray-200/90 p-6 sm:p-8 rounded-3xl shadow-2xl shadow-violet-900/5 w-full max-w-2xl">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold gradient-text">Công Cụ Sửa Link Pro</h1>
            <p class="text-gray-500 mt-2 text-sm sm:text-base">Dán link của bạn để tự động sửa lỗi định dạng.</p>
        </div>

        <!-- Input Area -->
        <div class="flex flex-col gap-3">
            <textarea id="linkInput" 
                      class="bg-gray-50 text-gray-800 border-2 border-gray-200 rounded-xl w-full p-4 h-32 resize-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500 focus:bg-white transition-all duration-300 placeholder-gray-400"
                      placeholder="Dán hoặc gõ link vào đây..."></textarea>
            
            <button onclick="clearInput()" class="bg-violet-600 text-white font-semibold py-3 px-6 rounded-xl hover:bg-violet-700 active:bg-violet-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-violet-500 transition-all duration-200 flex items-center justify-center gap-2 transform active:scale-[0.98]">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Xoá Nội Dung
            </button>
        </div>

        <!-- Result Container -->
        <div id="result-container" class="mt-6 opacity-0 transform translate-y-2 pointer-events-none">
            <label class="text-sm font-medium text-gray-500 mb-2 block">Link đã sửa:</label>
            <div class="bg-gray-100 border border-gray-200 rounded-xl flex items-center justify-between p-3 sm:p-4 gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="bg-white p-2 rounded-lg border border-gray-200 flex-shrink-0">
                       <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-violet-500"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72"></path></svg>
                    </div>
                    <a id="result-link" href="#" target="_blank" rel="noopener noreferrer" class="text-violet-600 hover:text-violet-800 font-medium transition truncate" title="Click để mở link">
                        ...
                    </a>
                </div>
                <button id="copyButton" onclick="copyToClipboard()" class="bg-gray-200 text-gray-700 font-semibold py-2 px-3 sm:px-4 rounded-lg hover:bg-gray-300 active:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-violet-500 transition-all duration-200 flex-shrink-0 transform active:scale-[0.98]">
                    Sao chép
                </button>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-0 right-0 md:bottom-5 md:right-5 bg-gray-900 text-white py-2 px-5 rounded-lg shadow-lg flex items-center gap-3 opacity-0 transform translate-y-10">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-green-400"><path d="M20 6 9 17l-5-5"></path></svg>
        <span>Đã sao chép!</span>
    </div>

    <script>
        // Lấy các phần tử DOM một lần để tối ưu hiệu suất
        const linkInput = document.getElementById('linkInput');
        const resultContainer = document.getElementById('result-container');
        const resultLink = document.getElementById('result-link');
        const toast = document.getElementById('toast');

        // Hàm xử lý chính khi người dùng nhập liệu
        const handleInput = () => {
            const rawLink = linkInput.value.trim();

            if (rawLink === '') {
                hideResult();
                return;
            }

            // Xóa các ký tự không hợp lệ
            const cleanedLink = rawLink.replace(/[\[\]\(\)\s\{\}]/g, '');

            // Cập nhật và hiển thị kết quả
            updateResult(cleanedLink);
            showResult();
        };

        // Gắn sự kiện vào ô nhập liệu
        linkInput.addEventListener('input', handleInput);

        const updateResult = (link) => {
            resultLink.href = link;
            resultLink.textContent = link;
            resultLink.title = `Mở ${link} trong tab mới`;
        };

        const showResult = () => {
            resultContainer.style.opacity = '1';
            resultContainer.style.transform = 'translateY(0)';
            resultContainer.style.pointerEvents = 'auto';
        };
        
        const hideResult = () => {
            resultContainer.style.opacity = '0';
            resultContainer.style.transform = 'translateY(8px)';
            resultContainer.style.pointerEvents = 'none';
        };

        // Hàm xóa nội dung và ẩn kết quả
        const clearInput = () => {
            linkInput.value = '';
            hideResult();
            linkInput.focus(); // Tự động trỏ chuột về ô nhập liệu
        };

        // Hàm sao chép link vào clipboard
        const copyToClipboard = () => {
            if (!navigator.clipboard) {
                alert("Trình duyệt của bạn không hỗ trợ chức năng này.");
                return;
            }

            navigator.clipboard.writeText(resultLink.href).then(() => {
                showToast();
            }).catch(err => {
                console.error('Không thể sao chép: ', err);
                alert('Sao chép thất bại!');
            });
        };
        
        // Hàm hiển thị thông báo "Đã sao chép"
        const showToast = () => {
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';
            
            // Tự động ẩn thông báo sau 2.5 giây
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(40px)';
            }, 2500);
        };
    </script>

</body>
</html>
