<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Phần Trăm</title>
    <link rel="icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* --- CORE STYLES --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Nền xám nhạt, nhẹ nhàng, không gradient */
            margin: 0; padding: 0;
            height: 100vh;
            width: 100vw;
            color: #1d1d1f;
            display: flex; flex-direction: column;
            justify-content: center; /* Căn giữa dọc */
            font-size: 16px; 
            overflow: hidden;
        }

        /* HOME BUTTON */
        .glass-btn-home {
            position: fixed; top: 24px; left: 24px; z-index: 50;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 10px 20px; 
            border-radius: 99px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            text-decoration: none; color: #1d1d1f; font-size: 1rem; font-weight: 600;
        }
        .glass-btn-home:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
        }

        /* MAIN CONTAINER */
        .main-container {
            width: 100%; max-width: 1280px; 
            margin: 0 auto;
            padding: 0 40px; 
            display: flex; flex-direction: column; gap: 30px;
            z-index: 10;
        }

        /* HEADER */
        .header-section {
            text-align: center;
        }
        .header-title { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; color: #111827; }
        .header-subtitle { font-size: 1rem; color: #6b7280; font-weight: 500; margin-top: 5px; }

        /* GRID LAYOUT - Tối ưu cho 4 card */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 24px;
        }

        /* CARD STYLES */
        .calc-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            padding: 24px 28px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex; flex-direction: column; justify-content: center;
        }
        .calc-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-color: #d1d5db;
        }

        /* INPUTS */
        .crystal-input {
            background: #f9fafb; border: 1px solid #e5e7eb;
            color: #111827; border-radius: 14px; 
            transition: all 0.2s; 
            font-size: 1.15rem; 
            font-weight: 600;
            width: 100%; padding: 0 16px;
            height: 52px; 
        }
        .crystal-input:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); 
            outline: none;
        }

        /* RESULT BOX */
        .result-wrapper {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            height: 52px; 
            gap: 12px;
        }
        .result-display { 
            font-weight: 700; color: #059669; font-size: 1.4rem; 
            flex: 1; text-align: right; white-space: nowrap; 
        }

        /* LABELS & ICONS */
        .card-title { font-size: 1.1rem; font-weight: 700; color: #374151; }
        .input-label {
            font-size: 0.75rem; font-weight: 700; 
            text-transform: uppercase; letter-spacing: 0.05em;
            color: #6b7280; margin-bottom: 6px; display: block;
        }
        .op-symbol { color: #9ca3af; font-size: 0.9rem; font-weight: 600; padding-bottom: 8px; }

        /* BUTTONS */
        .btn-copy-sm {
            padding: 8px; border-radius: 10px; color: #9ca3af; cursor: pointer;
            transition: all 0.2s; opacity: 0; transform: scale(0.9);
            background: transparent; border: none;
        }
        .btn-copy-sm.show { opacity: 1; transform: scale(1); }
        .btn-copy-sm:hover { background: #e0e7ff; color: #4f46e5; }

        /* FOOTER */
        .footer-actions { text-align: center; }
        .reset-all-btn {
            background: white; border: 1px solid #fecaca;
            color: #ef4444; padding: 12px 32px; border-radius: 99px;
            font-weight: 600; font-size: 1rem;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.1);
            transition: all 0.2s; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .reset-all-btn:hover { background: #fef2f2; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.15); }

        /* TOAST */
        .toast {
            position: fixed; top: 30px; right: 30px;
            background: #ffffff; 
            padding: 16px 24px; border-radius: 16px; border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            transform: translateX(150%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 100; font-weight: 600; display: flex; align-items: center; gap: 12px;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            body { overflow-y: auto; height: auto; }
            .main-container { padding: 80px 20px 40px; }
            .calc-grid { display: flex; flex-direction: column; }
            .glass-btn-home { top: 16px; left: 16px; padding: 8px 16px; }
        }
    </style>
</head>
<body>

    <!-- HOME BUTTON -->
    <a href="https://ducmanh.io.vn/" class="glass-btn-home">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
        <span>Trang chủ</span>
    </a>

    <!-- MAIN CONTAINER -->
    <div class="main-container">
        
        <!-- Header -->
        <div class="header-section">
            <h1 class="header-title">Máy Tính Phần Trăm</h1>
            <p class="header-subtitle">Công cụ tính toán nhanh gọn & chính xác</p>
        </div>

        <!-- GRID LAYOUT -->
        <div class="calc-grid">
            
            <!-- 1. X% of Y -->
            <div class="calc-card">
                <div class="flex items-center gap-3 mb-4">
                    <div class="p-2 bg-green-100 rounded-xl"><i data-lucide="calculator" class="w-6 h-6 text-green-600"></i></div>
                    <h3 class="card-title">Tính giá trị %</h3>
                </div>
                <div class="flex items-end gap-3">
                    <div class="flex-1">
                        <label class="input-label">Phần trăm</label>
                        <input type="number" id="c1-percent" class="crystal-input" placeholder="20" oninput="calc1()">
                    </div>
                    <span class="op-symbol">% của</span>
                    <div class="flex-1">
                        <label class="input-label">Giá trị</label>
                        <input type="number" id="c1-value" class="crystal-input" placeholder="500" oninput="calc1()">
                    </div>
                </div>
                <div class="mt-4 flex items-center justify-between">
                    <span class="text-sm font-semibold text-gray-500">Kết quả:</span>
                    <div class="result-wrapper w-2/3">
                        <span id="c1-result" class="result-display"></span>
                        <button id="c1-copy" onclick="copyResult('c1-result')" class="btn-copy-sm"><i data-lucide="copy" class="w-5 h-5"></i></button>
                    </div>
                </div>
            </div>

            <!-- 2. Find Percentage -->
            <div class="calc-card">
                <div class="flex items-center gap-3 mb-4">
                    <div class="p-2 bg-blue-100 rounded-xl"><i data-lucide="percent" class="w-6 h-6 text-blue-600"></i></div>
                    <h3 class="card-title">Tìm phần trăm</h3>
                </div>
                <div class="flex items-end gap-3">
                    <div class="flex-1">
                        <label class="input-label">Giá trị con</label>
                        <input type="number" id="c2-part" class="crystal-input" placeholder="25" oninput="calc2()">
                    </div>
                    <span class="op-symbol">là</span>
                    <div class="flex-1">
                        <label class="input-label">Tổng số</label>
                        <input type="number" id="c2-total" class="crystal-input" placeholder="100" oninput="calc2()">
                    </div>
                </div>
                <div class="mt-4 flex items-center justify-between">
                    <span class="text-sm font-semibold text-gray-500">Kết quả:</span>
                    <div class="result-wrapper w-2/3">
                        <span id="c2-result" class="result-display"></span>
                        <button id="c2-copy" onclick="copyResult('c2-result')" class="btn-copy-sm"><i data-lucide="copy" class="w-5 h-5"></i></button>
                    </div>
                </div>
            </div>

            <!-- 3. Find Whole -->
            <div class="calc-card">
                <div class="flex items-center gap-3 mb-4">
                    <div class="p-2 bg-purple-100 rounded-xl"><i data-lucide="search" class="w-6 h-6 text-purple-600"></i></div>
                    <h3 class="card-title">Tìm số gốc</h3>
                </div>
                <div class="flex items-end gap-3">
                    <div class="flex-1">
                        <label class="input-label">Giá trị</label>
                        <input type="number" id="c3-val" class="crystal-input" placeholder="50" oninput="calc3()">
                    </div>
                    <span class="op-symbol">là</span>
                    <div class="flex-1">
                        <label class="input-label">Phần trăm</label>
                        <input type="number" id="c3-percent" class="crystal-input" placeholder="20" oninput="calc3()">
                    </div>
                </div>
                <div class="mt-4 flex items-center justify-between">
                    <span class="text-sm font-semibold text-gray-500">Kết quả:</span>
                    <div class="result-wrapper w-2/3">
                        <span id="c3-result" class="result-display"></span>
                        <button id="c3-copy" onclick="copyResult('c3-result')" class="btn-copy-sm"><i data-lucide="copy" class="w-5 h-5"></i></button>
                    </div>
                </div>
            </div>

            <!-- 4. Change -->
            <div class="calc-card">
                <div class="flex items-center gap-3 mb-4">
                    <div class="p-2 bg-orange-100 rounded-xl"><i data-lucide="trending-up" class="w-6 h-6 text-orange-600"></i></div>
                    <h3 class="card-title">Tính % Tăng/Giảm</h3>
                </div>
                <div class="flex items-end gap-3">
                    <div class="flex-1">
                        <label class="input-label">Từ số</label>
                        <input type="number" id="c4-from" class="crystal-input" placeholder="Gốc" oninput="calc4()">
                    </div>
                    <span class="op-symbol"><i data-lucide="arrow-right" class="w-5 h-5"></i></span>
                    <div class="flex-1">
                        <label class="input-label">Đến số</label>
                        <input type="number" id="c4-to" class="crystal-input" placeholder="Mới" oninput="calc4()">
                    </div>
                </div>
                <div class="mt-4 flex items-center justify-between">
                    <span class="text-sm font-semibold text-gray-500">Thay đổi:</span>
                    <div class="result-wrapper w-2/3">
                        <span id="c4-result" class="result-display"></span>
                        <button id="c4-copy" onclick="copyResult('c4-result')" class="btn-copy-sm"><i data-lucide="copy" class="w-5 h-5"></i></button>
                    </div>
                </div>
            </div>

        </div>

        <!-- FOOTER ACTIONS -->
        <div class="footer-actions mt-4">
            <button onclick="clearAll()" class="reset-all-btn">
                <i data-lucide="trash-2" class="w-5 h-5"></i> Xóa tất cả
            </button>
        </div>

    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">
        <div class="bg-green-100 p-2 rounded-full"><i data-lucide="check" class="w-5 h-5 text-green-600"></i></div>
        <span class="text-gray-800">Đã sao chép vào bộ nhớ tạm!</span>
    </div>

    <script>
        // Khởi tạo icon Lucide
        lucide.createIcons();

        // Định dạng số (thêm dấu phẩy)
        function formatNum(num) {
            return new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(num);
        }

        // Xóa toàn bộ dữ liệu
        function clearAll() {
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => input.value = '');
            
            const results = document.querySelectorAll('.result-display');
            results.forEach(res => {
                res.innerText = '';
                res.className = 'result-display'; // Reset màu sắc (đặc biệt cho card 4)
            });
            
            document.querySelectorAll('.btn-copy-sm').forEach(btn => btn.classList.remove('show'));
        }

        // Hiển thị/Ẩn nút Copy
        function toggleCopyBtn(resId, hasResult) {
            const btnId = resId.replace('result', 'copy');
            const btn = document.getElementById(btnId);
            if(btn) {
                if(hasResult) btn.classList.add('show');
                else btn.classList.remove('show');
            }
        }

        // Copy kết quả
        function copyResult(elementId) {
            const text = document.getElementById(elementId).innerText;
            if(!text) return; 

            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                const t = document.getElementById('toast');
                t.style.transform = 'translateX(0)';
                setTimeout(() => t.style.transform = 'translateX(150%)', 2500);
            } catch (err) {
                console.error('Không thể copy', err);
            }
            document.body.removeChild(textArea);
        }

        // Card 1: X% of Y
        function calc1() {
            const p = parseFloat(document.getElementById('c1-percent').value);
            const v = parseFloat(document.getElementById('c1-value').value);
            const res = document.getElementById('c1-result');
            if(!isNaN(p) && !isNaN(v)) {
                res.innerText = formatNum((p / 100) * v);
                toggleCopyBtn('c1-result', true);
            } else {
                res.innerText = "";
                toggleCopyBtn('c1-result', false);
            }
        }

        // Card 2: Find Percentage
        function calc2() {
            const x = parseFloat(document.getElementById('c2-part').value);
            const y = parseFloat(document.getElementById('c2-total').value);
            const res = document.getElementById('c2-result');
            if(!isNaN(x) && !isNaN(y) && y !== 0) {
                res.innerText = formatNum((x / y) * 100) + "%";
                toggleCopyBtn('c2-result', true);
            } else {
                res.innerText = "";
                toggleCopyBtn('c2-result', false);
            }
        }

        // Card 3: Find Whole
        function calc3() {
            const x = parseFloat(document.getElementById('c3-val').value);
            const p = parseFloat(document.getElementById('c3-percent').value);
            const res = document.getElementById('c3-result');
            if(!isNaN(x) && !isNaN(p) && p !== 0) {
                res.innerText = formatNum(x / (p / 100));
                toggleCopyBtn('c3-result', true);
            } else {
                res.innerText = "";
                toggleCopyBtn('c3-result', false);
            }
        }

        // Card 4: Change %
        function calc4() {
            const f = parseFloat(document.getElementById('c4-from').value);
            const t = parseFloat(document.getElementById('c4-to').value);
            const res = document.getElementById('c4-result');
            if(!isNaN(f) && !isNaN(t) && f !== 0) {
                const change = ((t - f) / f) * 100;
                const sign = change > 0 ? "+" : "";
                const colorClass = change > 0 ? "text-green-600" : (change < 0 ? "text-red-500" : "text-gray-600");
                res.className = "result-display " + colorClass;
                res.innerText = sign + formatNum(change) + "%";
                toggleCopyBtn('c4-result', true);
            } else {
                res.innerText = "";
                res.className = "result-display";
                toggleCopyBtn('c4-result', false);
            }
        }
    </script>
</body>
</html>
