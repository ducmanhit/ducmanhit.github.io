<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc Mã QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HTML5-QRCode Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        /* --- CORE STYLES (MATCHING CRYSTAL OS THEME) --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f2f2f7;
            margin: 0; padding: 0;
            min-height: 100vh;
            color: #1d1d1f;
            overflow-x: hidden;
        }

        #fluid-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            filter: blur(80px) saturate(1.2); 
            opacity: 0.6; pointer-events: none;
        }

        /* HOME BUTTON STYLE */
        .glass-btn-home {
            position: fixed; top: 24px; left: 24px; z-index: 50;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 6px; padding-right: 18px; 
            border-radius: 99px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-decoration: none;
            color: #1d1d1f;
        }
        .glass-btn-home:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border-color: rgba(255, 255, 255, 0.9);
        }
        .home-icon-bg {
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            display: flex; align-items: center; justify-content: center;
            transition: background 0.3s;
        }
        .glass-btn-home:hover .home-icon-bg { background: rgba(255, 255, 255, 1); }

        /* GLASS PANEL STYLES */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.05),
                inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            position: relative; overflow: hidden;
            transition: all 0.3s ease;
        }

        .glass-noise {
            position: absolute; inset: 0; opacity: 0.3; pointer-events: none; mix-blend-mode: overlay; z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .content-layer { position: relative; z-index: 10; }

        /* BUTTONS */
        .primary-btn { 
            background: #1d1d1f; color: white; border: 1px solid transparent; font-weight: 600; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .primary-btn:hover { 
            background: #000; 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); 
            transform: translateY(-2px); 
        }

        .crystal-btn {
            background: rgba(255, 255, 255, 0.5); 
            border: 1px solid rgba(0, 0, 0, 0.05); 
            color: #1d1d1f;
            transition: all 0.3s; 
            backdrop-filter: blur(10px);
        }
        .crystal-btn:hover { 
            background: white; 
            border-color: rgba(0, 0, 0, 0.1); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transform: translateY(-1px);
        }

        /* DELETE BUTTON (RED) */
        .delete-btn {
            background: rgba(254, 226, 226, 0.5); /* Red-100 with opacity */
            color: #ef4444; /* Red-500 */
            border: 1px solid rgba(252, 165, 165, 0.2);
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .delete-btn:hover {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #dc2626; /* Red-600 */
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
        }

        /* TABS */
        .segmented-control {
            background: rgba(118, 118, 128, 0.12);
            padding: 4px; border-radius: 99px; display: flex; position: relative;
        }
        .segment-btn {
            flex: 1; padding: 8px 16px; border-radius: 99px; 
            font-size: 13px; font-weight: 600; color: #1d1d1f; 
            z-index: 2; transition: color 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .segment-indicator {
            position: absolute; top: 4px; left: 4px; bottom: 4px; width: calc(50% - 4px);
            background: white; border-radius: 99px; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 1;
        }

        /* UPLOAD ZONE */
        .upload-zone {
            border: 2px dashed rgba(0,0,0,0.1); border-radius: 24px;
            transition: all 0.3s ease; background: rgba(255,255,255,0.2);
            position: relative; overflow: hidden;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #007aff; background: rgba(0, 122, 255, 0.05);
            transform: scale(1.01);
        }
        
        /* IMAGE PREVIEW IN FILE MODE */
        #file-preview-container {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.03);
            border-radius: 24px;
            overflow: hidden;
            padding: 20px;
        }
        #file-preview-img {
            max-width: 100%; max-height: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        /* SCANNER AREA */
        .camera-container {
            position: relative; width: 100%; height: 100%;
            background: rgba(0,0,0,0.05); border-radius: 20px; overflow: hidden;
        }
        #reader { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #reader video { object-fit: cover; border-radius: 20px; width: 100% !important; height: 100% !important; }

        #camera-placeholder {
            position: absolute; inset: 0; z-index: 50;
            background: #f3f4f6; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 20px;
        }

        /* RESULT AREA */
        .result-box {
            background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.6);
            border-radius: 20px; min-height: 140px;
            font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.6;
        }

        /* TOAST */
        .toast {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); 
            padding: 12px 20px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999; display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px;
        }
        .toast.show { transform: translateX(0); }
        
        @media (max-width: 768px) {
            .glass-btn-home { top: 16px; left: 16px; padding-right: 14px; font-size: 0.8rem; }
            .home-icon-bg { width: 28px; height: 28px; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-8">

    <canvas id="fluid-canvas"></canvas>

    <!-- NAVIGATION HOME BUTTON -->
    <a href="https://ducmanh.io.vn/" class="glass-btn-home group">
        <div class="home-icon-bg">
            <i data-lucide="arrow-left" class="w-4 h-4 text-gray-700 group-hover:text-black transition-colors"></i>
        </div>
        <span class="font-medium text-gray-600 group-hover:text-gray-900 transition-colors">Trang chủ</span>
    </a>

    <!-- LAYOUT -->
    <div class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-6 relative z-10 pt-10 md:pt-0">
        
        <!-- HEADER (Mobile) -->
        <div class="lg:hidden col-span-1 text-center mb-2">
            <h1 class="text-xl font-semibold text-gray-900">Crystal Scanner</h1>
        </div>

        <!-- LEFT PANEL: INPUT (7 Cols) -->
        <div class="glass-panel col-span-1 lg:col-span-7 p-6 flex flex-col gap-6">
            <div class="glass-noise"></div>
            <div class="content-layer h-full flex flex-col">
                
                <!-- Tab Switcher -->
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i data-lucide="scan-line" class="w-5 h-5 text-blue-600"></i>
                        Nguồn Quét
                    </h2>
                    <div class="segmented-control w-64">
                        <div class="segment-indicator" id="tab-indicator"></div>
                        <button class="segment-btn" onclick="setMode('camera')"><i data-lucide="camera" class="w-4 h-4"></i> Camera</button>
                        <button class="segment-btn" onclick="setMode('file')"><i data-lucide="image" class="w-4 h-4"></i> File Ảnh</button>
                    </div>
                </div>

                <!-- Main Display Area -->
                <div class="flex-1 relative min-h-[400px] bg-white/30 rounded-[24px] border border-white/50 shadow-inner flex flex-col items-center justify-center overflow-hidden group">
                    
                    <!-- CAMERA MODE -->
                    <div id="camera-view" class="absolute inset-0 w-full h-full flex items-center justify-center transition-all duration-500 ease-out p-2">
                        <div class="camera-container" id="camera-container">
                            <div id="reader"></div>
                            <!-- Placeholder Overlay -->
                            <div id="camera-placeholder">
                                <div class="w-16 h-16 bg-gray-200/50 rounded-full flex items-center justify-center mb-4">
                                    <i data-lucide="camera-off" class="w-8 h-8"></i>
                                </div>
                                <span class="text-sm font-medium text-gray-500">Camera chưa được kích hoạt</span>
                                <button onclick="startCamera()" class="mt-4 primary-btn px-6 py-2 rounded-full text-sm">Bật Camera</button>
                            </div>
                        </div>
                    </div>

                    <!-- FILE MODE -->
                    <div id="file-view" class="absolute inset-0 w-full h-full bg-white/80 backdrop-blur-sm z-20 transition-all duration-500 ease-out translate-x-full opacity-0 p-4">
                        
                        <!-- 1. Upload Zone (Default) -->
                        <div id="upload-zone" class="upload-zone w-full h-full flex flex-col items-center justify-center gap-4 cursor-pointer" 
                             onclick="document.getElementById('qr-input-file').click()"
                             ondragover="event.preventDefault(); this.classList.add('dragover');"
                             ondragleave="this.classList.remove('dragover');"
                             ondrop="handleDrop(event)">
                            <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center shadow-sm">
                                <i data-lucide="upload-cloud" class="w-10 h-10 text-blue-500"></i>
                            </div>
                            <div class="text-center">
                                <h3 class="text-lg font-bold text-gray-800">Kéo thả ảnh vào đây</h3>
                                <p class="text-sm text-gray-500 mt-1">hoặc nhấn để chọn file từ máy</p>
                            </div>
                            <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="handleFile(this.files[0])">
                        </div>

                        <!-- 2. Image Preview (Hidden until file selected) -->
                        <div id="file-preview-container" class="hidden">
                            <img id="file-preview-img" src="" alt="QR Code Preview">
                        </div>

                    </div>

                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: RESULT (5 Cols) -->
        <div class="glass-panel col-span-1 lg:col-span-5 p-6 flex flex-col h-full min-h-[400px]">
            <div class="glass-noise"></div>
            <div class="content-layer flex-1 flex flex-col gap-4">
                
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i data-lucide="text-cursor-input" class="w-5 h-5 text-green-600"></i>
                    Kết Quả
                </h2>

                <!-- Result Content -->
                <div class="flex-1 relative">
                    <!-- Empty State -->
                    <div id="result-empty" class="absolute inset-0 flex flex-col items-center justify-center text-center opacity-100 transition-opacity duration-300">
                        <i data-lucide="qr-code" class="w-16 h-16 text-gray-300 mb-4"></i>
                        <p class="text-gray-400 font-medium">Chưa có mã nào được quét</p>
                        <p class="text-xs text-gray-400 mt-1">Kết quả sẽ hiện ở đây</p>
                    </div>

                    <!-- Content State -->
                    <div id="result-content" class="absolute inset-0 flex flex-col gap-4 opacity-0 pointer-events-none transition-opacity duration-300">
                        <textarea readonly id="scan-result-text" class="result-box w-full flex-1 p-4 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all"></textarea>
                        
                        <!-- Metadata badge -->
                        <div id="result-type-badge" class="hidden self-start px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full uppercase tracking-wider">
                            TEXT
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div id="action-buttons" class="flex flex-col gap-3 opacity-50 pointer-events-none transition-all duration-300">
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="copyResult()" class="crystal-btn py-3 rounded-xl font-medium flex items-center justify-center gap-2 hover:text-blue-600">
                            <i data-lucide="copy" class="w-4 h-4"></i> Sao chép
                        </button>
                        <a id="btn-open-link" href="#" target="_blank" class="hidden primary-btn py-3 rounded-xl font-medium flex items-center justify-center gap-2">
                            <i data-lucide="external-link" class="w-4 h-4"></i> Mở Link
                        </a>
                    </div>
                    
                    <!-- Download Buttons (Hidden initially) -->
                    <div id="download-group" class="grid grid-cols-2 gap-3 opacity-0 transition-opacity duration-500">
                        <button onclick="downloadResult('txt')" class="crystal-btn py-3 rounded-xl font-medium flex items-center justify-center gap-2 hover:text-green-600">
                            <i data-lucide="file-text" class="w-4 h-4"></i> Tải .TXT
                        </button>
                        <button onclick="downloadResult('json')" class="crystal-btn py-3 rounded-xl font-medium flex items-center justify-center gap-2 hover:text-purple-600">
                            <i data-lucide="file-json" class="w-4 h-4"></i> Tải .JSON
                        </button>
                    </div>

                    <!-- Delete Button (Always visible when result is present) -->
                    <button onclick="clearResult()" class="delete-btn w-full py-3.5 rounded-xl flex items-center justify-center gap-2 mt-1">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Xóa kết quả
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">
        <div class="bg-green-100 p-1 rounded-full"><i data-lucide="check" class="w-3 h-3 text-green-600"></i></div>
        <span id="toast-msg">Thông báo mới</span>
    </div>

    <script>
        lucide.createIcons();

        // --- BACKGROUND ANIMATION ---
        const canvas = document.getElementById('fluid-canvas');
        const ctxBg = canvas.getContext('2d');
        let width, height, orbs = [];
        const colors = [{r:0,g:122,b:255}, {r:175,g:82,b:222}, {r:255,g:45,b:85}, {r:50,g:173,b:230}];

        function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
        class Orb {
            constructor() { this.init(); }
            init() { 
                this.radius = Math.random()*150+120; this.x = Math.random()*width; this.y = Math.random()*height; 
                this.vx = (Math.random()-0.5)*0.5; this.vy = (Math.random()-0.5)*0.5; 
                this.color = colors[Math.floor(Math.random()*colors.length)]; 
            }
            update() { 
                this.x+=this.vx; this.y+=this.vy; 
                if(this.x<-200||this.x>width+200) this.vx*=-1; if(this.y<-200||this.y>height+200) this.vy*=-1; 
            }
            draw(ctx) { 
                const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.radius);
                g.addColorStop(0,`rgba(${this.color.r},${this.color.g},${this.color.b},0.35)`); 
                g.addColorStop(1,`rgba(${this.color.r},${this.color.g},${this.color.b},0)`); 
                ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fillStyle=g; 
                ctx.globalCompositeOperation='source-over'; ctx.fill(); 
            }
        }
        function initBackground() { resize(); orbs=[]; for(let i=0;i<6;i++) orbs.push(new Orb()); loop(); }
        function loop() { ctxBg.clearRect(0,0,width,height); orbs.forEach(o=>{o.update();o.draw(ctxBg)}); requestAnimationFrame(loop); }
        window.addEventListener('resize', ()=>{resize(); initBackground();}); initBackground();

        // --- SCANNER LOGIC ---
        let html5QrCode;
        let isCameraRunning = false;

        function setMode(mode) {
            const camView = document.getElementById('camera-view');
            const fileView = document.getElementById('file-view');
            const indicator = document.getElementById('tab-indicator');

            if(mode === 'camera') {
                indicator.style.transform = 'translateX(0)';
                camView.style.transform = 'translateX(0)'; camView.style.opacity = '1';
                fileView.style.transform = 'translateX(100%)'; fileView.style.opacity = '0';
                fileView.style.pointerEvents = 'none';
            } else {
                indicator.style.transform = 'translateX(100%)';
                camView.style.transform = 'translateX(-100%)'; camView.style.opacity = '0';
                fileView.style.transform = 'translateX(0)'; fileView.style.opacity = '1';
                fileView.style.pointerEvents = 'auto';
                if(isCameraRunning) stopCamera();
            }
        }

        async function startCamera() {
            if(isCameraRunning) return;
            try {
                if(!html5QrCode) html5QrCode = new Html5Qrcode("reader");
                
                const placeholder = document.getElementById('camera-placeholder');
                if (placeholder) placeholder.style.display = 'none';
                
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText, decodedResult) => {
                        handleScanSuccess(decodedText);
                    },
                    (errorMessage) => { }
                );
                isCameraRunning = true;
                showToast("Đã bật Camera", "camera");
            } catch (err) {
                const errorMessage = err ? err.toString() : "";
                if (errorMessage.includes("NotFoundError") || errorMessage.includes("NotAllowedError") || errorMessage.includes("PermissionDeniedError")) {
                    console.log("Camera not found or permission denied. Switching to UI fallback.");
                } else {
                    console.error("Camera Error:", err);
                }
                showCameraError();
            }
        }

        function showCameraError() {
            let placeholder = document.getElementById('camera-placeholder');
            
            if (!placeholder) {
                const container = document.getElementById('camera-container');
                if (container) {
                    placeholder = document.createElement('div');
                    placeholder.id = 'camera-placeholder';
                    placeholder.className = 'absolute inset-0 z-50 bg-gray-100 flex flex-col items-center justify-center rounded-[20px]';
                    container.appendChild(placeholder);
                }
            }

            if(placeholder) {
                placeholder.style.display = 'flex';
                placeholder.innerHTML = `
                    <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mb-4">
                        <i data-lucide="video-off" class="w-8 h-8 text-red-400"></i>
                    </div>
                    <span class="text-sm font-medium text-gray-500 mb-1">Không Tìm Thấy Camera</span>
                    <span class="text-xs text-gray-400 text-center px-4 mb-4">Vui lòng kiểm tra quyền truy cập hoặc kết nối thiết bị.</span>
                    <button onclick="setMode('file')" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2.5 rounded-full text-sm font-bold shadow-lg shadow-green-500/20 transition-all flex items-center gap-2">
                        <i data-lucide="image" class="w-4 h-4"></i>
                        Chuyển Sang Chế Độ File
                    </button>
                    <button onclick="startCamera()" class="mt-3 text-xs text-blue-500 hover:underline">Thử lại</button>
                `;
                lucide.createIcons();
            }
        }

        async function stopCamera() {
            if(html5QrCode && isCameraRunning) {
                try {
                    await html5QrCode.stop();
                    isCameraRunning = false;
                    const placeholder = document.getElementById('camera-placeholder');
                    if(placeholder) {
                        placeholder.style.display = 'flex';
                        placeholder.innerHTML = `
                            <div class="w-16 h-16 bg-gray-200/50 rounded-full flex items-center justify-center mb-4">
                                <i data-lucide="camera-off" class="w-8 h-8"></i>
                            </div>
                            <span class="text-sm font-medium">Camera chưa được kích hoạt</span>
                            <button onclick="startCamera()" class="mt-4 primary-btn px-6 py-2 rounded-full text-sm">Bật Camera</button>
                        `;
                        lucide.createIcons();
                    }
                } catch(e) { console.log(e); }
            }
        }

        // --- FILE HANDLING ---
        function handleDrop(e) {
            e.preventDefault();
            e.target.classList.remove('dragover');
            if(e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        }

        async function handleFile(file) {
            if(!file) return;
            
            // 1. SHOW IMAGE PREVIEW
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('file-preview-img').src = e.target.result;
                document.getElementById('upload-zone').classList.add('hidden');
                document.getElementById('file-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);

            // 2. SCAN
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            if(isCameraRunning) {
                await stopCamera();
            }

            try {
                const result = await html5QrCode.scanFile(file, true);
                handleScanSuccess(result);
            } catch (err) {
                console.log(err);
                showToast("Không tìm thấy mã QR trong ảnh!", "alert-circle");
                // Optional: Reset view if failed?
                // resetFileView(); 
            }
        }

        function resetFileView() {
            document.getElementById('upload-zone').classList.remove('hidden');
            document.getElementById('file-preview-container').classList.add('hidden');
            document.getElementById('file-preview-img').src = "";
            document.getElementById('qr-input-file').value = ""; // Clear input
        }

        // --- RESULT HANDLING ---
        function handleScanSuccess(text) {
            const emptyState = document.getElementById('result-empty');
            const contentState = document.getElementById('result-content');
            const actions = document.getElementById('action-buttons');
            const resultText = document.getElementById('scan-result-text');
            const badge = document.getElementById('result-type-badge');
            const btnLink = document.getElementById('btn-open-link');
            const downloadGroup = document.getElementById('download-group');

            resultText.value = text;

            const isUrl = /^(http|https):\/\/[^ "]+$/.test(text);
            if(isUrl) {
                badge.innerText = "WEBSITE URL";
                badge.classList.remove('hidden');
                btnLink.href = text;
                btnLink.classList.remove('hidden');
            } else {
                badge.innerText = "TEXT";
                badge.classList.remove('hidden');
                btnLink.classList.add('hidden');
            }

            emptyState.style.opacity = '0';
            contentState.style.opacity = '1';
            contentState.style.pointerEvents = 'auto';
            actions.style.opacity = '1';
            actions.style.pointerEvents = 'auto';
            
            // Show Downloads
            downloadGroup.style.opacity = '1';
            downloadGroup.style.pointerEvents = 'auto';

            showToast("Quét thành công!", "check-circle");
        }

        function clearResult() {
            // 1. Clear Result UI
            document.getElementById('scan-result-text').value = "";
            document.getElementById('result-empty').style.opacity = '1';
            
            const content = document.getElementById('result-content');
            content.style.opacity = '0'; content.style.pointerEvents = 'none';
            
            const actions = document.getElementById('action-buttons');
            actions.style.opacity = '0.5'; actions.style.pointerEvents = 'none';
            
            // Hide Downloads
            document.getElementById('download-group').style.opacity = '0';
            document.getElementById('download-group').style.pointerEvents = 'none';
            
            document.getElementById('btn-open-link').classList.add('hidden');

            // 2. Reset File View to allow new upload
            resetFileView();
        }

        function copyResult() {
            const text = document.getElementById('scan-result-text');
            text.select();
            document.execCommand('copy');
            showToast("Đã sao chép nội dung!", "copy");
        }

        function downloadResult(type) {
            const content = document.getElementById('scan-result-text').value;
            if(!content) return;

            let blob, filename;
            if (type === 'json') {
                const data = { scanned_content: content, timestamp: new Date().toISOString(), type: 'Crystal_Scanner_Result' };
                blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                filename = `scan-result-${Date.now()}.json`;
            } else {
                blob = new Blob([content], { type: 'text/plain' });
                filename = `scan-result-${Date.now()}.txt`;
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast(`Đã tải xuống .${type.toUpperCase()}`, "download");
        }

        function showToast(msg, iconName) {
            const t = document.getElementById('toast');
            t.innerHTML = `<div class="bg-blue-100 p-1 rounded-full"><i data-lucide="${iconName}" class="w-4 h-4 text-blue-600"></i></div><span>${msg}</span>`;
            lucide.createIcons();
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // --- INITIALIZATION ---
        setMode('camera'); 
        window.onload = function() {
             startCamera();
        };
    </script>
</body>
</html>
