<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coppy & Save </title>
    <link rel="icon" href="favicon.ico">
    <style>
        /* --- Google Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        /* --- Bảng màu: Giao diện 3D Glass (Light Theme) --- */
        :root {
            --background-color: #e4e9f2;
            --glass-bg: rgba(240, 245, 255, 0.5);
            --glass-shadow-light: rgba(255, 255, 255, 0.9);
            --glass-shadow-dark: rgba(163, 177, 198, 0.6);
            --text-color: #394257;
            --text-color-light: #6e788c;
            --primary-color: #007aff;
            --danger-color: #ff3b30;
            --success-color: #34c759;
        }

        /* --- Thiết lập chung --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            background-color: var(--background-color);
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* --- Main Container - 3D Glass Effect --- */
        .main-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            padding: 40px;
            background: var(--glass-bg);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 
                10px 10px 20px var(--glass-shadow-dark),
                -10px -10px 20px var(--glass-shadow-light),
                inset 1px 1px 0px var(--glass-shadow-light),
                inset -1px -1px 0px var(--glass-shadow-dark);
            text-align: center;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header h1 span {
            color: var(--primary-color);
        }

        .header p {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-color-light);
            margin-bottom: 30px;
        }

        /* --- Khu vực dán nội dung - Inset Effect --- */
        #paste-box {
            width: 100%;
            min-height: 320px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            background: var(--background-color);
            box-shadow: 
                inset 5px 5px 10px var(--glass-shadow-dark),
                inset -5px -5px 10px var(--glass-shadow-light);
        }
        
        #paste-box.has-content {
             border: 2px solid var(--primary-color);
        }

        #placeholder-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #placeholder-content svg {
            width: 50px;
            height: 50px;
            color: var(--text-color-light);
        }

        #placeholder-content span {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-color-light);
        }

        #output-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #output-content img {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 10px;
            animation: fadeIn 0.5s ease;
        }

        #output-content pre {
            width: 100%;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
            font-size: 1rem;
            padding: 15px;
            background: transparent;
            border-radius: 10px;
            animation: fadeIn 0.5s ease;
            color: var(--text-color);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- Cụm nút hành động - 3D Glass --- */
        .action-buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            height: auto;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 170px;
            height: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: var(--glass-bg);
            color: var(--text-color-light);
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            box-shadow: 
                5px 5px 10px var(--glass-shadow-dark),
                -5px -5px 10px var(--glass-shadow-light);
        }

        .btn.hidden {
            transform: scale(0);
            opacity: 0;
        }
        
        .btn:not(.hidden) {
            transform: scale(1);
            opacity: 1;
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.5 !important;
            box-shadow: none;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 
                inset 3px 3px 6px var(--glass-shadow-dark),
                inset -3px -3px 6px var(--glass-shadow-light);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            transition: color 0.2s ease;
        }

        #download-btn:hover:not(:disabled) { color: var(--primary-color); }
        #send-telegram-btn:hover:not(:disabled) { color: #229ED9; }
        #clear-btn:hover:not(:disabled) { color: var(--danger-color); }

        /* --- Notification --- */
        #notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translate(-50%, 200%);
            padding: 15px 25px;
            border-radius: 12px;
            background: var(--text-color);
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.4s ease;
            z-index: 2000;
        }
        #notification.show {
            transform: translate(-50%, 0);
        }
        #notification.success { background: var(--success-color); }
        #notification.error { background: var(--danger-color); }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="header">
            <h1>Dán <span>&</span> Gửi đi</h1>
            <p>Dán từ clipboard (Ctrl+V) hoặc tải tệp lên</p>
        </header>

        <div id="paste-box">
            <div id="placeholder-content">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                    <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                </svg>
                <span>Dán hoặc chờ tải tệp lên...</span>
            </div>
            <div id="output-content"></div>
        </div>

        <div class="action-buttons">
            <button id="upload-btn" class="btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>Tải lên</span>
            </button>
            <a id="download-btn" class="btn hidden" download>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>Tải xuống</span>
            </a>
            <button id="send-telegram-btn" class="btn hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083l6-15Zm-1.833 1.89L6.637 10.07l-4.718-2.984 11.898-7.538Z"/>
                </svg>
                <span>Gửi Telegram</span>
            </button>
            <button id="clear-btn" class="btn hidden">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                <span>Xóa</span>
            </button>
        </div>
    </div>
    
    <!-- Hidden file input -->
    <input type="file" id="file-input" hidden>

    <!-- Notification -->
    <div id="notification"></div>

    <script>
        // --- CONFIGURATION ---
        // !!! THAY THẾ THÔNG TIN CỦA BẠN VÀO ĐÂY !!!
        const BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE'; // Dán Bot Token của bạn
        const CHAT_ID = 'YOUR_CHAT_ID_HERE';   // Dán Chat ID của bạn

        // DOM Elements
        const pasteBox = document.getElementById('paste-box');
        const placeholder = document.getElementById('placeholder-content');
        const outputContent = document.getElementById('output-content');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const downloadBtn = document.getElementById('download-btn');
        const sendTelegramBtn = document.getElementById('send-telegram-btn');
        const clearBtn = document.getElementById('clear-btn');
        const notification = document.getElementById('notification');

        // App State
        let objectURL = null;
        let pastedContent = { type: null, data: null };

        // --- Functions ---

        // Handle Paste Event
        function handlePaste(event) {
            event.preventDefault();
            const items = event.clipboardData.items;
            if (!items) return;

            clearContent();

            let foundImage = false;
            for (const item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const imageFile = item.getAsFile();
                    if (imageFile) {
                        pastedContent = { type: 'image', data: imageFile };
                        displayImage(imageFile);
                        foundImage = true;
                        break;
                    }
                }
            }

            if (!foundImage) {
                for (const item of items) {
                    if (item.kind === 'string' && item.type === 'text/plain') {
                        item.getAsString(text => {
                            pastedContent = { type: 'text', data: text };
                            displayText(text);
                        });
                        break;
                    }
                }
            }
        }

        // Handle File Select Event
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            clearContent();

            if (file.type.startsWith('image/')) {
                pastedContent = { type: 'image', data: file };
                displayImage(file);
            } else if (file.type.startsWith('text/') || file.type === '') { // Allow text-like files
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    pastedContent = { type: 'text', data: text };
                    displayText(text);
                };
                reader.readAsText(file);
            } else {
                showNotification('Loại tệp không được hỗ trợ. Vui lòng chọn ảnh hoặc tệp văn bản.', 'error');
            }
        }

        // Display Content
        function displayImage(file) {
            objectURL = URL.createObjectURL(file);
            const img = document.createElement('img');
            img.src = objectURL;
            outputContent.appendChild(img);
            updateUIForNewContent(objectURL, file.name || `anh-dan-tu-clipboard.png`);
        }

        function displayText(text) {
            const textBlob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            objectURL = URL.createObjectURL(textBlob);
            const pre = document.createElement('pre');
            pre.textContent = text;
            outputContent.appendChild(pre);
            updateUIForNewContent(objectURL, 'van-ban-dan.txt');
        }

        // Update UI
        function updateUIForNewContent(url, filename) {
            placeholder.style.opacity = '0';
            pasteBox.classList.add('has-content');
            
            downloadBtn.href = url;
            downloadBtn.download = filename;
            
            downloadBtn.classList.remove('hidden');
            sendTelegramBtn.classList.remove('hidden');
            clearBtn.classList.remove('hidden');
            uploadBtn.classList.add('hidden');
        }

        function clearContent() {
            if (objectURL) URL.revokeObjectURL(objectURL);
            objectURL = null;
            pastedContent = { type: null, data: null };
            outputContent.innerHTML = '';
            placeholder.style.opacity = '1';
            pasteBox.classList.remove('has-content');
            
            downloadBtn.classList.add('hidden');
            sendTelegramBtn.classList.add('hidden');
            clearBtn.classList.add('hidden');
            uploadBtn.classList.remove('hidden');
            
            if (fileInput) {
                fileInput.value = null;
            }
        }
        
        async function sendToTelegram() {
            if (BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE' || CHAT_ID === 'YOUR_CHAT_ID_HERE') {
                showNotification('Vui lòng điền Bot Token và Chat ID trong code.', 'error');
                return;
            }
            if (!pastedContent.data) {
                showNotification('Không có nội dung để gửi.', 'error');
                return;
            }

            sendTelegramBtn.disabled = true;
            sendTelegramBtn.querySelector('span').textContent = 'Đang gửi...';

            try {
                let response;
                if (pastedContent.type === 'text') {
                    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('text', pastedContent.data);
                    response = await fetch(url, { method: 'POST', body: formData });
                } else if (pastedContent.type === 'image') {
                    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', pastedContent.data);
                    response = await fetch(url, { method: 'POST', body: formData });
                }

                const result = await response.json();
                if (result.ok) {
                    showNotification('Đã gửi thành công!', 'success');
                } else {
                    throw new Error(result.description || 'Lỗi không xác định');
                }
            } catch (error) {
                showNotification(`Lỗi: ${error.message}`, 'error');
            } finally {
                sendTelegramBtn.disabled = false;
                sendTelegramBtn.querySelector('span').textContent = 'Gửi Telegram';
            }
        }

        // --- Notifications ---
        let notificationTimeout;
        function showNotification(message, type = 'info') {
            clearTimeout(notificationTimeout);
            notification.textContent = message;
            notification.className = 'notification'; // Reset classes
            notification.classList.add(type);
            notification.classList.add('show');

            notificationTimeout = setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // --- Event Listeners ---
        window.addEventListener('paste', handlePaste);
        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);
        clearBtn.addEventListener('click', clearContent);
        sendTelegramBtn.addEventListener('click', sendToTelegram);

    </script>
</body>
</html>
